name: Lint chart
description: Runs helm lint, a default-values render and the helm-unittest suite against the checked-out chart.

# A composite action rather than a reusable workflow: the steps run inside the
# caller's job, so both callers keep the job name they report to branch
# protection as a status check. Requires the repository to be checked out
# already — a local action is read from the workspace.
runs:
  using: composite
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: latest

    - name: Install helm-unittest plugin
      shell: bash
      run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

    - name: Lint
      shell: bash
      run: helm lint .

    - name: Template (default values)
      shell: bash
      run: helm template my-app .

    - name: Run unit tests
      shell: bash
      run: helm unittest .
