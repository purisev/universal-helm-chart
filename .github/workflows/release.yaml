name: Release

on:
  push:
    tags:
      - 'v*'

# Default for every job in this workflow. A job that needs more declares its
# own permissions block, which replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub Release and uploads its assets
      packages: write
      id-token: write # needed for cosign's keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Lint
        run: helm lint .

      - name: Run unit tests
        run: helm unittest .

      - name: Check version pins
        # The tag is the version this artifact will be published under, so
        # Chart.yaml has to agree with it, and the docs have to agree with
        # Chart.yaml. Cheaper to stop here than to unpublish from GHCR.
        env:
          TARGET_REFS: ${{ github.ref_name }}
        run: bash .github/scripts/check-version-pins.sh

      - name: Read release notes from CHANGELOG.md
        # Same reasoning as the version pins: a release without notes is
        # cheaper to stop here than to unpublish.
        run: |
          CHART_VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          if grep -q "^## ${CHART_VERSION} - unreleased" CHANGELOG.md; then
            echo "CHANGELOG.md still marks ${CHART_VERSION} as unreleased. Put the release date in its heading." >&2
            exit 1
          fi
          bash .github/scripts/release-notes.sh "${CHART_VERSION}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Log in to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_ACTOR" \
            --password-stdin

      # cosign authenticates via the standard Docker credential store
      # (~/.docker/config.json), not Helm's own registry login above —
      # they're two separate credential mechanisms even against the same
      # registry. Without this, `cosign sign` fails with
      # "UNAUTHORIZED: unauthenticated".
      - name: Log in to GHCR for cosign
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_ACTOR" \
            --password-stdin

      - name: Package chart
        run: helm package .

      - name: Push chart to GHCR
        run: helm push universal-helm-chart-*.tgz oci://ghcr.io/${{ github.repository_owner }}

      - name: Sign the published chart (keyless, via Sigstore)
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          CHART_VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          cosign sign --yes "ghcr.io/${REPO_OWNER}/universal-helm-chart:${CHART_VERSION}"

      # The OCI signature above lives in GHCR. The release assets below carry
      # their own signature and provenance, so the chart can be verified from
      # the GitHub Release alone.
      - name: Sign the packaged chart
        run: |
          CHART_PACKAGE=$(ls universal-helm-chart-*.tgz)
          cosign sign-blob --yes \
            --bundle "${CHART_PACKAGE}.sigstore.json" \
            "${CHART_PACKAGE}"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: universal-helm-chart-*.tgz

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          CHART_PACKAGE=$(ls universal-helm-chart-*.tgz)
          jq -c . "${ATTESTATION_BUNDLE}" > "${CHART_PACKAGE}.intoto.jsonl"
          assets=("${CHART_PACKAGE}" "${CHART_PACKAGE}.sigstore.json" "${CHART_PACKAGE}.intoto.jsonl")
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md"
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            gh release create "${TAG}" "${assets[@]}" \
              --title "${TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --verify-tag
          fi
