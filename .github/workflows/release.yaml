name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # needed for cosign's keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Lint
        run: helm lint .

      - name: Run unit tests
        run: helm unittest .

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Package chart
        run: helm package .

      - name: Push chart to GHCR
        run: helm push universal-helm-chart-*.tgz oci://ghcr.io/${{ github.repository_owner }}

      - name: Sign the published chart (keyless, via Sigstore)
        run: |
          CHART_VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/universal-helm-chart:${CHART_VERSION}"
