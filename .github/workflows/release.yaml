name: Release

on:
  push:
    tags:
      - 'v*'

# Default for every job in this workflow. A job that needs more declares its
# own permissions block, which replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # needed for cosign's keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Lint
        run: helm lint .

      - name: Run unit tests
        run: helm unittest .

      - name: Check version pins
        # The tag is the version this artifact will be published under, so
        # Chart.yaml has to agree with it, and the docs have to agree with
        # Chart.yaml. Cheaper to stop here than to unpublish from GHCR.
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: bash .github/scripts/check-version-pins.sh

      - name: Log in to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_ACTOR" \
            --password-stdin

      # cosign authenticates via the standard Docker credential store
      # (~/.docker/config.json), not Helm's own registry login above —
      # they're two separate credential mechanisms even against the same
      # registry. Without this, `cosign sign` fails with
      # "UNAUTHORIZED: unauthenticated".
      - name: Log in to GHCR for cosign
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_ACTOR" \
            --password-stdin

      - name: Package chart
        run: helm package .

      - name: Push chart to GHCR
        run: helm push universal-helm-chart-*.tgz oci://ghcr.io/${{ github.repository_owner }}

      - name: Sign the published chart (keyless, via Sigstore)
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          CHART_VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          cosign sign --yes "ghcr.io/${REPO_OWNER}/universal-helm-chart:${CHART_VERSION}"
