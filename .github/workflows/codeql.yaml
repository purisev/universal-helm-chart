name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release-*']
  schedule:
    # Weekly on Saturdays.
    - cron: '30 2 * * 6'

# Default for every job in this workflow. A job that needs more declares its
# own permissions block, which replaces this one rather than adding to it.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The chart has no application code. The workflows and the composite
      # action under .github/ are the only code CodeQL has a language for.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions
