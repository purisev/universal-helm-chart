name: E2E

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch: {}

jobs:
  gate:
    name: Check e2e labels
    runs-on: ubuntu-latest
    outputs:
      core-workloads: ${{ steps.check.outputs.core-workloads }}
      jobs: ${{ steps.check.outputs.jobs }}
      autoscaling: ${{ steps.check.outputs.autoscaling }}
      gateway-ingress: ${{ steps.check.outputs.gateway-ingress }}
    steps:
      # `e2e` alone runs every job below; `e2e:<job>` runs just that one.
      # workflow_dispatch always runs everything (there's no label to read).
      - name: Decide which e2e jobs should run
        id: check
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          FULL=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             jq -e 'index("e2e") != null' <<<"$LABELS_JSON" >/dev/null; then
            FULL=true
          fi

          for job in core-workloads jobs autoscaling gateway-ingress; do
            if [[ "$FULL" == "true" ]] || jq -e --arg l "e2e:$job" 'index($l) != null' <<<"$LABELS_JSON" >/dev/null; then
              echo "$job=true" >> "$GITHUB_OUTPUT"
            else
              echo "$job=false" >> "$GITHUB_OUTPUT"
            fi
          done

  e2e-core-workloads:
    name: E2E / core workloads
    needs: gate
    if: needs.gate.outputs.core-workloads == 'true'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: e2e-core-workloads
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: test/e2e/kind/default.yaml
          cluster_name: e2e-core-workloads

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.1.0
        with:
          release: v0.2.15

      - name: Create namespace and secret fixture
        run: |
          kubectl create namespace "$NAMESPACE"
          kubectl apply -n "$NAMESPACE" -f test/e2e/fixtures/core-workloads-secret.yaml

      - name: Install chart
        run: |
          helm upgrade --install e2e . \
            -n "$NAMESPACE" \
            -f test/e2e/values/core-workloads.yaml \
            --wait --timeout 5m

      - name: Run Chainsaw tests
        run: chainsaw test test/e2e/chainsaw/core-workloads --config test/e2e/chainsaw/.chainsaw.yaml

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl get pods -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::Events"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp
          echo "::endgroup::"

          for pod in $(kubectl get pods -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}'); do
            echo "::group::Describe $pod"
            kubectl describe pod "$pod" -n "$NAMESPACE"
            echo "::endgroup::"

            echo "::group::Logs $pod"
            kubectl logs "$pod" -n "$NAMESPACE" --all-containers --prefix || true
            echo "::endgroup::"
          done

  e2e-jobs:
    name: E2E / jobs
    needs: gate
    if: needs.gate.outputs.jobs == 'true'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: e2e-jobs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: test/e2e/kind/default.yaml
          cluster_name: e2e-jobs

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.1.0
        with:
          release: v0.2.15

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: Install chart
        # No --wait here: the suspend and podFailurePolicy scenarios are
        # deliberately suspended or destined to fail, so waiting for every
        # Job to reach a ready/complete state would just time this step out.
        # Each Chainsaw test polls for its own job's expected end state.
        run: |
          helm upgrade --install e2e . \
            -n "$NAMESPACE" \
            -f test/e2e/values/jobs.yaml

      - name: Run Chainsaw tests
        run: chainsaw test test/e2e/chainsaw/jobs --config test/e2e/chainsaw/jobs-config.yaml

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "::group::Jobs"
          kubectl get jobs,cronjobs -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::Pods"
          kubectl get pods -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::Events"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp
          echo "::endgroup::"

          for pod in $(kubectl get pods -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}'); do
            echo "::group::Describe $pod"
            kubectl describe pod "$pod" -n "$NAMESPACE"
            echo "::endgroup::"

            echo "::group::Logs $pod"
            kubectl logs "$pod" -n "$NAMESPACE" --all-containers --prefix || true
            echo "::endgroup::"
          done

  e2e-autoscaling:
    name: E2E / autoscaling
    needs: gate
    if: needs.gate.outputs.autoscaling == 'true'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: e2e-autoscaling
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: test/e2e/kind/default.yaml
          cluster_name: e2e-autoscaling

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.1.0
        with:
          release: v0.2.15

      - name: Install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          # kind's kubelet serving certs aren't signed by a CA metrics-server
          # trusts by default.
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s

      - name: Install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm install keda kedacore/keda -n keda --create-namespace --wait --timeout 3m

      - name: Install VPA
        run: |
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo update
          helm install vpa autoscaler/vertical-pod-autoscaler -n vpa --create-namespace --wait --timeout 3m

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: Install chart
        run: |
          eval "$(bash test/e2e/scripts/keda-cron-window.sh)"
          helm upgrade --install e2e . \
            -n "$NAMESPACE" \
            -f test/e2e/values/autoscaling.yaml \
            --set "deployments.keda-demo.keda.triggers[0].metadata.start=${CRON_START}" \
            --set "deployments.keda-demo.keda.triggers[0].metadata.end=${CRON_END}" \
            --wait --timeout 3m

      - name: Run Chainsaw tests
        run: chainsaw test test/e2e/chainsaw/autoscaling --config test/e2e/chainsaw/autoscaling-config.yaml

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "::group::HPA / ScaledObject / VPA"
          kubectl get hpa,scaledobject,vpa -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::HPA describe"
          kubectl describe hpa -n "$NAMESPACE"
          echo "::endgroup::"

          echo "::group::VPA describe"
          kubectl describe vpa -n "$NAMESPACE"
          echo "::endgroup::"

          echo "::group::KEDA operator logs"
          kubectl logs -n keda -l app=keda-operator --tail=200 || true
          echo "::endgroup::"

          echo "::group::VPA recommender logs"
          kubectl logs -n vpa -l app.kubernetes.io/name=vpa-recommender --tail=200 || true
          echo "::endgroup::"

          echo "::group::Pods"
          kubectl get pods -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::Events"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp
          echo "::endgroup::"

  e2e-gateway-ingress:
    name: E2E / gateway ingress
    needs: gate
    if: needs.gate.outputs.gateway-ingress == 'true'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: e2e-gateway-ingress
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: test/e2e/kind/default.yaml
          cluster_name: e2e-gateway-ingress

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.1.0
        with:
          release: v0.2.15

      - name: Install Gateway API CRDs (experimental channel, needed for TLSRoute)
        run: |
          kubectl apply --server-side \
            -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/experimental-install.yaml

      - name: Install agentgateway
        run: |
          helm upgrade -i --create-namespace \
            --namespace agentgateway-system \
            --version v1.4.1 agentgateway-crds oci://cr.agentgateway.dev/charts/agentgateway-crds
          helm upgrade -i -n agentgateway-system agentgateway oci://cr.agentgateway.dev/charts/agentgateway \
            --version v1.4.1 --wait --timeout 3m
          kubectl wait --timeout=60s gatewayclass/agentgateway --for=condition=Accepted

      - name: Install ingress-nginx
        run: |
          helm upgrade --install ingress-nginx ingress-nginx \
            --repo https://kubernetes.github.io/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            --wait --timeout 3m

      - name: Create namespace and Gateway fixture
        run: |
          kubectl create namespace "$NAMESPACE"
          kubectl apply -n "$NAMESPACE" -f test/e2e/fixtures/gateway-ingress-gateway.yaml

          # The Gateway's Service is provisioned asynchronously by
          # agentgateway once it reconciles the object.
          for i in $(seq 1 30); do
            COUNT=$(kubectl get svc -n "$NAMESPACE" -l gateway.networking.k8s.io/gateway-name=e2e-gateway -o name | wc -l)
            [ "$COUNT" -gt 0 ] && break
            sleep 2
          done

      - name: Install chart
        run: |
          helm upgrade --install e2e . \
            -n "$NAMESPACE" \
            -f test/e2e/values/gateway-ingress.yaml \
            --wait --timeout 3m

      - name: Run Chainsaw tests
        run: chainsaw test test/e2e/chainsaw/gateway-ingress --config test/e2e/chainsaw/gateway-ingress-config.yaml

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "::group::Ingress / HTTPRoute / GRPCRoute / TLSRoute / Gateway"
          kubectl get ingress,httproute,grpcroute,tlsroute,gateway -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::ingress-nginx controller logs"
          kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=200 || true
          echo "::endgroup::"

          echo "::group::agentgateway control plane logs"
          kubectl logs -n agentgateway-system -l app.kubernetes.io/name=agentgateway --tail=200 || true
          echo "::endgroup::"

          echo "::group::Pods"
          kubectl get pods -A -o wide
          echo "::endgroup::"

          echo "::group::Events"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp
          echo "::endgroup::"
