name: E2E

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch: {}

jobs:
  gate:
    name: Check e2e label
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Decide whether e2e jobs should run
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-core-workloads:
    name: E2E / core workloads
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: e2e-core-workloads
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: test/e2e/kind/default.yaml
          cluster_name: e2e-core-workloads

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.1.0
        with:
          release: v0.2.15

      - name: Create namespace and secret fixture
        run: |
          kubectl create namespace "$NAMESPACE"
          kubectl apply -n "$NAMESPACE" -f test/e2e/fixtures/core-workloads-secret.yaml

      - name: Install chart
        run: |
          helm upgrade --install e2e . \
            -n "$NAMESPACE" \
            -f test/e2e/values/core-workloads.yaml \
            --wait --timeout 5m

      - name: Run Chainsaw tests
        run: chainsaw test test/e2e/chainsaw/core-workloads --config test/e2e/chainsaw/.chainsaw.yaml

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl get pods -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::Events"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp
          echo "::endgroup::"

          for pod in $(kubectl get pods -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}'); do
            echo "::group::Describe $pod"
            kubectl describe pod "$pod" -n "$NAMESPACE"
            echo "::endgroup::"

            echo "::group::Logs $pod"
            kubectl logs "$pod" -n "$NAMESPACE" --all-containers --prefix || true
            echo "::endgroup::"
          done

  e2e-jobs:
    name: E2E / jobs
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: e2e-jobs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: test/e2e/kind/default.yaml
          cluster_name: e2e-jobs

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.1.0
        with:
          release: v0.2.15

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: Install chart
        # No --wait here: the suspend and podFailurePolicy scenarios are
        # deliberately suspended or destined to fail, so waiting for every
        # Job to reach a ready/complete state would just time this step out.
        # Each Chainsaw test polls for its own job's expected end state.
        run: |
          helm upgrade --install e2e . \
            -n "$NAMESPACE" \
            -f test/e2e/values/jobs.yaml

      - name: Run Chainsaw tests
        run: chainsaw test test/e2e/chainsaw/jobs --config test/e2e/chainsaw/jobs-config.yaml

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "::group::Jobs"
          kubectl get jobs,cronjobs -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::Pods"
          kubectl get pods -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::Events"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp
          echo "::endgroup::"

          for pod in $(kubectl get pods -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}'); do
            echo "::group::Describe $pod"
            kubectl describe pod "$pod" -n "$NAMESPACE"
            echo "::endgroup::"

            echo "::group::Logs $pod"
            kubectl logs "$pod" -n "$NAMESPACE" --all-containers --prefix || true
            echo "::endgroup::"
          done

  e2e-autoscaling:
    name: E2E / autoscaling
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: e2e-autoscaling
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: test/e2e/kind/default.yaml
          cluster_name: e2e-autoscaling

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.1.0
        with:
          release: v0.2.15

      - name: Install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          # kind's kubelet serving certs aren't signed by a CA metrics-server
          # trusts by default.
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s

      - name: Install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm install keda kedacore/keda -n keda --create-namespace --wait --timeout 3m

      - name: Install VPA
        run: |
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo update
          helm install vpa autoscaler/vertical-pod-autoscaler -n vpa --create-namespace --wait --timeout 3m

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: Install chart
        run: |
          read -r CRON_START CRON_END < <(bash test/e2e/scripts/keda-cron-window.sh | tr '\n' ' ')
          helm upgrade --install e2e . \
            -n "$NAMESPACE" \
            -f test/e2e/values/autoscaling.yaml \
            --set "deployments.keda-demo.keda.triggers[0].metadata.start=${CRON_START}" \
            --set "deployments.keda-demo.keda.triggers[0].metadata.end=${CRON_END}" \
            --wait --timeout 3m

      - name: Run Chainsaw tests
        run: chainsaw test test/e2e/chainsaw/autoscaling --config test/e2e/chainsaw/autoscaling-config.yaml

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "::group::HPA / ScaledObject / VPA"
          kubectl get hpa,scaledobject,vpa -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::HPA describe"
          kubectl describe hpa -n "$NAMESPACE"
          echo "::endgroup::"

          echo "::group::VPA describe"
          kubectl describe vpa -n "$NAMESPACE"
          echo "::endgroup::"

          echo "::group::KEDA operator logs"
          kubectl logs -n keda -l app=keda-operator --tail=200 || true
          echo "::endgroup::"

          echo "::group::VPA recommender logs"
          kubectl logs -n vpa -l app.kubernetes.io/name=vpa-recommender --tail=200 || true
          echo "::endgroup::"

          echo "::group::Pods"
          kubectl get pods -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::Events"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp
          echo "::endgroup::"
