name: Lint

# Called, never triggered on its own. ci.yaml runs it on every push and pull
# request; e2e.yaml runs it ahead of the kind clusters, so a chart that does
# not lint never reaches them. Keeping it in one file means the two callers
# cannot drift into checking different things.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  chart:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Lint
        run: helm lint .

      - name: Template (default values)
        run: helm template my-app .

      - name: Run unit tests
        run: helm unittest .
