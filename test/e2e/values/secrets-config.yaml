fullnameOverride: e2e

integrations:
  stakater:
    reloader:
      enabled: true

  eso:
    enabled: true
    externalSecrets:
      app-secrets:
        enabled: true
        # This SecretStore is applied by the workflow as a raw fixture
        # (fake provider needs no real backend), not rendered by the chart:
        # the chart's own secretstore.yaml only supports vault/aws/gcpsm.
        # secretStoreRef.name is always <fullname>-<secretStore>, so the
        # fixture is named e2e-fake to match what this renders to.
        secretStore: fake
        refreshInterval: 10s
        targetName: app-secrets
        data:
          GREETING:
            remoteKey: /foo/bar

volumes:
  nginx-cache:
    emptyDir: {}
  nginx-run:
    emptyDir: {}
  tmp:
    emptyDir: {}

volumeMounts:
  api:
    nginx-cache:
      mountPath: /var/cache/nginx
    nginx-run:
      mountPath: /var/run
    tmp:
      mountPath: /tmp

configMaps:
  app-config:
    enabled: true
    mountPath: /etc/app
    data:
      GREETING: hello-v1

deployments:
  api:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: "1.27-alpine"

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
