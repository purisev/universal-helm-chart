fullnameOverride: e2e

integrations:
  stakater:
    reloader:
      enabled: true

  eso:
    enabled: true
    secretStores:
      # A real, single-replica Vault deployed by the Bank-Vaults operator,
      # not a stand-in: its Kubernetes auth method, the policy/role bound to
      # this chart's own ServiceAccount, and the seed value are all
      # configured declaratively in the Vault CR.
      vault-store:
        enabled: true
        provider:
          vault:
            server: http://vault.vault.svc.cluster.local:8200
            path: secret
            version: v2
            auth:
              jwt:
                # The Vault CR enables the Kubernetes auth method at its
                # default mount, "kubernetes" (the chart's own default is
                # "jwt", ESO's generic mount name for this auth style).
                mountPath: kubernetes
                role: e2e-secrets-config
      vault-cluster-store:
        enabled: true
        kind: ClusterSecretStore
        provider:
          vault:
            server: http://vault.vault.svc.cluster.local:8200
            path: secret
            version: v2
            auth:
              jwt:
                mountPath: kubernetes
                role: e2e-secrets-config
                # A ClusterSecretStore has no namespace of its own, so
                # unlike the SecretStore above, the ServiceAccount lookup
                # needs an explicit namespace to find the chart's own SA.
                serviceAccountNamespace: e2e-secrets-config
    externalSecrets:
      # Read via the namespaced SecretStore.
      app-secrets:
        enabled: true
        secretStore: vault-store
        refreshInterval: 10s
        targetName: app-secrets
        data:
          GREETING:
            remoteKey: e2e/app
            property: value
      # Read the exact same Vault path via the ClusterSecretStore instead.
      app-secrets-cluster:
        enabled: true
        secretStore: vault-cluster-store
        storeKind: ClusterSecretStore
        refreshInterval: 10s
        targetName: app-secrets-cluster
        data:
          GREETING:
            remoteKey: e2e/app
            property: value

volumes:
  nginx-cache:
    emptyDir: {}
  nginx-run:
    emptyDir: {}
  tmp:
    emptyDir: {}

volumeMounts:
  api:
    nginx-cache:
      mountPath: /var/cache/nginx
    nginx-run:
      mountPath: /var/run
    tmp:
      mountPath: /tmp

configMaps:
  app-config:
    enabled: true
    mountPath: /etc/app
    data:
      GREETING: hello-v1

deployments:
  api:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: "1.27-alpine"

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
