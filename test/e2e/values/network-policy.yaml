fullnameOverride: e2e

volumes:
  nginx-cache:
    emptyDir: {}
  nginx-run:
    emptyDir: {}
  tmp:
    emptyDir: {}

volumeMounts:
  server:
    nginx-cache:
      mountPath: /var/cache/nginx
    nginx-run:
      mountPath: /var/run
    tmp:
      mountPath: /tmp

deployments:
  server:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: "1.27-alpine"

    service:
      enabled: true
      type: ClusterIP
      port: 80
      targetPort: 8080

    resources:
      requests:
        cpu: 50m
        memory: 32Mi

    # Ingress allowed only from pods labeled network-policy-test: allowed;
    # everything else (including plain cluster traffic that isn't from a
    # matching pod) is denied once this NetworkPolicy selects the pod.
    networkPolicy:
      enabled: true
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  network-policy-test: allowed
          ports:
            - protocol: TCP
              port: 8080
