fullnameOverride: e2e-rg-backend

volumes:
  nginx-cache:
    emptyDir: {}
  nginx-run:
    emptyDir: {}
  tmp:
    emptyDir: {}

volumeMounts:
  backend:
    nginx-cache:
      mountPath: /var/cache/nginx
    nginx-run:
      mountPath: /var/run
    tmp:
      mountPath: /tmp

deployments:
  backend:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: "1.27-alpine"

    service:
      enabled: true
      type: ClusterIP
      port: 80
      targetPort: 8080

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
