fullnameOverride: e2e

volumes:
  nginx-cache:
    emptyDir: {}
  nginx-run:
    emptyDir: {}
  tmp:
    emptyDir: {}

volumeMounts:
  api:
    nginx-cache:
      mountPath: /var/cache/nginx
    nginx-run:
      mountPath: /var/run
    tmp:
      mountPath: /tmp

deployments:
  api:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: "1.27-alpine"

    service:
      enabled: true
      type: ClusterIP
      port: 80
      targetPort: 8080

    resources:
      requests:
        cpu: 50m
        memory: 32Mi

    # Adds this workload's rule to the singleton HTTPRoute below, backed by
    # its own Service/port. An empty rule object is a deliberate catch-all:
    # it gets its backendRef/port filled in from this workload's Service.
    httpRoute:
      enabled: true
      rules:
        - {}

  # Real gRPC backend (registers grpc.reflection too) for the grpcroute
  # test to route actual traffic to, instead of just proving CRD admission.
  grpcbin:
    image:
      repository: moul/grpcbin
      tag: latest
      pullPolicy: Always

    service:
      enabled: true
      type: ClusterIP
      port: 9000
      targetPort: 9000

    resources:
      requests:
        cpu: 50m
        memory: 32Mi

# Classic networking.k8s.io/v1 Ingress, routed through ingress-nginx.
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    e2e.local:
      paths:
        - path: /
          pathType: Prefix
          serviceName: e2e-api
          servicePort: 80

# Gateway API HTTPRoute, routed through the agentgateway-backed Gateway the
# workflow applies as a fixture (the chart only renders *Route kinds, never
# the Gateway itself).
httpRoute:
  enabled: true
  parentRefs:
    - name: e2e-gateway
  hostnames:
    - httproute.e2e.local

# Routed through the same agentgateway listener, to the real grpcbin
# backend above. No `matches` on the rule is deliberate: an omitted match
# catches every RPC on this hostname, which is what lets grpcurl's
# reflection call (a different service than grpcbin.GRPCBin itself) reach
# the backend too.
grpcRoute:
  enabled: true
  parentRefs:
    - name: e2e-gateway
  hostnames:
    - grpcroute.e2e.local
  rules:
    - backendRefs:
        - name: e2e-grpcbin
          port: 9000

# TLSRoute stays CRD-admission only: no listener on the fixture Gateway
# terminates/passes through TLS, so this just proves the chart renders a
# schema-valid object the API server accepts.
tlsRoute:
  enabled: true
  parentRefs:
    - name: e2e-gateway
  hostnames:
    - tlsroute.e2e.local
  rules:
    - backendRefs:
        - name: e2e-api
          port: 80

# Separate HTTPRoute with a backendRef into another namespace, exercised by
# the referencegrant-cross-namespace test: agentgateway must refuse to
# resolve this backend until the chart's own ReferenceGrant template is
# applied in the e2e-gateway-ingress-backend namespace.
httpRoutes:
  referencegrant-cross-ns:
    parentRefs:
      - name: e2e-gateway
    hostnames:
      - referencegrant.e2e.local
    rules:
      - backendRefs:
          - name: e2e-rg-backend-backend
            namespace: e2e-gateway-ingress-backend
            port: 80
