apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prometheus-podmonitor-scrape
spec:
  steps:
    - name: the chart's PodMonitor is a real, healthy scrape target in Prometheus
      try:
        - script:
            timeout: 3m
            content: |
              set -e
              kubectl proxy --port=18001 &
              PROXY_PID=$!
              trap 'kill $PROXY_PID' EXIT
              sleep 2

              # PodMonitor-discovered targets have no `service` label (no
              # Service is involved at all); `container` reliably matches
              # the workload/container name instead.
              RESULT=not-found
              for i in $(seq 1 30); do
                BODY=$(curl -s "http://127.0.0.1:18001/api/v1/namespaces/monitoring/services/prometheus-operated:9090/proxy/api/v1/targets" || true)
                HEALTH=$(echo "$BODY" | jq -r '.data.activeTargets[]? | select(.labels.container=="api-pod") | .health' 2>/dev/null | head -1)
                if [ "$HEALTH" = "up" ]; then
                  RESULT=up
                  break
                fi
                sleep 3
              done

              if [ "$RESULT" != "up" ]; then
                echo "--- last response body ---"
                echo "$BODY"
                echo "--- discovered target labels.container values ---"
                echo "$BODY" | jq -r '.data.activeTargets[]?.labels.container' 2>/dev/null | sort -u
              fi

              echo "result=$RESULT"
            check:
              ($error): ~
              (contains($stdout, 'result=up')): true
