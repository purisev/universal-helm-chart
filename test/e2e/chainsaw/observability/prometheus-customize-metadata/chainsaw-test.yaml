apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prometheus-customize-metadata
spec:
  steps:
    # The scraper selects on e2e-scrape=selected (see the e2e workflow and
    # test/e2e/values/observability.yaml), so prometheus-targets-up and
    # prometheus-podmonitor-scrape passing proves the label is what got the objects
    # discovered. This step pins the label and annotation on the objects.
    - name: integrations.monitoring.customize lands on the scrape objects
      try:
        - assert:
            resource:
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: e2e-api-metrics
                labels:
                  e2e-scrape: selected
                  app.kubernetes.io/instance: e2e-api
                annotations:
                  e2e/owner: observability
        - assert:
            resource:
              apiVersion: monitoring.coreos.com/v1
              kind: PodMonitor
              metadata:
                name: e2e-api-pod-metrics
                labels:
                  e2e-scrape: selected
                  app.kubernetes.io/instance: e2e-api-pod
                annotations:
                  e2e/owner: observability
