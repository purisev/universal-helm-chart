apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: grpcroute-routing
spec:
  steps:
    - name: the grpcroute renders correctly and agentgateway actually proxies a real gRPC call through it
      try:
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: GRPCRoute
              metadata:
                name: e2e
              spec:
                parentRefs:
                  - name: e2e-gateway
                hostnames:
                  - grpcroute.e2e.local
        - script:
            timeout: 60s
            content: |
              set -e
              GW_SVC=$(kubectl get svc -n "$NAMESPACE" \
                -l gateway.networking.k8s.io/gateway-name=e2e-gateway \
                -o jsonpath='{.items[0].metadata.name}')

              # `kubectl run --rm -i` can lose the container's own output if
              # the attach races the pod's deletion, so this runs the pod
              # detached, waits for it to finish, and reads its logs
              # explicitly instead. No --command: the image's own
              # ENTRYPOINT is already grpcurl, so these tokens are its args.
              kubectl run grpc-prober -n "$NAMESPACE" --image=fullstorydev/grpcurl:v1.9.3 \
                --restart=Never -- \
                -plaintext -authority=grpcroute.e2e.local \
                "${GW_SVC}.${NAMESPACE}.svc.cluster.local:80" \
                grpcbin.GRPCBin/DummyUnary -d '{"f_string":"e2e-grpcroute"}'

              for i in $(seq 1 20); do
                PHASE=$(kubectl get pod grpc-prober -n "$NAMESPACE" -o jsonpath='{.status.phase}')
                [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ] && break
                sleep 2
              done

              echo "phase=$PHASE"
              # grpcurl has no proto for grpcbin.GRPCBin, so it discovers the
              # method via the backend's own server reflection — that call
              # only reaches grpcbin because the rendered rule has no
              # `matches`, which makes it a catch-all for every RPC on this
              # hostname (see gateway-ingress.yaml).
              kubectl logs grpc-prober -n "$NAMESPACE"
              kubectl delete pod grpc-prober -n "$NAMESPACE" --ignore-not-found
            check:
              ($error): ~
              (contains($stdout, 'phase=Succeeded')): true
              (contains($stdout, 'e2e-grpcroute')): true
