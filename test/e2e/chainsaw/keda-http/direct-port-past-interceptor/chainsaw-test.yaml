apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: direct-port-past-interceptor
spec:
  steps:
    - name: the pods are running, so a direct port answers from them
      try:
        - apply:
            file: ../_shared/prober-pod.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: prober
              status:
                phase: Running
        - script:
            timeout: 3m
            content: |
              kubectl exec prober -n "$NAMESPACE" -- wget -q -O- --timeout=150 "http://e2e-web/"
            check:
              ($error): ~
              (contains($stdout, 'Welcome to nginx')): true
        - script:
            timeout: 2m
            content: |
              bash "$GITHUB_WORKSPACE/test/e2e/scripts/keda-http-replicas.sh" at-least e2e-web 1 110
            check:
              ($error): ~
              (contains($stdout, 'result=at-least-1')): true
    - name: the direct port has a Service of its own and the ExternalName keeps only http
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: e2e-web-events
              spec:
                type: ClusterIP
                ports:
                  - name: events
                    port: 9000
                    targetPort: 8081
        - assert:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: e2e-web
              spec:
                type: ExternalName
                (length(ports)): 1
                ports:
                  - name: http
    - name: the direct port answers from the pods, and only to callers its NetworkPolicy rule admits
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: direct-prober
                labels:
                  e2e/role: direct-prober
              spec:
                restartPolicy: Never
                terminationGracePeriodSeconds: 1
                containers:
                  - name: prober
                    image: busybox:1.36
                    command: ["sleep", "3600"]
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: direct-prober
              status:
                phase: Running
        - script:
            timeout: 60s
            content: |
              kubectl exec direct-prober -n "$NAMESPACE" -- wget -q -O- --timeout=10 "http://e2e-web-events:9000/"
            check:
              ($error): ~
              (contains($stdout, 'served past the interceptor')): true
        - script:
            timeout: 60s
            content: |
              # e2e-web resolves to the interceptor, which does not serve the port.
              if kubectl exec direct-prober -n "$NAMESPACE" -- wget -q -O- --timeout=5 "http://e2e-web:9000/" >/dev/null 2>&1; then
                echo "result=proxy-serves-direct-port"
              else
                echo "result=proxy-refuses-direct-port"
              fi
              if kubectl exec prober -n "$NAMESPACE" -- wget -q -O- --timeout=5 "http://e2e-web-events:9000/" >/dev/null 2>&1; then
                echo "result=unlabelled-reachable"
              else
                echo "result=unlabelled-blocked"
              fi
            check:
              ($error): ~
              (contains($stdout, 'result=proxy-refuses-direct-port')): true
              (contains($stdout, 'result=unlabelled-blocked')): true
