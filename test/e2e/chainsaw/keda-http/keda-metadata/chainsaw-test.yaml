apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keda-metadata
spec:
  steps:
    - name: the workload's keda labels and annotations land on its InterceptorRoute and ScaledObject
      try:
        - assert:
            resource:
              apiVersion: http.keda.sh/v1beta1
              kind: InterceptorRoute
              metadata:
                name: e2e-web
                labels:
                  e2e/scaler: keda
                annotations:
                  e2e/owner: keda-http
        - assert:
            resource:
              apiVersion: keda.sh/v1alpha1
              kind: ScaledObject
              metadata:
                name: e2e-web
                labels:
                  e2e/scaler: keda
                annotations:
                  e2e/owner: keda-http
