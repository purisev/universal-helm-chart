apiVersion: v1
kind: Pod
metadata:
  name: egress-allowed-target
  labels:
    network-policy-egress-test: allowed
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.27-alpine
      ports:
        - containerPort: 8080
