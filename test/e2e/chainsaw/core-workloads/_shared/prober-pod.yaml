apiVersion: v1
kind: Pod
metadata:
  name: prober
spec:
  restartPolicy: Never
  # Every test that uses this pod applies and deletes it under the same
  # fixed name; the default 30s grace period leaves the previous test's
  # pod stuck Terminating when the next test tries to (re)apply it,
  # which Kubernetes then rejects as an illegal update to an immutable
  # field instead of a fresh create.
  terminationGracePeriodSeconds: 1
  containers:
    - name: prober
      image: busybox:1.36
      command: ["sleep", "3600"]
