apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: service-routing
spec:
  steps:
    - name: the deployment's service load-balances real HTTP traffic across both replicas
      try:
        - apply:
            file: ../_shared/prober-pod.yaml
        - assert:
            file: ../_shared/prober-pod.yaml
        - script:
            content: >-
              kubectl exec prober -n $NAMESPACE --
              wget -q -O- --timeout=5 http://e2e-api.$NAMESPACE.svc.cluster.local/
            check:
              ($error): ~
              (contains($stdout, 'Welcome to nginx')): true
