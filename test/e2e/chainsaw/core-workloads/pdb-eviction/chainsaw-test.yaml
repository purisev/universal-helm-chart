apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pdb-eviction
spec:
  steps:
    - name: minAvailable 1 on a 2-replica deployment allows exactly one voluntary eviction at a time
      try:
        - script:
            timeout: 60s
            content: |
              set -e
              kubectl proxy --port=18001 &
              PROXY_PID=$!
              trap 'kill $PROXY_PID' EXIT
              sleep 2

              PODS=$(kubectl get pods -n "$NAMESPACE" \
                -l app.kubernetes.io/name=api,app.kubernetes.io/instance=e2e-api \
                -o jsonpath='{.items[*].metadata.name}')
              POD1=$(echo "$PODS" | awk '{print $1}')
              POD2=$(echo "$PODS" | awk '{print $2}')

              evict() {
                curl -s -o /dev/null -w '%{http_code}' \
                  -H 'Content-Type: application/json' -X POST \
                  "http://127.0.0.1:18001/api/v1/namespaces/$NAMESPACE/pods/$1/eviction" \
                  -d "{\"apiVersion\":\"policy/v1\",\"kind\":\"Eviction\",\"metadata\":{\"name\":\"$1\",\"namespace\":\"$NAMESPACE\"}}"
              }

              # Fire both evictions concurrently instead of one after another:
              # nginx has no readiness probe, so a replacement pod becomes
              # Ready in well under a second, which would let a sequential
              # second eviction through legitimately and prove nothing. Two
              # requests racing the API server at the same instant against
              # the same disruptionsAllowed=1 budget is what actually
              # exercises the PDB's mutual-exclusion guarantee.
              evict "$POD1" > /tmp/code1 &
              EVICT1_PID=$!
              evict "$POD2" > /tmp/code2 &
              EVICT2_PID=$!
              # Wait only for the two evict jobs, not for kubectl proxy: a
              # bare `wait` waits for every background job, and the proxy
              # runs forever, so that hung this script indefinitely.
              wait "$EVICT1_PID" "$EVICT2_PID"
              CODE1=$(cat /tmp/code1)
              CODE2=$(cat /tmp/code2)

              RESULT=unexpected
              if { [ "$CODE1" = "201" ] || [ "$CODE1" = "200" ]; } && [ "$CODE2" = "429" ]; then
                RESULT=one-allowed-one-blocked
              elif { [ "$CODE2" = "201" ] || [ "$CODE2" = "200" ]; } && [ "$CODE1" = "429" ]; then
                RESULT=one-allowed-one-blocked
              fi

              echo "eviction-codes=$CODE1,$CODE2 result=$RESULT"
            check:
              ($error): ~
              (contains($stdout, 'result=one-allowed-one-blocked')): true
