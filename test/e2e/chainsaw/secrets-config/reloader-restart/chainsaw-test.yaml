apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reloader-restart
spec:
  steps:
    - name: changing the mounted configmap triggers a real rollout restart
      try:
        - script:
            timeout: 2m
            content: |
              set -e
              OLD_POD=$(kubectl get pods -n "$NAMESPACE" \
                -l app.kubernetes.io/name=api,app.kubernetes.io/instance=e2e-api \
                -o jsonpath='{.items[0].metadata.name}')

              kubectl patch configmap e2e-app-config -n "$NAMESPACE" --type merge \
                -p '{"data":{"GREETING":"hello-v2"}}'

              RESULT=no-new-pod
              for i in $(seq 1 30); do
                NEW_POD=$(kubectl get pods -n "$NAMESPACE" \
                  -l app.kubernetes.io/name=api,app.kubernetes.io/instance=e2e-api \
                  --field-selector=status.phase=Running \
                  -o jsonpath='{.items[0].metadata.name}')
                if [ -n "$NEW_POD" ] && [ "$NEW_POD" != "$OLD_POD" ]; then
                  RESULT=restarted
                  break
                fi
                sleep 3
              done

              echo "result=$RESULT"
            check:
              ($error): ~
              (contains($stdout, 'result=restarted')): true
