apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eso-fake-materialization
spec:
  steps:
    - name: ESO pulls from the fake provider and materializes a real secret
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: app-secrets
                # Reloader's annotation propagates through the ExternalSecret's
                # target template to the materialized Secret itself.
                annotations:
                  reloader.stakater.com/auto: "true"
              data:
                # base64("HELLO2") — the fake store's latest version for
                # /foo/bar; a real materialization, not the values.yaml
                # default (hello-v1 belongs to the unrelated ConfigMap).
                GREETING: SEVMTE8y
