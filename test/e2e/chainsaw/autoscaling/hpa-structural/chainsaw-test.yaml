apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: hpa-structural
spec:
  steps:
    - name: the HPA is well-formed and adopted by the controller
      try:
        - assert:
            resource:
              apiVersion: autoscaling/v2
              kind: HorizontalPodAutoscaler
              metadata:
                name: e2e-hpa-demo
              spec:
                scaleTargetRef:
                  kind: Deployment
                  name: e2e-hpa-demo
                minReplicas: 1
                maxReplicas: 3
        # The controller only adds this condition once its reconcile loop
        # has actually processed the object (not just once it's admitted),
        # so its presence is proof of adoption independent of whether real
        # CPU metrics exist. script/command run once and don't retry the
        # way assert does, so the wait for that reconcile pass has to be a
        # loop inside the script itself.
        - script:
            timeout: 60s
            content: |
              set -e
              for i in $(seq 1 20); do
                STATUS=$(kubectl get hpa e2e-hpa-demo -n "$NAMESPACE" \
                  -o jsonpath='{.status.conditions[?(@.type=="AbleToScale")].status}')
                [ "$STATUS" = "True" ] && break
                sleep 3
              done
              echo "AbleToScale=$STATUS"
            check:
              ($error): ~
              (contains($stdout, 'AbleToScale=True')): true
