apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  # The operator names the generated Service vmsingle-<this name>, so this
  # fixture must be named "e2e" to make the Service vmsingle-e2e.
  name: e2e
spec:
  retentionPeriod: "1"
---
# VMSingle only stores data pushed to it — it does no discovery or
# scraping of its own. VMAgent is the component that actually discovers
# VMServiceScrape/VMPodScrape objects, scrapes them, and remote-writes the
# result into VMSingle, so it's this object's /api/v1/targets that reports
# real scrape health, not VMSingle's.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  # The operator names the generated Service vmagent-<this name>.
  name: e2e
spec:
  # Both ...Selector and ...NamespaceSelector default to nil, which means
  # "select nothing" (not "select everything") — this flips that so the
  # agent actually scrapes the chart's rendered VMServiceScrape/VMPodScrape.
  selectAllByDefault: true
  remoteWrite:
    - url: http://vmsingle-e2e.vm.svc.cluster.local:8429/api/v1/write
