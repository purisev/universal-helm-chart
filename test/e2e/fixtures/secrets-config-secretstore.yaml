apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  # secretStoreRef.name is always <fullname>-<secretStore>; the chart's
  # values set integrations.eso.externalSecrets.app-secrets.secretStore to
  # "fake" and fullnameOverride to "e2e", so this must be named e2e-fake.
  name: e2e-fake
spec:
  provider:
    fake:
      # No version field: the fake provider's GetSecret does an exact
      # key+version match (version defaults to "" on both sides), and the
      # chart doesn't expose ExternalSecret's remoteRef.version at all.
      # ESO's own e2e suite for this provider never sets Version either
      # (e2e/suites/provider/cases/fake/provider.go).
      data:
        - key: /foo/bar
          value: HELLO2
