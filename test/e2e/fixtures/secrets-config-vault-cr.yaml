# A real, single-replica Vault deployed by the actual bank-vaults operator
# (not a stand-in), based on the operator's own cr-raft-1.yaml example. TLS is
# disabled on the listener (a documented CR option) so the chart's vault
# SecretStore/ClusterSecretStore, which doesn't support caBundle/caProvider
# yet, can talk to it over plain HTTP.
apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
  namespace: vault
spec:
  size: 1
  serviceAccount: vault
  serviceType: ClusterIP

  # local-path-provisioner (kind's default StorageClass) creates raft's
  # volume owned by root; the operator's own raft-1 example flags this exact
  # chown as required "in the case of using a local kind cluster".
  vaultInitContainers:
    - name: raft-permission
      image: busybox
      command:
        - /bin/sh
        - -c
        - |
          chown -R 100:1000 /vault/file
      volumeMounts:
        - name: vault-raft
          mountPath: /vault/file

  volumeClaimTemplates:
    - metadata:
        name: vault-raft
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  volumeMounts:
    - name: vault-raft
      mountPath: /vault/file

  unsealConfig:
    kubernetes:
      secretNamespace: vault

  config:
    disable_mlock: true
    storage:
      raft:
        path: /vault/file
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_disable: true
    api_addr: http://vault.vault:8200
    cluster_addr: "https://${.Env.POD_NAME}:8201"
    ui: true

  resources:
    vault:
      limits:
        memory: "512Mi"
        cpu: "200m"
      requests:
        memory: "256Mi"
        cpu: "100m"

  # Declarative config the bank-vaults configurer applies on startup, in
  # place of the manual `vault write`/`vault kv put` steps the previous
  # (raw hashicorp/vault dev-mode) attempt needed via kubectl exec.
  externalConfig:
    policies:
      - name: e2e-secrets-config
        rules: |
          path "secret/data/e2e/*" {
            capabilities = ["read"]
          }

    auth:
      - type: kubernetes
        roles:
          - name: e2e-secrets-config
            bound_service_account_names: ["e2e"]
            bound_service_account_namespaces: ["e2e-secrets-config"]
            policies: ["e2e-secrets-config"]
            ttl: 1h

    secrets:
      - path: secret
        type: kv
        description: e2e secrets
        options:
          version: 2

    startupSecrets:
      - type: kv
        path: secret/data/e2e/app
        data:
          data:
            value: vault-secret-value
