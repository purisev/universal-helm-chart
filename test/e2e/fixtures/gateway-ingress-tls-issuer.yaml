apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: e2e-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tlsroute-cert
spec:
  secretName: tlsroute-tls
  commonName: tlsroute.e2e.local
  dnsNames:
    - tlsroute.e2e.local
  issuerRef:
    kind: Issuer
    name: e2e-selfsigned
