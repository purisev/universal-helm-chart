# Flux OCIRepository pointing at the chart's OCI artifact.
#
# Apply with:
#   kubectl apply -f flux/ocirepository.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: universal-helm-chart
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/purisev/universal-helm-chart
  ref:
    tag: "3.0.0"
