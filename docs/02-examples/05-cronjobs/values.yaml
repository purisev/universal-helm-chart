# 05-cronjobs — jobGroups for migrations (Job, PreSync hook) and nightly (CronJob).

jobGroups:

  migrations:
    enabled: true
    kind: Job
    image:
      repository: ghcr.io/example/migrator
      tag: v1.0.0
      pullPolicy: IfNotPresent
    envSecrets:
      - db-credentials                # carries DB_PASSWORD
    hooks:
      argocd:
        hook: PreSync
        syncWave: "-2"                # run before app workloads
        deletePolicy: BeforeHookCreation   # safe with hashSuffix: false; here keep default
    backoffLimit: 2
    ttlSecondsAfterFinished: 3600
    hashSuffix: true
    jobs:
      schema:
        enabled: true
        # Tasks mode — two ordered initContainers inside one Job. SortAlpha order.
        tasks:
          01-structure:
            enabled: true
            command: |
              psql -c "CREATE TABLE IF NOT EXISTS schema_version (id SERIAL PRIMARY KEY)"
          02-seed:
            enabled: true
            args:
              - "seed"
              - "--rows=100"

  nightly:
    enabled: true
    kind: CronJob
    image:
      repository: ghcr.io/example/maintenance
      tag: v0.5.0
    env:
      LOG_LEVEL:
        value: info
    jobs:
      cleanup:
        enabled: true
        schedule: "0 2 * * *"
        timeZone: UTC
        concurrencyPolicy: Forbid
        successfulJobsHistoryLimit: 3
        failedJobsHistoryLimit: 1
        command: ./cleanup.sh
        backoffLimit: 1
      report:
        enabled: true
        schedule: "0 6 * * *"
        timeZone: UTC
        concurrencyPolicy: Replace
        successfulJobsHistoryLimit: 7
        failedJobsHistoryLimit: 3
        command: ./report.sh
        backoffLimit: 0
