# 09-multi-env-overrides — base configuration shared across dev/staging/prod.

# Common labels — every env carries these on every resource.
commonLabels:
  app: orders
  team: orders-team

# Common scrape config — overrides per-env can set monitoring.defaults.enabled
# without restating the rest.
integrations:
  monitoring:
    defaults:
      provider: prometheus
      discovery: crd
      type: service
      port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      exposeService:
        enabled: true
        port: 9090
        targetPort: 9090

# Deployment skeleton — workload exists in every env. Per-env files vary
# image.tag, replicaCount, resources, hpa, env.
deployments:
  api:
    enabled: true
    image:
      repository: ghcr.io/example/orders-api
      pullPolicy: IfNotPresent
      # tag is set per-env
    service:
      enabled: true
      type: ClusterIP
      ports:
        http:
          port: 80
          targetPort: 8080
    metrics:
      enabled: true
    env:
      LOG_LEVEL:
        value: info                 # default; per-env may override
