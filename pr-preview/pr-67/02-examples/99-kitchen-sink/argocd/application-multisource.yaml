# Argo CD Application — multi-source: chart from OCI, values from this chart's repo at v3.0.0.
# The chart's source references a values file inside the second source ($values). This is the
# recommended GitOps shape: chart and values version independently; values changes go through
# code review without touching the Application CR.
#
# This example points at this chart's repo so it works as-is. In your own setup, repoint the
# second source to your config repository and adjust valueFiles.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kitchen-sink
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kitchen-sink
  sources:
    - repoURL: ghcr.io/purisev
      chart: universal-helm-chart
      targetRevision: 3.0.0
      helm:
        releaseName: kitchen-sink
        valueFiles:
          - $values/docs/02-examples/99-kitchen-sink/values.yaml
    - repoURL: https://github.com/purisev/universal-helm-chart.git
      targetRevision: v3.0.0
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
