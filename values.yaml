global:
  env: {}

env: {}

commonLabels: {}
commonAnnotations: {}

labels:
  standard:
    enabled: true
    partOf: true
    name: true
    instance: true
    version: true
    managedBy: true

integrations:

  argocd:

    syncWaves:
      enabled: true
      serviceAccount: -30
      rbac: -30
      secretStore: -20
      externalSecret: -10
      configMap: -10
      service: 0
      imageUpdater: 0
      statefulSet: 10
      deployment: 20
      hpa: 21
      vpa: 21
      scaledObject: 21
      podDisruptionBudget: 21
      serviceMonitor: 21
      podMonitor: 21
      networkPolicy: 25
      referenceGrant: 25
      ingress: 30
      httpRoute: 30
      grpcRoute: 30
      tlsRoute: 30

    imageUpdater:
      enabled: false

      name: ""
      namespace: ""
      annotations: {}


      appNamePattern: ""

      commonUpdateSettings: {}

      writeBackConfig: {}

      images: {}

      applicationRefs: []

  stakater:
    reloader:
      enabled: false

      annotations: {}

  eso:
    enabled: true

    secretStores: {}

    externalSecrets: {}

  monitoring:
    defaults:
      provider: prometheus
      discovery: crd
      enabled: false
      type: service
      port: http
      path: /metrics
      scheme: http
      interval: 60s
      scrapeTimeout: 10s
      exposeService:
        enabled: false
        port: 9090
        targetPort: 9090

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi

revisionHistoryLimit: 10
progressDeadlineSeconds: 600

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

statefulSetUpdateStrategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0

envSecrets: []

envConfigMaps: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  enabled: false
  clusterScoped: false
  rules: []

podAnnotations: {}

jobPodAnnotations: {}

jobCompletionImage: alpine:3.21

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

automountServiceAccountToken: false

terminationGracePeriodSeconds: 30

minReadySeconds: 0

volumes: {}

volumeMounts: {}

configMaps: {}

jobGroups: {}

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: {}
  tls: []
  defaultBackend: {}

ingresses: {}

httpRoute:
  enabled: false
  annotations: {}

  parentRefs: []

  hostnames: []

  rules: []

httpRoutes: {}

grpcRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules: []

grpcRoutes: {}

tlsRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules: []

tlsRoutes: {}

referenceGrant:
  enabled: false
  annotations: {}

  from: []

  to: []

referenceGrants: {}

nodeSelector: {}

tolerations: []

hostAliases: []

affinity: {}

priorityClassName: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1

verticalPodAutoscaler:
  enabled: false
  updateMode: Initial

topologySpreadConstraints: []

deployments: {}

statefulSets: {}