{{- $ctx := . }}
{{- range $wlName := keys $ctx.Values.deployments | sortAlpha }}
{{- $wl := index $ctx.Values.deployments $wlName }}
{{- if ne (index $wl "enabled") false }}
{{- if and $wl.networkPolicy (ne (index $wl.networkPolicy "enabled") false) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uhc.workloadResourceName" (dict "ctx" $ctx "wlName" $wlName) }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 4 }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "networkPolicy") }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "uhc.workloadSelectorLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 6 }}
  {{- $policyTypes := $wl.networkPolicy.policyTypes | default (list "Ingress") }}
  policyTypes:
    {{- toYaml $policyTypes | nindent 4 }}
  {{- $ingress := $wl.networkPolicy.ingress | default list }}
  {{- if and (has "Ingress" $policyTypes) (eq (include "uhc.kedaHttpEnabled" (dict "wl" $wl)) "true") }}
  {{- $ingress = append $ingress (include "uhc.kedaHttpInterceptorPeer" $ctx | fromYaml) }}
  {{- end }}
  {{- with $ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $wl.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $wlName := keys ($ctx.Values.statefulSets | default dict) | sortAlpha }}
{{- $wl := index $ctx.Values.statefulSets $wlName }}
{{- if ne (index $wl "enabled") false }}
{{- if and $wl.networkPolicy (ne (index $wl.networkPolicy "enabled") false) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
