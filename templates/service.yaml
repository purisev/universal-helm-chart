{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- $deploymentSpecs := $ctx.Values.deployments -}}
{{- range $wlName := keys $deploymentSpecs | sortAlpha }}
{{- $wl := index $deploymentSpecs $wlName -}}
{{- $exposeJson := include "uhc.metricsExposeService" (dict "ctx" $ctx "wl" $wl) -}}
{{- $metricsType := ($wl.metrics | default dict).type | default (($ctx.Values.integrations.monitoring.defaults | default dict).type | default "service") -}}
{{- $addMetricsPort := and $exposeJson (ne $metricsType "pod") -}}
{{- $hasMetricsPortAlready := and $wl.service $wl.service.ports (hasKey ($wl.service.ports | default dict) "metrics") -}}
{{- $injectMetricsPort := and $addMetricsPort (not $hasMetricsPortAlready) -}}
{{- if and (ne (index $wl "enabled") false) $wl.service (ne (index $wl.service "enabled") false) }}
{{- include "uhc.plainService" (dict "ctx" $ctx "wl" $wl "releaseName" $releaseName "wlName" $wlName "injectMetricsPort" $injectMetricsPort "exposeJson" $exposeJson) }}
{{- end }}
{{- /* Standalone metrics-only Service for deployments without main service */ -}}
{{- if and (ne (index $wl "enabled") false) $injectMetricsPort (not (and $wl.service (ne (index $wl.service "enabled") false))) }}
{{- $expose := $exposeJson | fromJson }}
{{- $metricsSvcName := printf "%s-%s-metrics" $releaseName $wlName }}
{{- include "uhc.assertNameLength" (dict "name" $metricsSvcName "kind" (printf "standalone metrics Service for workload %q" $wlName)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $metricsSvcName }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 4 }}
  {{- $promAnnots := include "uhc.metricsAnnotations" (dict "ctx" $ctx "wl" $wl "kind" "service") }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "service" "extra" (($promAnnots | fromYaml) | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ $expose.port }}
      targetPort: {{ $expose.targetPort }}
      protocol: TCP
  selector:
    {{- include "uhc.workloadSelectorLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 4 }}
{{- end }}
{{- end }}
{{- $statefulSetSpecs := $ctx.Values.statefulSets | default dict -}}
{{- range $wlName := keys $statefulSetSpecs | sortAlpha }}
{{- $wl := index $statefulSetSpecs $wlName }}
{{- $exposeJson := include "uhc.metricsExposeService" (dict "ctx" $ctx "wl" $wl) -}}
{{- $metricsType := ($wl.metrics | default dict).type | default (($ctx.Values.integrations.monitoring.defaults | default dict).type | default "service") -}}
{{- $addMetricsPort := and $exposeJson (ne $metricsType "pod") -}}
{{- $svcPorts := (($wl.service | default dict).ports) | default dict -}}
{{- $hsPorts := (($wl.headlessService | default dict).ports) | default dict -}}
{{- $hasMetricsPortAlready := or (hasKey $svcPorts "metrics") (hasKey $hsPorts "metrics") -}}
{{- $injectMetricsPort := and $addMetricsPort (not $hasMetricsPortAlready) -}}
{{- $hsEnabled := ne (index ($wl.headlessService | default dict) "enabled") false -}}
{{- $svcEnabled := and $wl.service (ne (index $wl.service "enabled") false) -}}
{{- /* headlessService and service are two independent Services that can coexist:
     headlessService is the governing Service for stable per-pod DNS (StatefulSet
     spec.serviceName always points at it, or at an externally managed Service when
     headlessService.enabled=false); service is always a regular, independently
     rendered Service for client traffic (same shape/name as the Deployment Service),
     never merged into headlessService's spec regardless of headlessService.enabled. */ -}}
{{- if and (ne (index $wl "enabled") false) $hsEnabled }}
{{- include "uhc.headlessService" (dict "ctx" $ctx "wl" $wl "releaseName" $releaseName "wlName" $wlName "injectMetricsPort" (and $injectMetricsPort (not $svcEnabled)) "exposeJson" $exposeJson) }}
{{- end }}
{{- if and (ne (index $wl "enabled") false) $svcEnabled }}
{{- include "uhc.plainService" (dict "ctx" $ctx "wl" $wl "releaseName" $releaseName "wlName" $wlName "injectMetricsPort" $injectMetricsPort "exposeJson" $exposeJson) }}
{{- end }}
{{- end }}
