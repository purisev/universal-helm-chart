{{- $ctx := . }}
{{- include "uhc.assertUniqueServiceNames" $ctx }}
{{- $deploymentSpecs := $ctx.Values.deployments -}}
{{- range $wlName := keys $deploymentSpecs | sortAlpha }}
{{- $wl := index $deploymentSpecs $wlName -}}
{{- $exposeJson := include "uhc.metricsExposeService" (dict "ctx" $ctx "wl" $wl) -}}
{{- $placement := include "uhc.metricsPortPlacement" (dict "ctx" $ctx "wl" $wl "kind" "deployments") | fromJson -}}
{{- if ne (index $wl "enabled") false }}
{{- if and $wl.service (ne (index $wl.service "enabled") false) }}
{{- include "uhc.plainService" (dict "ctx" $ctx "wl" $wl "wlName" $wlName "injectMetricsPort" $placement.injectService "exposeJson" $exposeJson) }}
{{- end }}
{{- /* Standalone metrics-only Service for a workload that renders no Service of its own.
     uhc.metricsOnlyServiceName asserts the name it builds, so a disabled workload
     never reaches it — its names go on no cluster and must not fail the render. */ -}}
{{- $metricsSvcName := include "uhc.metricsOnlyServiceName" (dict "ctx" $ctx "wl" $wl "wlName" $wlName "kind" "deployments") }}
{{- if $metricsSvcName }}
{{- include "uhc.metricsOnlyService" (dict "ctx" $ctx "wl" $wl "wlName" $wlName "name" $metricsSvcName "exposeJson" $exposeJson) }}
{{- end }}
{{- end }}
{{- end }}
{{- $statefulSetSpecs := $ctx.Values.statefulSets | default dict -}}
{{- range $wlName := keys $statefulSetSpecs | sortAlpha }}
{{- $wl := index $statefulSetSpecs $wlName }}
{{- $exposeJson := include "uhc.metricsExposeService" (dict "ctx" $ctx "wl" $wl) -}}
{{- $placement := include "uhc.metricsPortPlacement" (dict "ctx" $ctx "wl" $wl "kind" "statefulSets") | fromJson -}}
{{- $hsEnabled := ne (index ($wl.headlessService | default dict) "enabled") false -}}
{{- $svcEnabled := and $wl.service (ne (index $wl.service "enabled") false) -}}
{{- /* headlessService and service are two independent Services that can coexist:
     headlessService is the governing Service for stable per-pod DNS (StatefulSet
     spec.serviceName always points at it, or at an externally managed Service when
     headlessService.enabled=false); service is always a regular, independently
     rendered Service for client traffic (same shape/name as the Deployment Service),
     never merged into headlessService's spec regardless of headlessService.enabled. */ -}}
{{- if and (ne (index $wl "enabled") false) $hsEnabled }}
{{- include "uhc.headlessService" (dict "ctx" $ctx "wl" $wl "wlName" $wlName "injectMetricsPort" $placement.injectHeadless "exposeJson" $exposeJson) }}
{{- end }}
{{- if and (ne (index $wl "enabled") false) $svcEnabled }}
{{- include "uhc.plainService" (dict "ctx" $ctx "wl" $wl "wlName" $wlName "injectMetricsPort" $placement.injectService "exposeJson" $exposeJson) }}
{{- end }}
{{- /* Neither Service renders, so nothing carries the exposed metrics port and the
     ServiceMonitor would select an object that does not exist. */ -}}
{{- if ne (index $wl "enabled") false }}
{{- $metricsSvcName := include "uhc.metricsOnlyServiceName" (dict "ctx" $ctx "wl" $wl "wlName" $wlName "kind" "statefulSets") }}
{{- if $metricsSvcName }}
{{- include "uhc.metricsOnlyService" (dict "ctx" $ctx "wl" $wl "wlName" $wlName "name" $metricsSvcName "exposeJson" $exposeJson) }}
{{- end }}
{{- end }}
{{- end }}
