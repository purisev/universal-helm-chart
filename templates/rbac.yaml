{{- if and (ne (index .Values.rbac "enabled") false) (not .Values.serviceAccount.create) -}}
{{- fail "rbac.enabled requires serviceAccount.create=true: the Role and RoleBinding generated by this chart bind to the chart-managed ServiceAccount. Either set serviceAccount.create=true (recommended), or set rbac.enabled=false and manage RBAC externally." -}}
{{- end -}}
{{- if and .Values.serviceAccount.create (ne (index .Values.rbac "enabled") false) }}
{{- $lbls := include "uhc.labels" . -}}
{{- $annots := include "uhc.metadataAnnotations" (dict "ctx" . "kind" "rbac") -}}
{{- $clusterScoped := .Values.rbac.clusterScoped | default false -}}
{{- $roleKind := ternary "ClusterRole" "Role" $clusterScoped -}}
{{- $bindingKind := ternary "ClusterRoleBinding" "RoleBinding" $clusterScoped -}}
{{- if and .Values.rbac.aggregationRule (not $clusterScoped) -}}
{{- fail "rbac.aggregationRule is only valid on a ClusterRole. Set rbac.clusterScoped=true, or remove rbac.aggregationRule to keep the namespaced Role." -}}
{{- end -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $roleKind }}
metadata:
  name: {{ include "uhc.fullname" . }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
{{- with .Values.rbac.aggregationRule }}
aggregationRule:
  {{- toYaml . | nindent 2 }}
{{- end }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $bindingKind }}
metadata:
  name: {{ include "uhc.fullname" . }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $roleKind }}
  name: {{ include "uhc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uhc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
