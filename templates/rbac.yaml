{{- if and .Values.rbac.enabled (not .Values.serviceAccount.create) -}}
{{- fail "rbac.enabled requires serviceAccount.create=true: the Role and RoleBinding generated by this chart bind to the chart-managed ServiceAccount. Either set serviceAccount.create=true (recommended), or set rbac.enabled=false and manage RBAC externally." -}}
{{- end -}}
{{- if and .Values.serviceAccount.create .Values.rbac.enabled }}
{{- $lbls := include "uhc.labels" . -}}
{{- $annots := include "uhc.metadataAnnotations" (dict "ctx" . "kind" "rbac") -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "uhc.fullname" . }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "uhc.fullname" . }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "uhc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uhc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
