{{- $ctx := . }}
{{- if $ctx.Values.integrations.eso.enabled -}}
{{- $releaseName := include "uhc.fullname" . -}}
{{- range $storeName := keys ($ctx.Values.integrations.eso.secretStores | default dict) | sortAlpha }}
{{- $store := index $ctx.Values.integrations.eso.secretStores $storeName }}
{{- if and (hasKey $store "enabled") $store.enabled }}
---
apiVersion: {{ include "uhc.esoApiVersion" $ctx }}
kind: {{ $store.kind | default "SecretStore" }}
metadata:
  name: {{ $releaseName }}-{{ $storeName }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $storeName) | nindent 4 }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "secretStore") }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  provider:
    {{- $provider := $store.provider }}
    {{- if hasKey $provider "vault" }}
    {{- $vault := $provider.vault }}
    vault:
      server: {{ $vault.server }}
      path: {{ $vault.path }}
      version: {{ $vault.version | default "v2" }}
      {{- if $vault.namespace }}
      namespace: {{ $vault.namespace }}
      {{- end }}
      auth:
        jwt:
          path: {{ $vault.auth.jwt.mountPath | default "jwt" }}
          role: {{ $vault.auth.jwt.role }}
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: {{ $vault.auth.jwt.serviceAccountRef | default (include "uhc.serviceAccountName" $ctx) }}
            {{- if $vault.auth.jwt.audiences }}
            audiences:
              {{- toYaml $vault.auth.jwt.audiences | nindent 14 }}
            {{- end }}
            expirationSeconds: {{ $vault.auth.jwt.expirationSeconds | default 600 }}
    {{- else if hasKey $provider "aws" }}
    {{- $aws := $provider.aws }}
    aws:
      service: {{ $aws.service | default "SecretsManager" }}
      region: {{ required (printf "integrations.eso.secretStores.%s.provider.aws.region is required" $storeName) $aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $aws.auth.jwt.serviceAccountRef | default (include "uhc.serviceAccountName" $ctx) }}
          {{- if $aws.auth.jwt.audiences }}
          audiences:
            {{- toYaml $aws.auth.jwt.audiences | nindent 12 }}
          {{- end }}
    {{- else if hasKey $provider "gcpsm" }}
    {{- $gcp := $provider.gcpsm }}
    gcpsm:
      projectID: {{ required (printf "integrations.eso.secretStores.%s.provider.gcpsm.projectID is required" $storeName) $gcp.projectID }}
      auth:
        workloadIdentity:
          clusterLocation: {{ required (printf "integrations.eso.secretStores.%s.provider.gcpsm.auth.workloadIdentity.clusterLocation is required" $storeName) $gcp.auth.workloadIdentity.clusterLocation }}
          clusterName: {{ required (printf "integrations.eso.secretStores.%s.provider.gcpsm.auth.workloadIdentity.clusterName is required" $storeName) $gcp.auth.workloadIdentity.clusterName }}
          clusterProjectID: {{ $gcp.auth.workloadIdentity.clusterProjectID | default $gcp.projectID }}
          serviceAccountRef:
            name: {{ $gcp.auth.workloadIdentity.serviceAccountRef | default (include "uhc.serviceAccountName" $ctx) }}
    {{- else }}
    {{- fail (printf "integrations.eso.secretStores.%s.provider must have one of: vault, aws, gcpsm" $storeName) }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
