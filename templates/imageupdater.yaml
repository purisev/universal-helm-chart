{{- if .Values.integrations.argocd.imageUpdater.enabled }}
{{- $iu := .Values.integrations.argocd.imageUpdater -}}
{{- if and $iu.applicationRefs (or $iu.appNamePattern $iu.commonUpdateSettings $iu.writeBackConfig $iu.images) -}}
{{- fail "integrations.argocd.imageUpdater: manual mode (applicationRefs) and shorthand mode (appNamePattern / commonUpdateSettings / writeBackConfig / images) are mutually exclusive. The shorthand fields are only used when applicationRefs is empty (the chart auto-builds a single applicationRef from them); when applicationRefs is set, all settings must be inside each entry, and the top-level shorthand fields are silently ignored. Pick one of the two modes." -}}
{{- end -}}
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: {{ .Values.integrations.argocd.imageUpdater.name | default (include "uhc.fullname" .) }}
  namespace: {{ .Values.integrations.argocd.imageUpdater.namespace | default .Release.Namespace }}
  {{- $lbls := include "uhc.labels" . }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" . "kind" "imageUpdater" "extra" (.Values.integrations.argocd.imageUpdater.annotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  {{- if .Values.integrations.argocd.imageUpdater.applicationRefs }}
  {{- /*
    Manual mode: applicationRefs provided explicitly.
    All settings (commonUpdateSettings, writeBackConfig, images) must be
    defined inside each applicationRef entry.
  */}}
  applicationRefs:
    {{- toYaml .Values.integrations.argocd.imageUpdater.applicationRefs | nindent 4 }}
  {{- else }}
  {{- /*
    Shorthand mode: build a single applicationRef automatically.
    namePattern defaults to .Release.Name when appNamePattern is not set.
    commonUpdateSettings, writeBackConfig and images are placed inside the
    applicationRef — matching the structure Argo CD Image Updater >= 1.x expects.
  */}}
  applicationRefs:
    - namePattern: {{ .Values.integrations.argocd.imageUpdater.appNamePattern | default .Release.Name | quote }}
      {{- with .Values.integrations.argocd.imageUpdater.commonUpdateSettings }}
      commonUpdateSettings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.integrations.argocd.imageUpdater.writeBackConfig }}
      writeBackConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.integrations.argocd.imageUpdater.images }}
      images:
        {{- range $alias := keys . | sortAlpha }}
        {{- $img := index $.Values.integrations.argocd.imageUpdater.images $alias }}
        - alias: {{ $alias }}
          {{- toYaml $img | nindent 10 }}
        {{- end }}
      {{- end }}
  {{- end }}
{{- end }}
