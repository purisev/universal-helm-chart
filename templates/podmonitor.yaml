{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- $defaults := $ctx.Values.monitoring.defaults | default dict -}}
{{- $allWorkloads := include "uhc.serviceWorkloads" $ctx | fromJson -}}
{{- range $wlName := keys $allWorkloads | sortAlpha }}
{{- $wl := index $allWorkloads $wlName -}}
{{- $metrics := $wl.metrics | default dict -}}
{{- $metricsType := $metrics.type | default ($defaults.type | default "service") -}}
{{- $metricsEnabled := eq (include "uhc.metricsEnabled" (dict "ctx" $ctx "wl" $wl)) "true" -}}
{{- $discovery := include "uhc.metricsDiscovery" (dict "ctx" $ctx "wl" $wl) -}}
{{- $provider := include "uhc.metricsProvider" (dict "ctx" $ctx "wl" $wl) -}}
{{- if and $metricsEnabled (eq $metricsType "pod") (ne $discovery "annotations") }}
---
{{- if eq $provider "victoriametrics" }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
{{- else }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
{{- end }}
metadata:
  name: {{ $releaseName }}-{{ $wlName }}-metrics
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "{{ add 1 $ctx.Values.syncWaves.deploymentSyncWave | int }}"
spec:
  selector:
    matchLabels:
      {{- include "uhc.workloadSelectorLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 6 }}
  podMetricsEndpoints:
    {{- include "uhc.scrapeEndpoint" (dict "ctx" $ctx "wl" $wl "provider" $provider) | nindent 4 }}
{{- end }}
{{- end }}
