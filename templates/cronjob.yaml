{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- $cronJobSpecs := $ctx.Values.cronJobs -}}
{{- range $wlName := keys $cronJobSpecs | sortAlpha }}
{{- $wl := index $cronJobSpecs $wlName }}
{{- if and (hasKey $wl "enabled") $wl.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $releaseName }}-{{ $wlName }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 4 }}
spec:
  schedule: {{ required (printf "cronJobs.%s.schedule is required" $wlName) $wl.schedule | quote }}
  {{- with $wl.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  {{- with $wl.concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  {{- if hasKey $wl "successfulJobsHistoryLimit" }}
  successfulJobsHistoryLimit: {{ $wl.successfulJobsHistoryLimit }}
  {{- end }}
  {{- if hasKey $wl "failedJobsHistoryLimit" }}
  failedJobsHistoryLimit: {{ $wl.failedJobsHistoryLimit }}
  {{- end }}
  {{- with $wl.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  jobTemplate:
    spec:
      backoffLimit: {{ default 3 $wl.backoffLimit }}
      {{- with $wl.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . | int }}
      {{- end }}
      {{- with $wl.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . | int }}
      {{- end }}
      template:
        metadata:
          {{- $jobAnnotations := merge ($ctx.Values.jobPodAnnotations | default dict) ($ctx.Values.podAnnotations | default dict) }}
          {{- with $jobAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "uhc.workloadSelectorLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 12 }}
        spec:
          {{- include "uhc.podSpec" (dict "ctx" $ctx "wl" $wl) | nindent 10 }}
          restartPolicy: {{ default "Never" $wl.restartPolicy }}
          containers:
            {{- include "uhc.containerSpec" (dict "ctx" $ctx "wl" $wl "containerName" $wlName) | nindent 12 }}
          {{- $inheritParentVolumes := ne ($wl.useRootVolumes | toString) "false" }}
          {{- if or (and $inheritParentVolumes $ctx.Values.volumes) $wl.volumes }}
          volumes:
            {{- if $inheritParentVolumes }}
            {{- with $ctx.Values.volumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with $wl.volumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- include "uhc.scheduling" (dict "ctx" $ctx "wl" $wl "releaseName" $releaseName "wlName" $wlName) | nindent 10 }}
{{- end }}
{{- end }}
