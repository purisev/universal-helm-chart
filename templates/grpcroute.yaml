{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- /*
Singleton GRPCRoute.
Uses Kubernetes Gateway API (gateway.networking.k8s.io/v1).
Renders when grpcRoute.enabled: true OR when any deployment/statefulSet has grpcRoute.enabled: true.
Per-workload rules are merged in priority order (lower number first), then alphabetically.
serviceName defaults to <fullname>-<workloadName>; servicePort defaults to workload service.port or 50051.
*/}}
{{- $wlState := dict "has" false }}
{{- range $wlName, $wl := .Values.deployments }}
  {{- if and $wl.grpcRoute (ne (index $wl.grpcRoute "enabled") false) }}
    {{- $_ := set $wlState "has" true }}
  {{- end }}
{{- end }}
{{- range $wlName, $wl := .Values.statefulSets }}
  {{- if and $wl.grpcRoute (ne (index $wl.grpcRoute "enabled") false) }}
    {{- $_ := set $wlState "has" true }}
  {{- end }}
{{- end }}
{{- if or .Values.grpcRoute.enabled (get $wlState "has") -}}
{{- if not .Values.grpcRoute.parentRefs -}}
{{- fail "grpcRoute is enabled (root or by a workload) but .Values.grpcRoute.parentRefs is empty. The chart's singleton GRPCRoute model takes parentRefs from the root entry and shares it across every merged per-workload rule — without a parentRef the rendered GRPCRoute attaches to no Gateway and routes no traffic. Set .Values.grpcRoute.parentRefs to the Gateway(s) the route should bind to, or use the plural-map shape (.Values.grpcRoutes.<name>) where each entry carries its own parentRefs." -}}
{{- end -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ $releaseName }}
  {{- $lbls := include "uhc.labels" . }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" . "kind" "grpcRoute" "extra" (.Values.grpcRoute.annotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  {{- if .Values.grpcRoute.parentRefs }}
  parentRefs:
    {{- toYaml .Values.grpcRoute.parentRefs | nindent 4 }}
  {{- end }}
  {{- if .Values.grpcRoute.hostnames }}
  hostnames:
    {{- range .Values.grpcRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
  {{- /* Root-level rules (backward-compatible, rendered first) */}}
  {{- range .Values.grpcRoute.rules }}
    - {{- if .matches }}
      matches:
        {{- toYaml .matches | nindent 8 }}
      {{- end }}
      {{- if .filters }}
      filters:
        {{- toYaml .filters | nindent 8 }}
      {{- end }}
      backendRefs:
      {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
      {{- else }}
        - name: {{ .serviceName | default $releaseName }}
          port: {{ .servicePort | default 50051 }}
      {{- end }}
  {{- end }}
  {{- /* Per-workload rules: sorted by priority (asc) then alphabetically by workload name */}}
  {{- $sortKeys := list }}
  {{- range $wlName, $wl := $ctx.Values.deployments }}
    {{- if and $wl.grpcRoute (ne (index $wl.grpcRoute "enabled") false) }}
      {{- $priority := int ($wl.grpcRoute.priority | default 999999999) }}
      {{- $sortKeys = append $sortKeys (printf "%09d|d|%s" $priority $wlName) }}
    {{- end }}
  {{- end }}
  {{- range $wlName, $wl := $ctx.Values.statefulSets }}
    {{- if and $wl.grpcRoute (ne (index $wl.grpcRoute "enabled") false) }}
      {{- $priority := int ($wl.grpcRoute.priority | default 999999999) }}
      {{- $sortKeys = append $sortKeys (printf "%09d|s|%s" $priority $wlName) }}
    {{- end }}
  {{- end }}
  {{- range $sortKey := $sortKeys | sortAlpha }}
    {{- $parts := splitList "|" $sortKey }}
    {{- $wlType := index $parts 1 }}
    {{- $wlName := index $parts 2 }}
    {{- $wl := dict }}
    {{- if eq $wlType "d" }}
      {{- $wl = index $ctx.Values.deployments $wlName }}
    {{- else }}
      {{- $wl = index $ctx.Values.statefulSets $wlName }}
    {{- end }}
    {{- $svcName := printf "%s-%s" $releaseName $wlName }}
    {{- $svcPort := int (($wl.service | default dict).port | default 50051) }}
    {{- range $wl.grpcRoute.rules }}
    - {{- if .matches }}
      matches:
        {{- toYaml .matches | nindent 8 }}
      {{- end }}
      {{- if .filters }}
      filters:
        {{- toYaml .filters | nindent 8 }}
      {{- end }}
      backendRefs:
      {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
      {{- else }}
        - name: {{ $svcName }}
          port: {{ $svcPort }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- /*
Multi-GRPCRoute map: each key becomes a separate GRPCRoute named <fullname>-<key>.
Mirrors the httpRoutes map — useful when different workloads need separate gRPC routes.
*/}}
{{- range $routeName := keys ($ctx.Values.grpcRoutes | default dict) | sortAlpha }}
{{- $route := index $ctx.Values.grpcRoutes $routeName }}
{{- if ne (index $route "enabled") false }}
{{- if not $route.parentRefs -}}
{{- fail (printf "grpcRoutes.%s is enabled but parentRefs is empty. Each plural-map GRPCRoute carries its own parentRefs — without a parentRef the rendered GRPCRoute attaches to no Gateway and routes no traffic. Set grpcRoutes.%s.parentRefs to the Gateway(s) the route should bind to." $routeName $routeName) -}}
{{- end -}}
{{- $grFullName := printf "%s-%s" $releaseName $routeName }}
{{- include "uhc.assertSubdomainLength" (dict "name" $grFullName "kind" (printf "GRPCRoute %q" $routeName)) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ $grFullName }}
  {{- $lbls := include "uhc.labels" $ctx }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "grpcRoute" "extra" ($route.annotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  {{- if $route.parentRefs }}
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- end }}
  {{- if $route.hostnames }}
  hostnames:
    {{- range $route.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
  {{- range $route.rules }}
    - {{- if .matches }}
      matches:
        {{- toYaml .matches | nindent 8 }}
      {{- end }}
      {{- if .filters }}
      filters:
        {{- toYaml .filters | nindent 8 }}
      {{- end }}
      backendRefs:
      {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
      {{- else }}
        - name: {{ .serviceName | default $releaseName }}
          port: {{ .servicePort | default 50051 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
