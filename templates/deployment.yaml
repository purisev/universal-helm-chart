{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- $deploymentSpecs := $ctx.Values.deployments -}}
{{- range $wlName := keys $deploymentSpecs | sortAlpha }}
{{- $wl := index $deploymentSpecs $wlName }}
{{- if and (hasKey $wl "enabled") $wl.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $releaseName }}-{{ $wlName }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "deployment" "includeReloader" true) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 4 }}
spec:
  {{- if not (and $wl.keda $wl.keda.enabled) }}
  {{- if not (and $wl.hpa $wl.hpa.enabled) }}
  replicas: {{ $wl.replicaCount | default 1 }}
  {{- end }}
  {{- end }}
  progressDeadlineSeconds: {{ default (default 600 $ctx.Values.progressDeadlineSeconds) $wl.progressDeadlineSeconds | int }}
  revisionHistoryLimit: {{ default 10 $ctx.Values.revisionHistoryLimit }}
  {{- $minReady := int ($wl.minReadySeconds | default $ctx.Values.minReadySeconds | default 0) }}
  {{- if gt $minReady 0 }}
  minReadySeconds: {{ $minReady }}
  {{- end }}
  strategy:
    {{- $updateStrategy := or $wl.strategy $ctx.Values.strategy (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxSurge" 1 "maxUnavailable" 0)) }}
    {{- toYaml $updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "uhc.workloadSelectorLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 6 }}
  template:
    metadata:
      {{- $promAnnots := include "uhc.metricsAnnotations" (dict "ctx" $ctx "wl" $wl "kind" "pod") -}}
      {{- if or $ctx.Values.podAnnotations $promAnnots }}
      annotations:
        {{- with $ctx.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $promAnnots }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 8 }}
    spec:
      {{- include "uhc.podSpec" (dict "ctx" $ctx "wl" $wl) | nindent 6 }}
      {{- if $wl.initContainers }}
      initContainers:
        {{- include "uhc.initContainersSpec" (dict "ctx" $ctx "wl" $wl) | nindent 8 }}
      {{- end }}
      containers:
        {{- include "uhc.containerSpec" (dict "ctx" $ctx "wl" $wl "containerName" $wlName) | nindent 8 }}
        {{- include "uhc.sidecarsSpec" (dict "ctx" $ctx "wl" $wl) | nindent 8 }}
      {{- $inheritParentVolumes := ne ($wl.useRootVolumes | toString) "false" }}
      {{- $cmm := include "uhc.resolveConfigMapMount" ($wl.inherit | default dict) | fromJson }}
      {{- $hasAutoVols := "" }}
      {{- if $cmm.enabled }}
      {{- $hasAutoVols = include "uhc.hasConfigMapAutoVolumes" (dict "ctx" $ctx "granularDisable" $cmm.granular) }}
      {{- end }}
      {{- if or (and $inheritParentVolumes $ctx.Values.volumes) $wl.volumes $hasAutoVols }}
      volumes:
        {{- if $inheritParentVolumes }}
        {{- range $vName := keys ($ctx.Values.volumes | default dict) | sortAlpha }}
        - name: {{ $vName }}
          {{- toYaml (index $ctx.Values.volumes $vName) | nindent 10 }}
        {{- end }}
        {{- end }}
        {{- range $vName := keys ($wl.volumes | default dict) | sortAlpha }}
        - name: {{ $vName }}
          {{- toYaml (index $wl.volumes $vName) | nindent 10 }}
        {{- end }}
        {{- if $cmm.enabled }}
        {{- include "uhc.configMapAutoVolumesFiltered" (dict "ctx" $ctx "granularDisable" $cmm.granular) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- include "uhc.scheduling" (dict "ctx" $ctx "wl" $wl "releaseName" $releaseName "wlName" $wlName) | nindent 6 }}
{{- end }}
{{- end }}
