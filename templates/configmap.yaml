{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}

{{- range $wlName := keys ($ctx.Values.deployments | default dict) | sortAlpha }}
{{- $wl := index $ctx.Values.deployments $wlName -}}
{{- if and (hasKey $wl "enabled") $wl.enabled $wl.createConfigmap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $releaseName }}-{{ $wlName }}-config
  labels:
    {{- include "uhc.labels" $ctx | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
data:
  {{- if $wl.configData }}
  {{- toYaml $wl.configData | nindent 2 }}
  {{- else }}
  {{ required (printf "deployments.%s.configData is required when createConfigmap is true" $wlName) nil }}
  {{- end }}
---
{{- end }}
{{- end }}

{{- range $wlName := keys ($ctx.Values.statefulSets | default dict) | sortAlpha }}
{{- $wl := index $ctx.Values.statefulSets $wlName -}}
{{- if and (hasKey $wl "enabled") $wl.enabled $wl.createConfigmap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $releaseName }}-{{ $wlName }}-config
  labels:
    {{- include "uhc.labels" $ctx | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
data:
  {{- if $wl.configData }}
  {{- toYaml $wl.configData | nindent 2 }}
  {{- else }}
  {{ required (printf "statefulSets.%s.configData is required when createConfigmap is true" $wlName) nil }}
  {{- end }}
---
{{- end }}
{{- end }}

{{- range $cmName := keys ($ctx.Values.configMaps | default dict) | sortAlpha }}
{{- $cm := index $ctx.Values.configMaps $cmName }}
{{- if and (hasKey $cm "enabled") $cm.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $releaseName }}-{{ $cmName }}
  labels:
    {{- include "uhc.labels" $ctx | nindent 4 }}
data:
  {{- if $cm.data }}
  {{- toYaml $cm.data | nindent 2 }}
  {{- else }}
  {{ required (printf "configMaps.%s.data is required when enabled" $cmName) nil }}
  {{- end }}
{{- end }}
{{- end }}
