{{- $ctx := . }}
{{- if $ctx.Values.integrations.eso.enabled -}}
{{- $releaseName := include "uhc.fullname" . -}}
{{- range $esName := keys ($ctx.Values.integrations.eso.externalSecrets | default dict) | sortAlpha }}
{{- $es := index $ctx.Values.integrations.eso.externalSecrets $esName }}
{{- if and (hasKey $es "enabled") $es.enabled }}
{{- if and (not $es.data) (not $es.dataFrom) -}}
{{- fail (printf "integrations.eso.externalSecrets.%s requires either `data` (per-key remote refs) or `dataFrom` (extract whole secrets) to be set; both empty would render an ExternalSecret with no payload, which the operator accepts but produces no Secret. See ADR 015 for the data vs dataFrom decision." $esName) -}}
{{- end -}}
---
apiVersion: {{ include "uhc.esoApiVersion" $ctx }}
kind: ExternalSecret
metadata:
  name: {{ $releaseName }}-{{ $esName }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $esName) | nindent 4 }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "externalSecret") }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ $es.storeKind | default "SecretStore" }}
    name: {{ $releaseName }}-{{ required (printf "integrations.eso.externalSecrets.%s.secretStore is required" $esName) $es.secretStore }}
  target:
    name: {{ $es.targetName | default $esName }}
    creationPolicy: Owner
    {{- $relAnnots := (include "uhc.reloaderAnnotations" $ctx | fromYaml) | default dict }}
    {{- $hasType := and $es.type (ne $es.type "Opaque") }}
    {{- if or $hasType $relAnnots }}
    template:
      {{- if $hasType }}
      type: {{ $es.type }}
      {{- end }}
      {{- if $relAnnots }}
      metadata:
        annotations:
          {{- toYaml $relAnnots | nindent 10 }}
      {{- end }}
    {{- end }}
  {{- if $es.data }}
  data:
    {{- range $secretKey := keys $es.data | sortAlpha }}
    {{- $d := index $es.data $secretKey }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ required (printf "integrations.eso.externalSecrets.%s.data.%s.remoteKey is required" $esName $secretKey) $d.remoteKey }}
        property: {{ required (printf "integrations.eso.externalSecrets.%s.data.%s.property is required" $esName $secretKey) $d.property }}
        conversionStrategy: {{ $d.conversionStrategy | default "Default" }}
        decodingStrategy: {{ $d.decodingStrategy | default "None" }}
        metadataPolicy: {{ $d.metadataPolicy | default "None" }}
    {{- end }}
  {{- end }}
  {{- if $es.dataFrom }}
  dataFrom:
    {{- range $es.dataFrom }}
    - extract:
        key: {{ required "integrations.eso.externalSecrets entry requires dataFrom[].remoteKey" .remoteKey }}
        conversionStrategy: {{ .conversionStrategy | default "Default" }}
        decodingStrategy: {{ .decodingStrategy | default "None" }}
        metadataPolicy: {{ .metadataPolicy | default "None" }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
