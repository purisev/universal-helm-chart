{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- range $esName := keys ($ctx.Values.externalSecrets | default dict) | sortAlpha }}
{{- $es := index $ctx.Values.externalSecrets $esName }}
{{- if and (hasKey $es "enabled") $es.enabled }}
---
apiVersion: {{ include "uhc.esoApiVersion" $ctx }}
kind: ExternalSecret
metadata:
  name: {{ $releaseName }}-{{ $esName }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $esName) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ $es.storeKind | default "SecretStore" }}
    name: {{ $releaseName }}-{{ required (printf "externalSecrets.%s.secretStore is required" $esName) $es.secretStore }}
  target:
    name: {{ $es.targetName | default $esName }}
    creationPolicy: Owner
    {{- if and $es.type (ne $es.type "Opaque") }}
    template:
      type: {{ $es.type }}
    {{- end }}
  {{- if $es.data }}
  data:
    {{- range $es.data }}
    - secretKey: {{ required "externalSecrets data entry requires secretKey" .secretKey }}
      remoteRef:
        key: {{ required "externalSecrets data entry requires remoteKey" .remoteKey }}
        property: {{ required "externalSecrets data entry requires property" .property }}
        conversionStrategy: {{ .conversionStrategy | default "Default" }}
        decodingStrategy: {{ .decodingStrategy | default "None" }}
        metadataPolicy: {{ .metadataPolicy | default "None" }}
    {{- end }}
  {{- end }}
  {{- if $es.dataFrom }}
  dataFrom:
    {{- range $es.dataFrom }}
    - extract:
        key: {{ required "externalSecrets dataFrom entry requires remoteKey" .remoteKey }}
        conversionStrategy: {{ .conversionStrategy | default "Default" }}
        decodingStrategy: {{ .decodingStrategy | default "None" }}
        metadataPolicy: {{ .metadataPolicy | default "None" }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
