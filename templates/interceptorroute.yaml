{{- $ctx := . }}
{{- include "uhc.assertUniqueInterceptorRouteNames" $ctx }}
{{- range $kind := list "deployments" "statefulSets" }}
{{- $specs := index $ctx.Values $kind | default dict }}
{{- range $wlName := keys $specs | sortAlpha }}
{{- $wl := index $specs $wlName }}
{{- if eq (include "uhc.kedaHttpEnabled" (dict "wl" $wl)) "true" }}
{{- /* A cluster that serves KEDA but not the add-on's API would accept the ScaledObject
     and reject this route. Offline rendering knows neither API and is let through. */ -}}
{{- if and ($ctx.Capabilities.APIVersions.Has "keda.sh/v1alpha1") (not ($ctx.Capabilities.APIVersions.Has "http.keda.sh/v1beta1")) }}
{{- fail (printf "%s.%s.keda.http needs the KEDA HTTP add-on v0.14.0 or later, but the cluster serves keda.sh/v1alpha1 without http.keda.sh/v1beta1 (InterceptorRoute)." $kind $wlName) }}
{{- end }}
{{- include "uhc.assertKedaHttp" (dict "ctx" $ctx "wl" $wl "wlName" $wlName "kind" $kind) }}
{{- $http := $wl.keda.http }}
{{- $hosts := include "uhc.kedaHttpHosts" (dict "ctx" $ctx "wl" $wl "wlName" $wlName "kind" $kind) | fromJsonArray }}
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: {{ include "uhc.workloadResourceName" (dict "ctx" $ctx "wlName" $wlName) }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName "extra" ($wl.keda.labels | default dict)) | nindent 4 }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "interceptorRoute" "extra" ($wl.keda.annotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  target:
    service: {{ include "uhc.kedaHttpOriginServiceName" (dict "ctx" $ctx "wl" $wl "wlName" $wlName) }}
    portName: http
  rules:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
  scalingMetric:
    {{- toYaml ($http.scalingMetric | default (dict "concurrency" (dict "targetValue" 100))) | nindent 4 }}
  {{- with $http.coldStart }}
  coldStart:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $http.timeouts }}
  timeouts:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* One more route per keda.http.routes entry: same hosts, its own paths, the
     origin Service's port of that name as target. The interceptor picks the route
     with the longest matching path. */ -}}
{{- $routed := include "uhc.kedaHttpRoutedPorts" (dict "ctx" $ctx "wl" $wl "wlName" $wlName) | fromJson }}
{{- range $portKey := keys $routed | sortAlpha }}
{{- $r := index $routed $portKey }}
{{- $spec := index $http.routes $r.portName }}
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: {{ $r.route }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName "extra" ($wl.keda.labels | default dict)) | nindent 4 }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "interceptorRoute" "extra" ($wl.keda.annotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  target:
    service: {{ include "uhc.kedaHttpOriginServiceName" (dict "ctx" $ctx "wl" $wl "wlName" $wlName) }}
    portName: {{ $r.portName }}
  rules:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      paths:
        {{- range $spec.paths }}
        - value: {{ . | quote }}
        {{- end }}
  scalingMetric:
    {{- toYaml ($spec.scalingMetric | default (dict "concurrency" (dict "targetValue" 100))) | nindent 4 }}
  {{- with $spec.coldStart }}
  coldStart:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.timeouts }}
  timeouts:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
