{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- $statefulSetSpecs := $ctx.Values.statefulSets | default dict -}}
{{- range $wlName := keys $statefulSetSpecs | sortAlpha }}
{{- $wl := index $statefulSetSpecs $wlName }}
{{- if ne (index $wl "enabled") false }}
{{- $hsOptedOut := eq (index ($wl.headlessService | default dict) "enabled") false -}}
{{- if and $hsOptedOut (not $wl.serviceName) -}}
{{- fail (printf "statefulSets.%s: headlessService.enabled=false requires serviceName to point at an existing headless Service. Kubernetes rejects a StatefulSet whose spec.serviceName resolves to no Service. Set statefulSets.%s.serviceName to the name of the externally managed Service that provides stable per-pod DNS for these pods." $wlName $wlName) -}}
{{- end -}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $releaseName }}-{{ $wlName }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "statefulSet" "includeReloader" true "extra" ($wl.metadataAnnotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
  labels:
    {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 4 }}
spec:
  serviceName: {{ $wl.serviceName | default (printf "%s-%s-headless" $releaseName $wlName) }}
  {{- with $wl.podManagementPolicy }}
  podManagementPolicy: {{ . }}
  {{- end }}
  {{- with $wl.persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $wl.ordinals }}
  ordinals:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not (and $wl.keda $wl.keda.enabled) }}
  {{- if not (and $wl.hpa $wl.hpa.enabled) }}
  {{- $replicas := 1 }}
  {{- if hasKey $wl "replicaCount" }}
  {{- $replicas = $wl.replicaCount }}
  {{- end }}
  replicas: {{ $replicas }}
  {{- end }}
  {{- end }}
  revisionHistoryLimit: {{ default 10 $ctx.Values.revisionHistoryLimit }}
  {{- $minReady := int ($wl.minReadySeconds | default $ctx.Values.minReadySeconds | default 0) }}
  {{- if gt $minReady 0 }}
  minReadySeconds: {{ $minReady }}
  {{- end }}
  updateStrategy:
    {{- /*
    Prefer per-workload statefulSetUpdateStrategy, then root statefulSetUpdateStrategy,
    then per-workload strategy (backward compat), then Deployment-style root strategy (type only).
    StatefulSet rolling update uses 'partition', not maxSurge/maxUnavailable.
    */}}
    {{- $updateStrategy := $wl.statefulSetUpdateStrategy | default $ctx.Values.statefulSetUpdateStrategy | default $wl.strategy | default (dict "type" "RollingUpdate") }}
    type: {{ $updateStrategy.type | default "RollingUpdate" }}
    {{- if eq ($updateStrategy.type | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      partition: {{ default 0 $updateStrategy.rollingUpdate.partition }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "uhc.workloadSelectorLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 6 }}
  template:
    metadata:
      {{- $promAnnots := include "uhc.metricsAnnotations" (dict "ctx" $ctx "wl" $wl "kind" "pod") -}}
      {{- $podAnnots := mergeOverwrite (deepCopy ($ctx.Values.podAnnotations | default dict)) ($wl.podAnnotations | default dict) -}}
      {{- if or $podAnnots $promAnnots }}
      annotations:
        {{- with $podAnnots }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $promAnnots }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "uhc.workloadLabels" (dict "ctx" $ctx "workloadName" $wlName) | nindent 8 }}
    spec:
      {{- include "uhc.podSpec" (dict "ctx" $ctx "wl" $wl) | trim | nindent 6 }}
      {{- if $wl.initContainers }}
      initContainers:
        {{- include "uhc.initContainersSpec" (dict "ctx" $ctx "wl" $wl) | trim | nindent 8 }}
      {{- end }}
      containers:
        {{- include "uhc.containerSpec" (dict "ctx" $ctx "wl" $wl "containerName" $wlName "renderDirectPorts" true) | trim | nindent 8 }}
        {{- $sidecars := include "uhc.sidecarsSpec" (dict "ctx" $ctx "wl" $wl) | trim }}
        {{- if $sidecars }}
        {{- $sidecars | nindent 8 }}
        {{- end }}
      {{- $inheritParentVolumes := true }}
      {{- if hasKey $wl "useRootVolumes" }}
      {{- $inheritParentVolumes = $wl.useRootVolumes }}
      {{- end }}
      {{- $cmm := include "uhc.resolveConfigMapMount" ($wl.inherit | default dict) | fromJson }}
      {{- $hasAutoVols := "" }}
      {{- if $cmm.enabled }}
      {{- $hasAutoVols = include "uhc.hasConfigMapAutoVolumes" (dict "ctx" $ctx "granularDisable" $cmm.granular) }}
      {{- end }}
      {{- if or (and $inheritParentVolumes $ctx.Values.volumes) $wl.volumes $hasAutoVols }}
      volumes:
        {{- if $inheritParentVolumes }}
        {{- range $vName := keys ($ctx.Values.volumes | default dict) | sortAlpha }}
        - name: {{ $vName }}
          {{- toYaml (index $ctx.Values.volumes $vName) | nindent 10 }}
        {{- end }}
        {{- end }}
        {{- range $vName := keys ($wl.volumes | default dict) | sortAlpha }}
        - name: {{ $vName }}
          {{- toYaml (index $wl.volumes $vName) | nindent 10 }}
        {{- end }}
        {{- if $cmm.enabled }}
        {{- include "uhc.configMapAutoVolumesFiltered" (dict "ctx" $ctx "granularDisable" $cmm.granular) | trim | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- $sched := include "uhc.scheduling" (dict "ctx" $ctx "wl" $wl "releaseName" $releaseName "wlName" $wlName) | trim }}
      {{- if $sched }}
      {{- $sched | nindent 6 }}
      {{- end }}
  {{- with $wl.volumeClaimTemplates }}
  volumeClaimTemplates:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
