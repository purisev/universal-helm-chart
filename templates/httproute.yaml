{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- /*
Singleton HTTPRoute.
Uses Kubernetes Gateway API (gateway.networking.k8s.io/v1).
Renders when httpRoute.enabled: true OR when any deployment/statefulSet has httpRoute.enabled: true.
Per-workload rules are merged in priority order (lower number first), then alphabetically.
serviceName defaults to <fullname>-<workloadName>; servicePort defaults to workload service.port.
parentRefs and hostnames come from root httpRoute and are shared by all merged rules.
*/}}
{{- $wlState := dict "has" false }}
{{- range $wlName, $wl := .Values.deployments }}
  {{- if and $wl.httpRoute (ne (index $wl.httpRoute "enabled") false) }}
    {{- $_ := set $wlState "has" true }}
  {{- end }}
{{- end }}
{{- range $wlName, $wl := .Values.statefulSets }}
  {{- if and $wl.httpRoute (ne (index $wl.httpRoute "enabled") false) }}
    {{- $_ := set $wlState "has" true }}
  {{- end }}
{{- end }}
{{- if or .Values.httpRoute.enabled (get $wlState "has") -}}
{{- if not .Values.httpRoute.parentRefs -}}
{{- fail "httpRoute is enabled (root or by a workload) but .Values.httpRoute.parentRefs is empty. The chart's singleton HTTPRoute model takes parentRefs from the root entry and shares it across every merged per-workload rule — without a parentRef the rendered HTTPRoute attaches to no Gateway and routes no traffic. Set .Values.httpRoute.parentRefs to the Gateway(s) the route should bind to, or use the plural-map shape (.Values.httpRoutes.<name>) where each entry carries its own parentRefs." -}}
{{- end -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $releaseName }}
  {{- $lbls := include "uhc.labels" . }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" . "kind" "httpRoute" "extra" (.Values.httpRoute.annotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  {{- if .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- include "uhc.gatewayParentRefs" .Values.httpRoute.parentRefs | nindent 4 }}
  {{- end }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
  {{- /* Root-level rules (backward-compatible, rendered first) */}}
  {{- range .Values.httpRoute.rules }}
    - {{ include "uhc.httpRouteRuleSpec" (dict "ctx" $ctx "rule" . "defaultBackend" $releaseName "defaultPort" 80) | nindent 6 | trimPrefix "\n      " }}
  {{- end }}
  {{- /* Per-workload rules: sorted by priority (asc) then alphabetically by workload name */}}
  {{- $sortKeys := list }}
  {{- range $wlName, $wl := $ctx.Values.deployments }}
    {{- if and $wl.httpRoute (ne (index $wl.httpRoute "enabled") false) }}
      {{- $priority := int ($wl.httpRoute.priority | default 999999999) }}
      {{- $sortKeys = append $sortKeys (printf "%09d|d|%s" $priority $wlName) }}
    {{- end }}
  {{- end }}
  {{- range $wlName, $wl := $ctx.Values.statefulSets }}
    {{- if and $wl.httpRoute (ne (index $wl.httpRoute "enabled") false) }}
      {{- $priority := int ($wl.httpRoute.priority | default 999999999) }}
      {{- $sortKeys = append $sortKeys (printf "%09d|s|%s" $priority $wlName) }}
    {{- end }}
  {{- end }}
  {{- range $sortKey := $sortKeys | sortAlpha }}
    {{- $parts := splitList "|" $sortKey }}
    {{- $wlType := index $parts 1 }}
    {{- $wlName := index $parts 2 }}
    {{- $wl := dict }}
    {{- if eq $wlType "d" }}
      {{- $wl = index $ctx.Values.deployments $wlName }}
    {{- else }}
      {{- $wl = index $ctx.Values.statefulSets $wlName }}
    {{- end }}
    {{- $svcName := printf "%s-%s" $releaseName $wlName }}
    {{- $svcPort := int (($wl.service | default dict).port | default 80) }}
    {{- range $wl.httpRoute.rules }}
    - {{ include "uhc.httpRouteRuleSpec" (dict "ctx" $ctx "rule" . "defaultBackend" $svcName "defaultPort" $svcPort) | nindent 6 | trimPrefix "\n      " }}
    {{- end }}
  {{- end }}
{{- end }}
{{- /*
Multi-HTTPRoute map: each key becomes a separate HTTPRoute named <fullname>-<key>.
Mirrors the ingresses map pattern — useful when different workloads in one release
need separate routes (e.g. different parentRefs or hostnames per route).
*/}}
{{- range $routeName := keys ($ctx.Values.httpRoutes | default dict) | sortAlpha }}
{{- $route := index $ctx.Values.httpRoutes $routeName }}
{{- if ne (index $route "enabled") false }}
{{- if not $route.parentRefs -}}
{{- fail (printf "httpRoutes.%s is enabled but parentRefs is empty. Each plural-map HTTPRoute carries its own parentRefs — without a parentRef the rendered HTTPRoute attaches to no Gateway and routes no traffic. Set httpRoutes.%s.parentRefs to the Gateway(s) the route should bind to." $routeName $routeName) -}}
{{- end -}}
{{- $hrFullName := printf "%s-%s" $releaseName $routeName }}
{{- include "uhc.assertSubdomainLength" (dict "name" $hrFullName "kind" (printf "HTTPRoute %q" $routeName)) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $hrFullName }}
  {{- $lbls := include "uhc.labels" $ctx }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "httpRoute" "extra" ($route.annotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  {{- if $route.parentRefs }}
  parentRefs:
    {{- include "uhc.gatewayParentRefs" $route.parentRefs | nindent 4 }}
  {{- end }}
  {{- if $route.hostnames }}
  hostnames:
    {{- range $route.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
  {{- range $route.rules }}
    - {{ include "uhc.httpRouteRuleSpec" (dict "ctx" $ctx "rule" . "defaultBackend" $releaseName "defaultPort" 80) | nindent 6 | trimPrefix "\n      " }}
  {{- end }}
{{- end }}
{{- end }}
