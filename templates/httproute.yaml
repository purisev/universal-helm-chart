{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- /*
Singleton HTTPRoute (backward-compatible with ingress.yaml pattern).
Uses Kubernetes Gateway API (gateway.networking.k8s.io/v1).
Requires a Gateway resource to exist in the cluster (referenced via parentRefs).
*/}}
{{- if .Values.httpRoute.enabled -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $releaseName }}
  labels:
    {{- include "uhc.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- end }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.httpRoute.rules }}
    - {{- if .matches }}
      matches:
        {{- toYaml .matches | nindent 8 }}
      {{- end }}
      {{- if .filters }}
      filters:
        {{- toYaml .filters | nindent 8 }}
      {{- end }}
      backendRefs:
      {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
      {{- else }}
        - name: {{ .serviceName | default $releaseName }}
          port: {{ .servicePort | default 80 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- /*
Multi-HTTPRoute map: each key becomes a separate HTTPRoute named <fullname>-<key>.
Mirrors the ingresses map pattern — useful when different workloads in one release
need separate routes (e.g. different parentRefs or hostnames per route).
*/}}
{{- range $routeName := keys ($ctx.Values.httpRoutes | default dict) | sortAlpha }}
{{- $route := index $ctx.Values.httpRoutes $routeName }}
{{- if and (hasKey $route "enabled") $route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $releaseName }}-{{ $routeName }}
  labels:
    {{- include "uhc.labels" $ctx | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $route.parentRefs }}
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- end }}
  {{- if $route.hostnames }}
  hostnames:
    {{- range $route.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
  {{- range $route.rules }}
    - {{- if .matches }}
      matches:
        {{- toYaml .matches | nindent 8 }}
      {{- end }}
      {{- if .filters }}
      filters:
        {{- toYaml .filters | nindent 8 }}
      {{- end }}
      backendRefs:
      {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
      {{- else }}
        - name: {{ .serviceName | default $releaseName }}
          port: {{ .servicePort | default 80 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
