{{- $ctx := . }}
{{- $releaseName := include "uhc.fullname" . -}}
{{- /*
Singleton TLSRoute.
Uses Kubernetes Gateway API (gateway.networking.k8s.io/v1).
Renders when tlsRoute.enabled: true OR when any deployment/statefulSet has tlsRoute.enabled: true.
Per-workload rules are merged in priority order (lower number first), then alphabetically.
serviceName defaults to <fullname>-<workloadName>; servicePort defaults to workload service.port or 443.
hostnames is required — must be set at root tlsRoute level.
*/}}
{{- $wlState := dict "has" false }}
{{- range $wlName, $wl := .Values.deployments }}
  {{- if and $wl.tlsRoute (ne (index $wl.tlsRoute "enabled") false) }}
    {{- $_ := set $wlState "has" true }}
  {{- end }}
{{- end }}
{{- range $wlName, $wl := .Values.statefulSets }}
  {{- if and $wl.tlsRoute (ne (index $wl.tlsRoute "enabled") false) }}
    {{- $_ := set $wlState "has" true }}
  {{- end }}
{{- end }}
{{- if or .Values.tlsRoute.enabled (get $wlState "has") -}}
{{- if not .Values.tlsRoute.parentRefs -}}
{{- fail "tlsRoute is enabled (root or by a workload) but .Values.tlsRoute.parentRefs is empty. The chart's singleton TLSRoute model takes parentRefs from the root entry and shares it across every merged per-workload rule — without a parentRef the rendered TLSRoute attaches to no Gateway and routes no traffic. Set .Values.tlsRoute.parentRefs to the Gateway(s) the route should bind to, or use the plural-map shape (.Values.tlsRoutes.<name>) where each entry carries its own parentRefs." -}}
{{- end -}}
{{- if not .Values.tlsRoute.hostnames -}}
{{- fail "tlsRoute is enabled (root or by a workload) but .Values.tlsRoute.hostnames is empty. TLSRoute matches purely by SNI hostname — without hostnames the rendered TLSRoute terminates nothing. Set .Values.tlsRoute.hostnames to the SNI value(s) the route should match." -}}
{{- end -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: {{ $releaseName }}
  {{- $lbls := include "uhc.labels" . }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" . "kind" "tlsRoute" "extra" (.Values.tlsRoute.annotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  {{- if .Values.tlsRoute.parentRefs }}
  parentRefs:
    {{- toYaml .Values.tlsRoute.parentRefs | nindent 4 }}
  {{- end }}
  hostnames:
    {{- range .Values.tlsRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
  {{- /* Root-level rules (backward-compatible, rendered first) */}}
  {{- range .Values.tlsRoute.rules }}
    - backendRefs:
      {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
      {{- else }}
        - name: {{ .serviceName | default $releaseName }}
          port: {{ .servicePort | default 443 }}
      {{- end }}
  {{- end }}
  {{- /* Per-workload rules: sorted by priority (asc) then alphabetically by workload name */}}
  {{- $sortKeys := list }}
  {{- range $wlName, $wl := $ctx.Values.deployments }}
    {{- if and $wl.tlsRoute (ne (index $wl.tlsRoute "enabled") false) }}
      {{- $priority := int ($wl.tlsRoute.priority | default 999999999) }}
      {{- $sortKeys = append $sortKeys (printf "%09d|d|%s" $priority $wlName) }}
    {{- end }}
  {{- end }}
  {{- range $wlName, $wl := $ctx.Values.statefulSets }}
    {{- if and $wl.tlsRoute (ne (index $wl.tlsRoute "enabled") false) }}
      {{- $priority := int ($wl.tlsRoute.priority | default 999999999) }}
      {{- $sortKeys = append $sortKeys (printf "%09d|s|%s" $priority $wlName) }}
    {{- end }}
  {{- end }}
  {{- range $sortKey := $sortKeys | sortAlpha }}
    {{- $parts := splitList "|" $sortKey }}
    {{- $wlType := index $parts 1 }}
    {{- $wlName := index $parts 2 }}
    {{- $wl := dict }}
    {{- if eq $wlType "d" }}
      {{- $wl = index $ctx.Values.deployments $wlName }}
    {{- else }}
      {{- $wl = index $ctx.Values.statefulSets $wlName }}
    {{- end }}
    {{- $svcName := printf "%s-%s" $releaseName $wlName }}
    {{- $svcPort := int (($wl.service | default dict).port | default 443) }}
    {{- range $wl.tlsRoute.rules }}
    - backendRefs:
      {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
      {{- else }}
        - name: {{ $svcName }}
          port: {{ $svcPort }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- /*
Multi-TLSRoute map: each key becomes a separate TLSRoute named <fullname>-<key>.
Useful when multiple hostnames or listeners require separate TLS routes.
*/}}
{{- range $routeName := keys ($ctx.Values.tlsRoutes | default dict) | sortAlpha }}
{{- $route := index $ctx.Values.tlsRoutes $routeName }}
{{- if ne (index $route "enabled") false }}
{{- if not $route.parentRefs -}}
{{- fail (printf "tlsRoutes.%s is enabled but parentRefs is empty. Each plural-map TLSRoute carries its own parentRefs — without a parentRef the rendered TLSRoute attaches to no Gateway and routes no traffic. Set tlsRoutes.%s.parentRefs to the Gateway(s) the route should bind to." $routeName $routeName) -}}
{{- end -}}
{{- if not $route.hostnames -}}
{{- fail (printf "tlsRoutes.%s is enabled but hostnames is empty. TLSRoute matches purely by SNI hostname — without hostnames the rendered TLSRoute terminates nothing. Set tlsRoutes.%s.hostnames to the SNI value(s) the route should match." $routeName $routeName) -}}
{{- end -}}
{{- $tlsFullName := printf "%s-%s" $releaseName $routeName }}
{{- include "uhc.assertSubdomainLength" (dict "name" $tlsFullName "kind" (printf "TLSRoute %q" $routeName)) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: {{ $tlsFullName }}
  {{- $lbls := include "uhc.labels" $ctx }}
  {{- if $lbls }}
  labels:
    {{- $lbls | nindent 4 }}
  {{- end }}
  {{- $annots := include "uhc.metadataAnnotations" (dict "ctx" $ctx "kind" "tlsRoute" "extra" ($route.annotations | default dict)) }}
  {{- if $annots }}
  {{- $annots | nindent 2 }}
  {{- end }}
spec:
  {{- if $route.parentRefs }}
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- end }}
  hostnames:
    {{- range $route.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
  {{- range $route.rules }}
    - backendRefs:
      {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
      {{- else }}
        - name: {{ .serviceName | default $releaseName }}
          port: {{ .servicePort | default 443 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
