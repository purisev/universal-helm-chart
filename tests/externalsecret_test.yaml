suite: test externalsecret
templates:
  - externalsecret.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  # --- Basic rendering ---

  - it: should render ExternalSecret with data mode
    values:
      - fixtures/es-data.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - matchRegex:
          path: metadata.name
          pattern: -db-creds$
      - equal:
          path: spec.secretStoreRef.name
          value: test-release-universal-helm-chart-vault-store
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
      - equal:
          path: spec.target.name
          value: db-creds
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.data[0].secretKey
          value: DB_PASSWORD
      - equal:
          path: spec.data[0].remoteRef.key
          value: my-app/db
      - equal:
          path: spec.data[0].remoteRef.property
          value: password

  - it: should render ExternalSecret with dataFrom mode
    values:
      - fixtures/es-datafrom-auto.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.dataFrom[0].extract.key
          value: my-app/tls
      - equal:
          path: spec.dataFrom[0].extract.decodingStrategy
          value: Auto

  - it: should not render ExternalSecret when disabled
    set:
      integrations.eso.externalSecrets.db-creds.enabled: false
      integrations.eso.externalSecrets.db-creds.secretStore: vault-store
    asserts:
      - hasDocuments:
          count: 0

  # --- Default values ---

  - it: should apply default conversionStrategy/decodingStrategy/metadataPolicy for data
    values:
      - fixtures/es-data.yaml
    asserts:
      - equal:
          path: spec.data[0].remoteRef.conversionStrategy
          value: Default
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: None
      - equal:
          path: spec.data[0].remoteRef.metadataPolicy
          value: None

  - it: should apply default conversionStrategy/decodingStrategy/metadataPolicy for dataFrom
    set:
      integrations.eso.externalSecrets.cfg.enabled: true
      integrations.eso.externalSecrets.cfg.secretStore: vault-store
      integrations.eso.externalSecrets.cfg.dataFrom[0].remoteKey: my-app/config
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.conversionStrategy
          value: Default
      - equal:
          path: spec.dataFrom[0].extract.decodingStrategy
          value: None
      - equal:
          path: spec.dataFrom[0].extract.metadataPolicy
          value: None

  - it: should override defaults when explicitly set
    values:
      - fixtures/es-datafrom-overrides.yaml
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.decodingStrategy
          value: Base64
      - equal:
          path: spec.dataFrom[0].extract.metadataPolicy
          value: Fetch

  - it: should use default refreshInterval of 1h
    set:
      integrations.eso.externalSecrets.db-creds.enabled: true
      integrations.eso.externalSecrets.db-creds.secretStore: vault-store
      integrations.eso.externalSecrets.db-creds.dataFrom[0].remoteKey: my-app/db
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: should use custom refreshInterval when set
    set:
      integrations.eso.externalSecrets.db-creds.enabled: true
      integrations.eso.externalSecrets.db-creds.secretStore: vault-store
      integrations.eso.externalSecrets.db-creds.refreshInterval: 24h
      integrations.eso.externalSecrets.db-creds.dataFrom[0].remoteKey: my-app/db
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 24h

  # --- Secret type ---

  - it: should not render target.template when type is Opaque
    set:
      integrations.eso.externalSecrets.db-creds.enabled: true
      integrations.eso.externalSecrets.db-creds.secretStore: vault-store
      integrations.eso.externalSecrets.db-creds.type: Opaque
      integrations.eso.externalSecrets.db-creds.dataFrom[0].remoteKey: my-app/db
    asserts:
      - isNull:
          path: spec.target.template

  - it: should render target.template.type for kubernetes.io/tls
    set:
      integrations.eso.externalSecrets.tls-cert.enabled: true
      integrations.eso.externalSecrets.tls-cert.secretStore: vault-store
      integrations.eso.externalSecrets.tls-cert.type: kubernetes.io/tls
      integrations.eso.externalSecrets.tls-cert.dataFrom[0].remoteKey: my-app/tls
    asserts:
      - equal:
          path: spec.target.template.type
          value: kubernetes.io/tls

  - it: should render target.template.type for dockerconfigjson
    set:
      integrations.eso.externalSecrets.registry.enabled: true
      integrations.eso.externalSecrets.registry.secretStore: vault-store
      integrations.eso.externalSecrets.registry.type: kubernetes.io/dockerconfigjson
      integrations.eso.externalSecrets.registry.dataFrom[0].remoteKey: my-app/registry
    asserts:
      - equal:
          path: spec.target.template.type
          value: kubernetes.io/dockerconfigjson

  # --- targetName ---

  - it: should use map key as target name by default
    set:
      integrations.eso.externalSecrets.db-creds.enabled: true
      integrations.eso.externalSecrets.db-creds.secretStore: vault-store
      integrations.eso.externalSecrets.db-creds.dataFrom[0].remoteKey: my-app/db
    asserts:
      - equal:
          path: spec.target.name
          value: db-creds

  - it: should use targetName when explicitly set
    set:
      integrations.eso.externalSecrets.db-creds.enabled: true
      integrations.eso.externalSecrets.db-creds.secretStore: vault-store
      integrations.eso.externalSecrets.db-creds.targetName: custom-secret-name
      integrations.eso.externalSecrets.db-creds.dataFrom[0].remoteKey: my-app/db
    asserts:
      - equal:
          path: spec.target.name
          value: custom-secret-name

  # --- ClusterSecretStore ---

  - it: should use ClusterSecretStore when storeKind is set
    set:
      integrations.eso.externalSecrets.db-creds.enabled: true
      integrations.eso.externalSecrets.db-creds.secretStore: cluster-vault-store
      integrations.eso.externalSecrets.db-creds.storeKind: ClusterSecretStore
      integrations.eso.externalSecrets.db-creds.dataFrom[0].remoteKey: my-app/db
    asserts:
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore

  # --- API version detection ---

  - it: should use v1beta1 when external-secrets.io/v1 not in capabilities
    set:
      integrations.eso.externalSecrets.db-creds.enabled: true
      integrations.eso.externalSecrets.db-creds.secretStore: vault-store
      integrations.eso.externalSecrets.db-creds.dataFrom[0].remoteKey: my-app/db
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1

  - it: should use v1 when external-secrets.io/v1 is in capabilities
    capabilities:
      apiVersions:
        - external-secrets.io/v1
    set:
      integrations.eso.externalSecrets.db-creds.enabled: true
      integrations.eso.externalSecrets.db-creds.secretStore: vault-store
      integrations.eso.externalSecrets.db-creds.dataFrom[0].remoteKey: my-app/db
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1

  # --- Labels ---

  - it: should render workload labels with part-of
    set:
      integrations.eso.externalSecrets.db-creds.enabled: true
      integrations.eso.externalSecrets.db-creds.secretStore: vault-store
      integrations.eso.externalSecrets.db-creds.dataFrom[0].remoteKey: my-app/db
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: db-creds
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: test-release-universal-helm-chart

  # --- Combined data + dataFrom ---

  - it: should render both data and dataFrom when both are set
    values:
      - fixtures/es-mixed.yaml
    asserts:
      - isNotNull:
          path: spec.data
      - isNotNull:
          path: spec.dataFrom
      - equal:
          path: spec.data[0].secretKey
          value: DB_URL
      - equal:
          path: spec.dataFrom[0].extract.key
          value: my-app/config

  - it: should render data entries in sorted order keyed by secretKey
    set:
      integrations.eso.externalSecrets.app-creds:
        enabled: true
        secretStore: vault-store
        data:
          ZAPI_TOKEN:
            remoteKey: my-app/api
            property: token
          ADB_PASSWORD:
            remoteKey: my-app/db
            property: password
    asserts:
      - lengthEqual:
          path: spec.data
          count: 2
      - equal:
          path: spec.data[0].secretKey
          value: ADB_PASSWORD
      - equal:
          path: spec.data[0].remoteRef.key
          value: my-app/db
      - equal:
          path: spec.data[1].secretKey
          value: ZAPI_TOKEN
