suite: test configmap
templates:
  - configmap.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  # --- chart-level configMaps map ---

  - it: should not render any ConfigMap when configMaps is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render ConfigMap when disabled
    set:
      configMaps.app-config.enabled: false
      configMaps.app-config.data.key: value
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ConfigMap when enabled
    set:
      configMaps.app-config.enabled: true
      configMaps.app-config.data.appconfig: myvalue
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: metadata.name
          pattern: -app-config$
      - equal:
          path: data.appconfig
          value: myvalue

  - it: should render multiple ConfigMaps
    set:
      configMaps.app-config.enabled: true
      configMaps.app-config.data.key: val1
      configMaps.nginx-config.enabled: true
      configMaps.nginx-config.data.key: val2
    asserts:
      - hasDocuments:
          count: 2

  - it: should render ConfigMap with correct labels
    set:
      configMaps.app-config.enabled: true
      configMaps.app-config.data.foo: bar
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  # --- per-workload configMap (createConfigmap) ---

  - it: should render per-workload ConfigMap when createConfigmap true
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.createConfigmap: true
      deployments.web.configData.server_port: "8080"
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: metadata.name
          pattern: -web-config$
      - equal:
          path: data.server_port
          value: "8080"

  - it: should have reloader annotation on per-workload ConfigMap when reloader.enabled
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.createConfigmap: true
      deployments.web.configData.key: value
      integrations.stakater.reloader.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: should NOT have reloader annotation on ConfigMap when reloader.enabled is false (regression)
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.createConfigmap: true
      deployments.web.configData.key: value
    asserts:
      - isNull:
          path: metadata.annotations["reloader.stakater.com/auto"]

  - it: should render per-workload ConfigMap for StatefulSet
    set:
      image.repository: nginx
      image.tag: v1.0.0
      statefulSets.db.enabled: true
      statefulSets.db.createConfigmap: true
      statefulSets.db.configData.pg_hba: "host all all 0.0.0.0/0 md5"
      integrations.stakater.reloader.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: metadata.name
          pattern: -db-config$
      - equal:
          path: data.pg_hba
          value: "host all all 0.0.0.0/0 md5"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  # --- name collisions ---

  - it: should fail fast when a configMaps entry claims a workload's ConfigMap name
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.createConfigmap: true
      deployments.web.configData.app\.conf: key = value
      configMaps.web-config.data.other\.conf: x = y
    asserts:
      - failedTemplate:
          errorPattern: 'is claimed by both deployments.web.createConfigmap and configMaps.web-config'

  - it: should fail fast when a deployment and a statefulSet share a ConfigMap name
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.api.createConfigmap: true
      deployments.api.configData.app\.conf: key = value
      statefulSets.api.createConfigmap: true
      statefulSets.api.configData.app\.conf: key = value
    asserts:
      - failedTemplate:
          errorPattern: 'is claimed by both deployments.api.createConfigmap and statefulSets.api.createConfigmap'

  - it: should fail fast when omitWorkloadSuffix makes a configMaps entry named config collide
    set:
      naming.omitWorkloadSuffix: true
      image.repository: nginx
      image.tag: alpine
      deployments.web.createConfigmap: true
      deployments.web.configData.app\.conf: key = value
      configMaps.config.data.other\.conf: x = y
    asserts:
      - failedTemplate:
          errorPattern: 'is claimed by both deployments.web.createConfigmap and configMaps.config'

  - it: should ignore a disabled configMaps entry when checking for collisions
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.createConfigmap: true
      deployments.web.configData.app\.conf: key = value
      configMaps.web-config.enabled: false
      configMaps.web-config.data.other\.conf: x = y
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-release-universal-helm-chart-web-config

  - it: should ignore a disabled workload when checking for collisions
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: false
      deployments.web.createConfigmap: true
      deployments.web.configData.app\.conf: key = value
      configMaps.web-config.data.other\.conf: x = y
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-release-universal-helm-chart-web-config
