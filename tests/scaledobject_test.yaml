suite: test scaledobject
templates:
  - scaledobject.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not render when no keda enabled
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when both hpa and keda are enabled on the same workload
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: true
      deployments.web.hpa.maxReplicas: 5
      deployments.web.keda.enabled: true
      deployments.web.keda.maxReplicas: 5
      deployments.web.keda.triggers[0].type: cron
      deployments.web.keda.triggers[0].metadata.timezone: UTC
      deployments.web.keda.triggers[0].metadata.start: "0 9 * * 1-5"
      deployments.web.keda.triggers[0].metadata.end: "0 17 * * 1-5"
      deployments.web.keda.triggers[0].metadata.desiredReplicas: "3"
    asserts:
      - failedTemplate:
          errorMessage: "deployments.web: hpa.enabled and keda.enabled are mutually exclusive — both manage spec.replicas. Pick one."

  - it: should render ScaledObject for Deployment when keda enabled
    values:
      - fixtures/keda-deployment.yaml
    asserts:
      - isKind:
          of: ScaledObject
      - equal:
          path: apiVersion
          value: keda.sh/v1alpha1

  - it: should have correct name for Deployment ScaledObject
    values:
      - fixtures/keda-deployment.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: -worker$

  - it: should target Deployment kind
    values:
      - fixtures/keda-deployment.yaml
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment

  - it: should set minReplicaCount and maxReplicaCount
    values:
      - fixtures/keda-deployment.yaml
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 2
      - equal:
          path: spec.maxReplicaCount
          value: 8

  - it: should default minReplicaCount to 1
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.keda.enabled: true
      deployments.web.keda.maxReplicas: 5
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 1

  - it: should include triggers
    values:
      - fixtures/keda-deployment.yaml
    asserts:
      - isNotNull:
          path: spec.triggers
      - equal:
          path: spec.triggers[0].type
          value: rabbitmq

  - it: should include pollingInterval and cooldownPeriod when set
    values:
      - fixtures/keda-deployment.yaml
    asserts:
      - equal:
          path: spec.pollingInterval
          value: 30
      - equal:
          path: spec.cooldownPeriod
          value: 60

  - it: should render ScaledObject for StatefulSet
    values:
      - fixtures/keda-statefulset.yaml
    asserts:
      - isKind:
          of: ScaledObject
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet
      - matchRegex:
          path: metadata.name
          pattern: -cache$

  - it: should have argocd sync-wave annotation
    values:
      - fixtures/keda-deployment.yaml
    asserts:
      - isNotNull:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: should set envSourceContainerName to workload name
    values:
      - fixtures/keda-deployment.yaml
    asserts:
      - equal:
          path: spec.scaleTargetRef.envSourceContainerName
          value: worker

  - it: should render idleReplicaCount=0 (canonical scale-to-zero signal)
    # KEDA reads idleReplicaCount: 0 as "scale to zero when no triggers fire".
    # A truthiness gate would silently drop the field and KEDA would scale to
    # minReplicaCount (≥1) instead of 0 — losing the entire idle-cost saving.
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.worker.enabled: true
      deployments.worker.keda.enabled: true
      deployments.worker.keda.maxReplicas: 5
      deployments.worker.keda.idleReplicaCount: 0
      deployments.worker.keda.triggers[0].type: kafka
      deployments.worker.keda.triggers[0].metadata.bootstrapServers: kafka:9092
      deployments.worker.keda.triggers[0].metadata.consumerGroup: workers
      deployments.worker.keda.triggers[0].metadata.topic: tasks
      deployments.worker.keda.triggers[0].metadata.lagThreshold: "5"
    asserts:
      - equal:
          path: spec.idleReplicaCount
          value: 0

  - it: should render minReplicaCount=0 (canonical scale-to-zero pair with idleReplicaCount=0)
    # `default 1 $wl.keda.minReplicas` would have collapsed 0 to 1, leaving KEDA
    # unable to scale below 1 even when idleReplicaCount=0 is also set. The
    # hasKey-pattern preserves the explicit zero so KEDA can drive replicas to 0.
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.worker.enabled: true
      deployments.worker.keda.enabled: true
      deployments.worker.keda.minReplicas: 0
      deployments.worker.keda.maxReplicas: 5
      deployments.worker.keda.idleReplicaCount: 0
      deployments.worker.keda.triggers[0].type: kafka
      deployments.worker.keda.triggers[0].metadata.bootstrapServers: kafka:9092
      deployments.worker.keda.triggers[0].metadata.consumerGroup: workers
      deployments.worker.keda.triggers[0].metadata.topic: tasks
      deployments.worker.keda.triggers[0].metadata.lagThreshold: "5"
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 0
      - equal:
          path: spec.idleReplicaCount
          value: 0

  - it: should render cooldownPeriod=0 (no cooldown wait)
    # cooldownPeriod: 0 is a valid KEDA value meaning "scale down immediately
    # when triggers fall below the threshold". A truthiness gate would drop
    # the field and KEDA would fall back to its 300s default.
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.worker.enabled: true
      deployments.worker.keda.enabled: true
      deployments.worker.keda.maxReplicas: 5
      deployments.worker.keda.cooldownPeriod: 0
      deployments.worker.keda.triggers[0].type: kafka
      deployments.worker.keda.triggers[0].metadata.bootstrapServers: kafka:9092
      deployments.worker.keda.triggers[0].metadata.consumerGroup: workers
      deployments.worker.keda.triggers[0].metadata.topic: tasks
      deployments.worker.keda.triggers[0].metadata.lagThreshold: "5"
    asserts:
      - equal:
          path: spec.cooldownPeriod
          value: 0

  # --- keda.advanced ---

  - it: should render the advanced block verbatim
    values:
      - fixtures/keda-advanced.yaml
    asserts:
      - equal:
          path: spec.advanced.restoreToOriginalReplicaCount
          value: true
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.name
          value: worker-hpa
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.stabilizationWindowSeconds
          value: 60
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.policies[0]
          value:
            type: Pods
            value: 1
            periodSeconds: 60
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.stabilizationWindowSeconds
          value: 900
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.policies[0].periodSeconds
          value: 300

  - it: should omit the advanced block when unset
    values:
      - fixtures/keda-deployment.yaml
    asserts:
      - isNull:
          path: spec.advanced

  - it: should render the advanced block on a StatefulSet ScaledObject
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.cache.enabled: true
      statefulSets.cache.keda.enabled: true
      statefulSets.cache.keda.maxReplicas: 6
      statefulSets.cache.keda.triggers[0].type: cron
      statefulSets.cache.keda.triggers[0].metadata.timezone: UTC
      statefulSets.cache.keda.triggers[0].metadata.start: 0 8 * * *
      statefulSets.cache.keda.triggers[0].metadata.end: 0 20 * * *
      statefulSets.cache.keda.triggers[0].metadata.desiredReplicas: "4"
      statefulSets.cache.keda.advanced.restoreToOriginalReplicaCount: true
      statefulSets.cache.keda.advanced.scalingModifiers.formula: cron_trigger
      statefulSets.cache.keda.advanced.scalingModifiers.target: "2"
    asserts:
      - equal:
          path: spec.advanced.restoreToOriginalReplicaCount
          value: true
      - equal:
          path: spec.advanced.scalingModifiers.formula
          value: cron_trigger
      - equal:
          path: spec.advanced.scalingModifiers.target
          value: "2"

  - it: should accept advanced fields the chart does not name
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.worker.enabled: true
      deployments.worker.keda.enabled: true
      deployments.worker.keda.maxReplicas: 5
      deployments.worker.keda.triggers[0].type: cpu
      deployments.worker.keda.triggers[0].metadata.value: "70"
      deployments.worker.keda.advanced.someFutureKedaField: enabled
    asserts:
      - equal:
          path: spec.advanced.someFutureKedaField
          value: enabled

  - it: should scale to zero by default under keda.http
    values:
      - fixtures/keda-http.yaml
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 0

  - it: should keep an explicit minReplicas under keda.http
    values:
      - fixtures/keda-http.yaml
    set:
      deployments.web.keda.minReplicas: 2
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 2

  - it: should render the external-push trigger alone when no triggers are declared
    values:
      - fixtures/keda-http.yaml
    asserts:
      - equal:
          path: spec.triggers
          value:
            - type: external-push
              metadata:
                scalerAddress: keda-add-ons-http-external-scaler.keda:9090
                interceptorRoute: app-web

  - it: should put the external-push trigger before the declared triggers
    values:
      - fixtures/keda-http.yaml
    set:
      deployments.web.keda.triggers:
        - type: cpu
          metricType: Utilization
          metadata: {value: "60"}
    asserts:
      - equal:
          path: spec.triggers
          value:
            - type: external-push
              metadata:
                scalerAddress: keda-add-ons-http-external-scaler.keda:9090
                interceptorRoute: app-web
            - type: cpu
              metricType: Utilization
              metadata: {value: "60"}

  - it: should add a trigger per keda.http.routes entry between the workload's and the declared triggers
    values:
      - fixtures/keda-http.yaml
    set:
      deployments.web.service.ports.stream: {port: 9100}
      deployments.web.service.ports.feed: {port: 9200}
      deployments.web.keda.http.routes:
        stream: {paths: [/stream]}
        feed: {paths: [/feed]}
      deployments.web.keda.triggers:
        - type: cpu
          metricType: Utilization
          metadata: {value: "60"}
    asserts:
      - equal:
          path: spec.triggers
          value:
            - type: external-push
              metadata:
                scalerAddress: keda-add-ons-http-external-scaler.keda:9090
                interceptorRoute: app-web
            - type: external-push
              metadata:
                scalerAddress: keda-add-ons-http-external-scaler.keda:9090
                interceptorRoute: app-web-feed
            - type: external-push
              metadata:
                scalerAddress: keda-add-ons-http-external-scaler.keda:9090
                interceptorRoute: app-web-stream
            - type: cpu
              metricType: Utilization
              metadata: {value: "60"}

  - it: should add a keda.http.routes trigger for a StatefulSet
    values:
      - fixtures/keda-http-statefulset.yaml
    set:
      statefulSets.cache.service: {ports: {http: {targetPort: 3000}, stream: {port: 9100}}}
      statefulSets.cache.keda.http.routes: {stream: {paths: [/stream]}}
    asserts:
      - equal:
          path: spec.triggers[1].metadata.interceptorRoute
          value: app-cache-stream

  - it: should derive the scaler address from httpAddon.namespace
    values:
      - fixtures/keda-http.yaml
    set:
      integrations.keda.httpAddon.namespace: autoscaling
    asserts:
      - equal:
          path: spec.triggers[0].metadata.scalerAddress
          value: keda-add-ons-http-external-scaler.autoscaling:9090

  - it: should take httpAddon.scalerAddress verbatim
    values:
      - fixtures/keda-http.yaml
    set:
      integrations.keda.httpAddon.scalerAddress: scaler.platform.svc:9091
    asserts:
      - equal:
          path: spec.triggers[0].metadata.scalerAddress
          value: scaler.platform.svc:9091

  - it: should add the trigger for a StatefulSet
    values:
      - fixtures/keda-http-statefulset.yaml
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet
      - equal:
          path: spec.minReplicaCount
          value: 0
      - equal:
          path: spec.triggers[0].metadata.interceptorRoute
          value: app-cache

  - it: should leave the triggers and floor alone when keda.http is disabled
    values:
      - fixtures/keda-http.yaml
    set:
      deployments.web.keda.http.enabled: false
      deployments.web.keda.triggers:
        - type: cpu
          metricType: Utilization
          metadata: {value: "60"}
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 1
      - equal:
          path: spec.triggers
          value:
            - type: cpu
              metricType: Utilization
              metadata: {value: "60"}

  # --- keda.labels and keda.annotations ---

  - it: should render the workload's keda labels and annotations on its ScaledObject
    values:
      - fixtures/keda-deployment.yaml
    set:
      deployments.worker.keda.labels.team: autoscaling
      deployments.worker.keda.annotations.owner: autoscaling-team
    asserts:
      - equal:
          path: metadata.labels.team
          value: autoscaling
      - equal:
          path: metadata.annotations.owner
          value: autoscaling-team

  - it: should render keda labels on a StatefulSet's ScaledObject
    values:
      - fixtures/keda-statefulset.yaml
    set:
      statefulSets.cache.keda.labels.team: autoscaling
    asserts:
      - equal:
          path: metadata.labels.team
          value: autoscaling
