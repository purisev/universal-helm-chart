suite: test service
templates:
  - service.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not render deployment service when service not enabled
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render deployment service when service.enabled true
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
    asserts:
      - isKind:
          of: Service
      - matchRegex:
          path: metadata.name
          pattern: -web$

  - it: should set service type
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.api.enabled: true
      deployments.api.service.enabled: true
      deployments.api.service.type: NodePort
      deployments.api.service.port: 80
      deployments.api.service.targetPort: 8080
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: should render single port with name http
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
    asserts:
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: 8080

  - it: should render multi-port service
    values:
      - fixtures/service-multiport.yaml
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 2
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[1].name
          value: metrics

  - it: should have selector labels on deployment service
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
    asserts:
      - isNotNull:
          path: spec.selector

  - it: should render headless Service when StatefulSet has no explicit enabled field
    # Regression guard: statefulset.yaml uses ne (index $wl "enabled") false,
    # so a StatefulSet without enabled: true still renders. The headless Service
    # must follow the same semantics — otherwise spec.serviceName points at a
    # non-existent Service and pods fail to start.
    set:
      image.repository: nginx
      image.tag: v1.0.0
      statefulSets.db.image.repository: postgres
      statefulSets.db.image.tag: "16.3"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None

  - it: should render headless service for StatefulSet
    set:
      image.repository: nginx
      image.tag: v1.0.0
      statefulSets.db.enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None

  - it: should default StatefulSet service name to headless format
    set:
      image.repository: nginx
      image.tag: v1.0.0
      statefulSets.db.enabled: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: -db-headless$

  - it: should use custom serviceName for StatefulSet
    set:
      image.repository: nginx
      image.tag: v1.0.0
      statefulSets.db.enabled: true
      statefulSets.db.serviceName: my-db
    asserts:
      - equal:
          path: metadata.name
          value: my-db

  - it: should render deployment service and StatefulSet headless service together
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      statefulSets.db.enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: should not render headless Service when statefulSet headlessService.enabled is false
    set:
      image.repository: nginx
      image.tag: v1.0.0
      statefulSets.db.enabled: true
      statefulSets.db.headlessService.enabled: false
      statefulSets.db.serviceName: my-existing-headless
    asserts:
      - hasDocuments:
          count: 0

  - it: should render headless Service when statefulSet headlessService.enabled is true (explicit)
    set:
      image.repository: nginx
      image.tag: v1.0.0
      statefulSets.db.enabled: true
      statefulSets.db.headlessService.enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None


  # --- exposeService: dedicated metrics port ---

  - it: should add metrics port when exposeService is enabled alongside main service
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.metrics.enabled: true
      deployments.web.metrics.exposeService.enabled: true
    documentSelector:
      path: metadata.name
      value: test-release-universal-helm-chart-web
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 2
      - equal:
          path: spec.ports[1].name
          value: metrics
      - equal:
          path: spec.ports[1].port
          value: 9090
      - equal:
          path: spec.ports[1].targetPort
          value: 9090

  - it: should use custom exposeService.port and targetPort
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.metrics.enabled: true
      deployments.web.metrics.exposeService.enabled: true
      deployments.web.metrics.exposeService.port: 9091
      deployments.web.metrics.exposeService.targetPort: 8000
    documentSelector:
      path: metadata.name
      value: test-release-universal-helm-chart-web
    asserts:
      - equal:
          path: spec.ports[1].port
          value: 9091
      - equal:
          path: spec.ports[1].targetPort
          value: 8000

  - it: should create standalone metrics Service when service.enabled is false
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.worker.enabled: true
      deployments.worker.metrics.enabled: true
      deployments.worker.metrics.exposeService.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-release-universal-helm-chart-worker-metrics
      - equal:
          path: spec.ports[0].name
          value: metrics
      - equal:
          path: spec.ports[0].port
          value: 9090

  - it: should NOT add metrics port when metrics.type is pod
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.metrics.enabled: true
      deployments.web.metrics.type: pod
      deployments.web.metrics.exposeService.enabled: true
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1
      - notEqual:
          path: spec.ports[0].name
          value: metrics

  - it: should NOT duplicate metrics port when service.ports already has one named metrics
    # helm-unittest set: cannot create nested arrays (service.ports[].name) — using fixture.
    values:
      - fixtures/service-existing-metrics-port.yaml
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 2
      - equal:
          path: spec.ports[1].port
          value: 9999

  - it: should use global integrations.monitoring.defaults.exposeService when per-workload not set
    set:
      integrations.monitoring.defaults.exposeService.enabled: true
      integrations.monitoring.defaults.exposeService.port: 8000
      integrations.monitoring.defaults.exposeService.targetPort: 8000
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.metrics.enabled: true
    documentSelector:
      path: metadata.name
      value: test-release-universal-helm-chart-web
    asserts:
      - equal:
          path: spec.ports[1].port
          value: 8000
      - equal:
          path: spec.ports[1].targetPort
          value: 8000

  - it: per-workload exposeService.enabled=false should override global default true
    set:
      integrations.monitoring.defaults.exposeService.enabled: true
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.metrics.enabled: true
      deployments.web.metrics.exposeService.enabled: false
    documentSelector:
      path: metadata.name
      value: test-release-universal-helm-chart-web
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1

  - it: should render service ports from a map keyed by name in sorted order
    values:
      - fixtures/service-multiport.yaml
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 2
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[1].name
          value: metrics
      - equal:
          path: spec.ports[1].port
          value: 9090

  # --- explicit pass-through Service fields ---

  - it: should render service.loadBalancerIP on Deployment
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: LoadBalancer
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.service.loadBalancerIP: 192.0.2.1
    asserts:
      - equal:
          path: spec.loadBalancerIP
          value: 192.0.2.1

  - it: should render service.externalTrafficPolicy on Deployment
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: LoadBalancer
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.service.externalTrafficPolicy: Local
    asserts:
      - equal:
          path: spec.externalTrafficPolicy
          value: Local

  - it: should render service.internalTrafficPolicy on Deployment
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.service.internalTrafficPolicy: Local
    asserts:
      - equal:
          path: spec.internalTrafficPolicy
          value: Local

  - it: should render service.sessionAffinity on Deployment
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.service.sessionAffinity: ClientIP
    asserts:
      - equal:
          path: spec.sessionAffinity
          value: ClientIP

  - it: should render service.clusterIP on Deployment
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.service.clusterIP: None
    asserts:
      - equal:
          path: spec.clusterIP
          value: None

  - it: should render service.publishNotReadyAddresses on Deployment
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.service.publishNotReadyAddresses: true
    asserts:
      - equal:
          path: spec.publishNotReadyAddresses
          value: true

  - it: should render headlessService.annotations on the headless StatefulSet Service
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      statefulSets.db.headlessService.annotations:
        custom-annotation: my-value
        another-annotation: another-value
    asserts:
      - equal:
          path: metadata.annotations.custom-annotation
          value: my-value
      - equal:
          path: metadata.annotations.another-annotation
          value: another-value

  - it: should render headlessService.publishNotReadyAddresses on StatefulSet headless (peer discovery)
    # The Cassandra/Kafka/etcd use case: peers must resolve each other via DNS
    # before they reach Ready, which requires this flag on the headless Service.
    set:
      image.repository: cassandra
      image.tag: v1.0.0
      statefulSets.db.enabled: true
      statefulSets.db.headlessService.port: 9042
      statefulSets.db.headlessService.targetPort: 9042
      statefulSets.db.headlessService.publishNotReadyAddresses: true
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true

  - it: service.* no longer affects the headless Service (independent objects)
    # This is the core 3.0.0 behavior change: service.* used to be merged into
    # the headless Service's spec when headlessService stayed enabled. It now
    # always renders its own, separate Service instead — see the dual-service
    # test below. Setting service.clusterIP no longer conflicts with headless
    # clusterIP: None because they're different Service objects.
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      statefulSets.db.service.enabled: true
      statefulSets.db.service.port: 6379
      statefulSets.db.service.targetPort: 6379
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.clusterIP
          value: None
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: -db-headless$
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: -db$
        documentIndex: 1
      - notEqual:
          path: spec.clusterIP
          value: None
        documentIndex: 1

  # --- non-headless StatefulSet Service (headlessService opt-out + service.enabled) ---

  - it: should render non-headless ClusterIP Service for StatefulSet when headless is opted out and service.enabled is true
    # User manages the headless externally (referenced by spec.serviceName) and
    # asks the chart to render a regular ClusterIP Service for client traffic.
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      statefulSets.db.headlessService.enabled: false
      statefulSets.db.serviceName: my-external-headless
      statefulSets.db.service.enabled: true
      statefulSets.db.service.type: ClusterIP
      statefulSets.db.service.port: 6379
      statefulSets.db.service.targetPort: 6379
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-release-universal-helm-chart-db
      - equal:
          path: spec.type
          value: ClusterIP
      - notEqual:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].port
          value: 6379

  - it: should render zero Services for StatefulSet when headless opted out and service.enabled false
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      statefulSets.db.headlessService.enabled: false
      statefulSets.db.serviceName: my-external-headless
    asserts:
      - hasDocuments:
          count: 0

  - it: should pass through service.* fields to non-headless StatefulSet Service
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      statefulSets.db.headlessService.enabled: false
      statefulSets.db.serviceName: my-external-headless
      statefulSets.db.service.enabled: true
      statefulSets.db.service.type: ClusterIP
      statefulSets.db.service.port: 6379
      statefulSets.db.service.targetPort: 6379
      statefulSets.db.service.sessionAffinity: ClientIP
    asserts:
      - equal:
          path: spec.sessionAffinity
          value: ClientIP

  - it: should keep http first and metrics last around alphabetically-sorted middle ports
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ClusterIP
      deployments.web.service.ports:
        admin:
          port: 8081
          targetPort: 8081
        metrics:
          port: 9090
          targetPort: 9090
        http:
          port: 80
          targetPort: 8080
        zzz-debug:
          port: 9999
          targetPort: 9999
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 4
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[1].name
          value: admin
      - equal:
          path: spec.ports[2].name
          value: zzz-debug
      - equal:
          path: spec.ports[3].name
          value: metrics

  # --- newly supported ServiceSpec fields (3.0.0) ---

  - it: should render externalName, externalIPs, loadBalancer*, sessionAffinityConfig, ipFamilies, trafficDistribution on Deployment service
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: LoadBalancer
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 8080
      deployments.web.service.externalIPs:
        - 203.0.113.10
      deployments.web.service.loadBalancerClass: example.com/internal-lb
      deployments.web.service.loadBalancerSourceRanges:
        - 10.0.0.0/8
      deployments.web.service.allocateLoadBalancerNodePorts: false
      deployments.web.service.healthCheckNodePort: 32000
      deployments.web.service.sessionAffinity: ClientIP
      deployments.web.service.sessionAffinityConfig.clientIP.timeoutSeconds: 600
      deployments.web.service.ipFamilies:
        - IPv4
      deployments.web.service.ipFamilyPolicy: SingleStack
      deployments.web.service.trafficDistribution: PreferClose
    asserts:
      - equal:
          path: spec.externalIPs
          value: ["203.0.113.10"]
      - equal:
          path: spec.loadBalancerClass
          value: example.com/internal-lb
      - equal:
          path: spec.loadBalancerSourceRanges
          value: ["10.0.0.0/8"]
      - equal:
          path: spec.allocateLoadBalancerNodePorts
          value: false
      - equal:
          path: spec.healthCheckNodePort
          value: 32000
      - equal:
          path: spec.sessionAffinityConfig.clientIP.timeoutSeconds
          value: 600
      - equal:
          path: spec.ipFamilies
          value: ["IPv4"]
      - equal:
          path: spec.ipFamilyPolicy
          value: SingleStack
      - equal:
          path: spec.trafficDistribution
          value: PreferClose

  - it: should render externalName on an ExternalName-type service
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.type: ExternalName
      deployments.web.service.externalName: example.database.svc.cluster.local
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
    asserts:
      - equal:
          path: spec.type
          value: ExternalName
      - equal:
          path: spec.externalName
          value: example.database.svc.cluster.local

  - it: should render headlessService.ipFamilies and ipFamilyPolicy on StatefulSet headless Service
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      statefulSets.db.headlessService.ipFamilies:
        - IPv4
        - IPv6
      statefulSets.db.headlessService.ipFamilyPolicy: RequireDualStack
    asserts:
      - equal:
          path: spec.ipFamilies
          value: ["IPv4", "IPv6"]
      - equal:
          path: spec.ipFamilyPolicy
          value: RequireDualStack
