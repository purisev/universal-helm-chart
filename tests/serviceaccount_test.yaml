suite: test serviceaccount
templates:
  - serviceaccount.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not render when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ServiceAccount when create is true
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: apiVersion
          value: v1

  - it: should use release name when name is empty
    set:
      serviceAccount.create: true
      serviceAccount.name: ""
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release

  - it: should use custom name when specified
    set:
      serviceAccount.create: true
      serviceAccount.name: my-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-sa

  - it: should include annotations when set
    set:
      serviceAccount.create: true
      serviceAccount.annotations.eks\.amazonaws\.com/role-arn: arn:aws:iam::123:role/my-role
    asserts:
      - isNotNull:
          path: metadata.annotations

  - it: should have helm labels
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
