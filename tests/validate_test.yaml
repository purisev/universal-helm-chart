suite: test validate
templates:
  - validate.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not fail when only envDev is enabled
    set:
      envDev.enabled: true
      envProd.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not fail when only envProd is enabled
    set:
      envDev.enabled: false
      envProd.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not fail when neither env is enabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when both envDev and envProd are enabled
    set:
      envDev.enabled: true
      envProd.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "envDev and envProd cannot both be enabled simultaneously. Enable only one environment-specific variable set."
