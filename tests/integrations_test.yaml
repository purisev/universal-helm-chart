suite: test integrations restructure
templates:
  - deployment.yaml
  - statefulset.yaml
  - service.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - ingress.yaml
  - secretstore.yaml
  - externalsecret.yaml
  - hpa.yaml
  - poddisruptionbudget.yaml
  - servicemonitor.yaml
  - imageupdater.yaml
release:
  name: test-release
  namespace: test-ns

tests:

  # --- commonLabels propagation ---

  - it: commonLabels appear on Deployment metadata and pod template
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      commonLabels.team: platform
      commonLabels.cost-center: "12345"
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
      - equal:
          path: metadata.labels["cost-center"]
          value: "12345"
      - equal:
          path: spec.template.metadata.labels.team
          value: platform
      - equal:
          path: spec.template.metadata.labels["cost-center"]
          value: "12345"

  - it: commonLabels do NOT leak into spec.selector.matchLabels
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      commonLabels.team: platform
    asserts:
      - isNull:
          path: spec.selector.matchLabels.team
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: web

  - it: commonLabels appear on Service, SA, Ingress
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      serviceAccount.create: true
      ingress.enabled: true
      ingress.hosts:
        app.example.com:
          paths:
            - path: /
              pathType: Prefix
      commonLabels.team: platform
    template: service.yaml
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform

  # --- commonAnnotations propagation ---

  - it: commonAnnotations appear on top-level metadata but NOT on pod template
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      commonAnnotations.build/sha: deadbeef
    asserts:
      - equal:
          path: metadata.annotations["build/sha"]
          value: deadbeef
      - isNull:
          path: spec.template.metadata.annotations["build/sha"]

  # --- labels.standard.* toggles ---

  - it: labels.standard.enabled false drops only non-selector standard labels on workloads (selector-required name+instance always emitted)
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      labels.standard.enabled: false
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: web
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test-release-universal-helm-chart-web
      - isNull:
          path: metadata.labels["app.kubernetes.io/managed-by"]
      - isNull:
          path: metadata.labels["app.kubernetes.io/part-of"]
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: web

  - it: labels.standard.enabled false on workload still produces matching pod template + selector (regression)
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      labels.standard.enabled: false
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: web
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: test-release-universal-helm-chart-web
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: web

  - it: labels.standard.name false on Ingress (singleton) drops the label, but workload Service keeps it
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.hosts:
        app.example.com:
          paths:
            - path: /
              pathType: Prefix
      labels.standard.name: false
    asserts:
      - isNull:
          path: metadata.labels["app.kubernetes.io/name"]

  - it: labels.standard.managedBy false drops only managed-by
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      labels.standard.managedBy: false
    asserts:
      - isNull:
          path: metadata.labels["app.kubernetes.io/managed-by"]
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: web

  - it: helm.sh/chart label is dropped completely from all resources
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
    asserts:
      - isNull:
          path: metadata.labels["helm.sh/chart"]
      - isNull:
          path: spec.template.metadata.labels["helm.sh/chart"]

  - it: standard label wins over commonLabels on conflict
    template: deployment.yaml
    values:
      - ../tests/fixtures/commonlabels-conflict.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: web

  # --- syncWaves enabled gate ---

  - it: syncWaves.enabled false strips sync-wave annotation chart-wide
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      integrations.argocd.syncWaves.enabled: false
    asserts:
      - isNull:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: syncWaves per-kind null disables only that kind
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      integrations.argocd.syncWaves.deployment: ~
    asserts:
      - isNull:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: default sync-wave for Deployment is 20
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "20"

  - it: default sync-wave for ServiceAccount is -30
    template: serviceaccount.yaml
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-30"

  - it: default sync-wave for Ingress is 30
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.hosts:
        app.example.com:
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "30"

  # --- ESO eso.enabled gate ---

  - it: eso.enabled false suppresses SecretStore even when entries are declared
    template: secretstore.yaml
    set:
      integrations.eso.enabled: false
      integrations.eso.secretStores.vault.enabled: true
      integrations.eso.secretStores.vault.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault.provider.vault.path: secret
      integrations.eso.secretStores.vault.provider.vault.auth.jwt.role: app-role
    asserts:
      - hasDocuments:
          count: 0

  - it: eso.enabled false suppresses ExternalSecret even when entries are declared
    template: externalsecret.yaml
    set:
      integrations.eso.enabled: false
      integrations.eso.externalSecrets.creds.enabled: true
      integrations.eso.externalSecrets.creds.secretStore: vault
      integrations.eso.externalSecrets.creds.dataFrom[0].remoteKey: foo
    asserts:
      - hasDocuments:
          count: 0

  # --- Reloader: customization + propagation into ExternalSecret target template ---

  - it: reloader annotation appears on Deployment when enabled
    template: deployment.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      integrations.stakater.reloader.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: reloader.annotations replaces default everywhere
    template: deployment.yaml
    values:
      - ../tests/fixtures/reloader-match.yaml
    set:
      image.repository: nginx
      image.tag: latest
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/match"]
          value: "true"
      - isNull:
          path: metadata.annotations["reloader.stakater.com/auto"]

  - it: reloader annotations propagate into ExternalSecret target template
    template: externalsecret.yaml
    set:
      integrations.stakater.reloader.enabled: true
      integrations.eso.externalSecrets.creds.enabled: true
      integrations.eso.externalSecrets.creds.secretStore: vault
      integrations.eso.externalSecrets.creds.dataFrom[0].remoteKey: foo
    asserts:
      - equal:
          path: spec.target.template.metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: ExternalSecret has no target template when reloader disabled and type Opaque
    template: externalsecret.yaml
    set:
      integrations.stakater.reloader.enabled: false
      integrations.eso.externalSecrets.creds.enabled: true
      integrations.eso.externalSecrets.creds.secretStore: vault
      integrations.eso.externalSecrets.creds.dataFrom[0].remoteKey: foo
    asserts:
      - isNull:
          path: spec.target.template
