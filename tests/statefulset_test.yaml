suite: test statefulset
templates:
  - statefulset.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: renders StatefulSet when enabled
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.replicas
          value: 1

  - it: should not render replicas when KEDA enabled
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 3
      statefulSets.redis.keda.enabled: true
      statefulSets.redis.keda.minReplicas: 1
      statefulSets.redis.keda.maxReplicas: 10
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - isKind:
          of: StatefulSet
      - isNull:
          path: spec.replicas

  - it: should not render replicas when HPA enabled
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 3
      statefulSets.redis.hpa.enabled: true
      statefulSets.redis.hpa.minReplicas: 1
      statefulSets.redis.hpa.maxReplicas: 5
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - isKind:
          of: StatefulSet
      - isNull:
          path: spec.replicas

  - it: should use root strategy for updateStrategy when statefulset has no override
    set:
      image.repository: redis
      image.tag: alpine
      statefulSetUpdateStrategy.type: RollingUpdate
      statefulSetUpdateStrategy.rollingUpdate.partition: 3
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.serviceName: redis-headless
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate
      - equal:
          path: spec.updateStrategy.rollingUpdate.partition
          value: 3

  - it: should override root strategy with per-statefulset strategy
    set:
      image.repository: redis
      image.tag: alpine
      statefulSetUpdateStrategy.type: RollingUpdate
      statefulSetUpdateStrategy.rollingUpdate.partition: 0
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.statefulSetUpdateStrategy.type: OnDelete
      statefulSets.redis.serviceName: redis-headless
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.updateStrategy.type
          value: OnDelete
      - isNull:
          path: spec.updateStrategy.rollingUpdate

  - it: should use built-in fallback updateStrategy when not set
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.serviceName: redis-headless
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate
      - equal:
          path: spec.updateStrategy.rollingUpdate.partition
          value: 0

  - it: should inherit all env levels by default for StatefulSet
    set:
      image.repository: redis
      image.tag: alpine
      global.env.APP_ENV.value: production
      env.DEBUG.value: "true"
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.env.REDIS_ONLY.value: local
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_ENV
            value: production
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEBUG
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_ONLY
            value: local

  - it: should respect inherit.env flags and disable selected env layers for StatefulSet
    set:
      image.repository: redis
      image.tag: alpine
      global.env.APP_ENV.value: production
      env.DEBUG.value: "true"
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.inherit.env.global: false
      statefulSets.redis.inherit.env.root: false
      statefulSets.redis.env.REDIS_ONLY.value: local
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_ENV
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEBUG
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_ONLY
            value: local

  # --- C2: replicaCount default ---

  - it: should default to 1 replica when replicaCount not set
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  # --- initContainers ---

  - it: should render initContainer for StatefulSet when defined
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.initContainers.migrate.image.repository: busybox
      statefulSets.redis.initContainers.migrate.image.tag: stable
      statefulSets.redis.initContainers.migrate.command: echo migrating
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: migrate
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: busybox:stable
      - equal:
          path: spec.template.spec.containers[0].name
          value: redis

  - it: should render initContainers for StatefulSet in alphabetical order
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.initContainers.02-seed.image.repository: busybox
      statefulSets.redis.initContainers.02-seed.image.tag: stable
      statefulSets.redis.initContainers.02-seed.command: echo seeding
      statefulSets.redis.initContainers.01-wait.image.repository: busybox
      statefulSets.redis.initContainers.01-wait.image.tag: stable
      statefulSets.redis.initContainers.01-wait.command: echo waiting
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: 01-wait
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: 02-seed

  - it: should auto-mount configMap into StatefulSet initContainers as well
    set:
      image.repository: redis
      image.tag: alpine
      configMaps.app-config.enabled: true
      configMaps.app-config.mountPath: /etc/config
      configMaps.app-config.data.key: value
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.initContainers.migrate.command: echo migrating
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].name
          value: cm-app-config
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: /etc/config

  - it: should propagate inherit.configMapMount false to StatefulSet initContainers
    set:
      image.repository: redis
      image.tag: alpine
      configMaps.app-config.enabled: true
      configMaps.app-config.mountPath: /etc/config
      configMaps.app-config.data.key: value
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.inherit.configMapMount: false
      statefulSets.redis.initContainers.migrate.command: echo migrating
    asserts:
      - isNull:
          path: spec.template.spec.initContainers[0].volumeMounts

  - it: should propagate inherit.env from StatefulSet workload to its initContainers
    set:
      image.repository: redis
      image.tag: alpine
      global.env.APP_ENV.value: production
      env.DEBUG.value: "true"
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.inherit.env.global: false
      statefulSets.redis.inherit.env.root: false
      statefulSets.redis.initContainers.migrate.command: echo migrating
    asserts:
      - notContains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: APP_ENV
      - notContains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DEBUG
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  # --- L1: full labels on pod template ---

  - it: should not emit helm.sh/chart label and should keep standard app.kubernetes.io/* labels
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - isNull:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - isNotNull:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
      - isNull:
          path: metadata.labels["helm.sh/chart"]
      - isNotNull:
          path: metadata.labels["app.kubernetes.io/managed-by"]

  # --- L4: podManagementPolicy ---

  - it: should render podManagementPolicy when set
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.podManagementPolicy: Parallel
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - equal:
          path: spec.podManagementPolicy
          value: Parallel

  - it: should not render podManagementPolicy when not set
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - isNull:
          path: spec.podManagementPolicy

  # --- R4: minReadySeconds ---

  - it: should render minReadySeconds when non-zero
    set:
      image.repository: redis
      image.tag: alpine
      minReadySeconds: 15
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 15

  # --- R5: terminationGracePeriodSeconds ---

  - it: should set terminationGracePeriodSeconds for StatefulSet
    set:
      image.repository: redis
      image.tag: alpine
      terminationGracePeriodSeconds: 90
      statefulSets.redis.enabled: true
      statefulSets.redis.replicaCount: 1
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90

  # --- headlessService.enabled=false fail-fast ---

  - it: should fail fast when headlessService.enabled=false without serviceName
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.headlessService.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "headlessService.enabled=false requires serviceName"

  - it: should render when headlessService.enabled=false with serviceName provided
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.headlessService.enabled: false
      statefulSets.redis.serviceName: my-existing-headless
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.serviceName
          value: my-existing-headless

  - it: should respect replicaCount=0 on StatefulSet (scale-to-zero)
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      statefulSets.db.replicaCount: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  # --- podSecurityContext override ---

  - it: should use root podSecurityContext by default for StatefulSet
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      podSecurityContext.runAsUser: 1000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000

  - it: should use per-workload podSecurityContext when set for StatefulSet
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      podSecurityContext.runAsUser: 1000
      statefulSets.db.podSecurityContext.runAsUser: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 2000

  # --- podAnnotations merge ---

  - it: should render root podAnnotations on StatefulSet pod template
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      podAnnotations.injected: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations.injected
          value: "true"

  - it: should render per-workload podAnnotations on StatefulSet pod template
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      statefulSets.db.podAnnotations.custom-annotation: my-value
    asserts:
      - equal:
          path: spec.template.metadata.annotations.custom-annotation
          value: my-value

  - it: per-workload podAnnotations should override root on collision for StatefulSet
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      podAnnotations.shared: from-root
      statefulSets.db.podAnnotations.shared: from-workload
    asserts:
      - equal:
          path: spec.template.metadata.annotations.shared
          value: from-workload

  - it: per-workload podAnnotations should merge with root for StatefulSet (non-colliding keys both present)
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.db.enabled: true
      podAnnotations.root-key: root-value
      statefulSets.db.podAnnotations.workload-key: workload-value
    asserts:
      - equal:
          path: spec.template.metadata.annotations.root-key
          value: root-value
      - equal:
          path: spec.template.metadata.annotations.workload-key
          value: workload-value

  # --- per-workload metadataAnnotations ---

  - it: should render per-workload metadataAnnotations on the StatefulSet object
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets:
        db:
          enabled: true
          metadataAnnotations:
            example.com/owner: data-team
            example.com/criticality: tier-1
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: data-team
      - equal:
          path: metadata.annotations["example.com/criticality"]
          value: tier-1

  - it: should render persistentVolumeClaimRetentionPolicy when set
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets:
        db:
          enabled: true
          persistentVolumeClaimRetentionPolicy:
            whenDeleted: Delete
            whenScaled: Retain
    asserts:
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenDeleted
          value: Delete
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenScaled
          value: Retain

  - it: should not render persistentVolumeClaimRetentionPolicy when unset
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets:
        db:
          enabled: true
    asserts:
      - isNull:
          path: spec.persistentVolumeClaimRetentionPolicy

  - it: should render ordinals.start when set
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets:
        db:
          enabled: true
          ordinals:
            start: 3
    asserts:
      - equal:
          path: spec.ordinals.start
          value: 3

  - it: should not render ordinals when unset
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets:
        db:
          enabled: true
    asserts:
      - isNull:
          path: spec.ordinals
