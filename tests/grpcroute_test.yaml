suite: test grpcroute
templates:
  - grpcroute.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  # --- Basic ---

  - it: should not render when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render GRPCRoute when enabled
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: GRPCRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1

  - it: should use release name for grpcroute name
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release

  - it: should have helm labels
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should render annotations when set
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: metadata.annotations["some-annotation"]
          value: some-value

  # --- parentRefs ---

  - it: should render parentRefs when set
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: my-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-system
      - equal:
          path: spec.parentRefs[0].sectionName
          value: grpc

  - it: should omit parentRefs when not set
    set:
      grpcRoute.enabled: true
    asserts:
      - isNull:
          path: spec.parentRefs

  # --- hostnames ---

  - it: should render hostnames when set
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: "grpc.example.com"

  - it: should omit hostnames when not set
    set:
      grpcRoute.enabled: true
    asserts:
      - isNull:
          path: spec.hostnames

  # --- rules: explicit backendRefs ---

  - it: should render rules with explicit backendRefs
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].matches[0].method.type
          value: Exact
      - equal:
          path: spec.rules[0].matches[0].method.service
          value: com.example.UserService
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: my-release-user
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 50051

  # --- rules: shorthand serviceName/servicePort ---

  - it: should use serviceName shorthand in backendRefs
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[1].backendRefs[0].name
          value: my-release-order
      - equal:
          path: spec.rules[1].backendRefs[0].port
          value: 50051

  - it: should default serviceName to fullname when not specified
    set:
      grpcRoute.enabled: true
      grpcRoute.rules:
        - {}
    asserts:
      - matchRegex:
          path: spec.rules[0].backendRefs[0].name
          pattern: ^test-release

  - it: should default servicePort to 50051 when not specified
    set:
      grpcRoute.enabled: true
      grpcRoute.rules:
        - {}
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 50051

  # --- Multi-GRPCRoute map ---

  - it: should not render grpcRoutes entries when disabled
    set:
      grpcRoutes.user.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render multiple GRPCRoutes from grpcRoutes map
    set:
      grpcRoutes.user.enabled: true
      grpcRoutes.user.rules[0].serviceName: my-release-user
      grpcRoutes.order.enabled: true
      grpcRoutes.order.rules[0].serviceName: my-release-order
    asserts:
      - hasDocuments:
          count: 2

  - it: should name multi-route as fullname-key
    set:
      fullnameOverride: test-release
      grpcRoutes.user.enabled: true
      grpcRoutes.user.rules[0].serviceName: my-svc
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release-user

  - it: should render hostnames in multi-route
    set:
      grpcRoutes.user.enabled: true
      grpcRoutes.user.hostnames[0]: grpc.example.com
      grpcRoutes.user.rules[0].serviceName: my-svc
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: grpc.example.com
