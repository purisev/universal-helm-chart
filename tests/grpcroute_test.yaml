suite: test grpcroute
templates:
  - grpcroute.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  # --- Basic ---

  - it: should not render when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render GRPCRoute when enabled
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: GRPCRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1

  - it: should use release name for grpcroute name
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release

  - it: should have helm labels
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should render annotations when set
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: metadata.annotations["some-annotation"]
          value: some-value

  # --- parentRefs ---

  - it: should render parentRefs when set
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: my-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-system
      - equal:
          path: spec.parentRefs[0].sectionName
          value: grpc

  - it: should pre-fill parentRefs group/kind when unset (ADR 019)
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.parentRefs[0].group
          value: gateway.networking.k8s.io
      - equal:
          path: spec.parentRefs[0].kind
          value: Gateway

  - it: should fail fast when grpcRoute is enabled without parentRefs
    set:
      grpcRoute.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "grpcRoute is enabled .* but .Values.grpcRoute.parentRefs is empty"

  # --- hostnames ---

  - it: should render hostnames when set
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: "grpc.example.com"

  - it: should omit hostnames when not set
    set:
      grpcRoute.enabled: true
      grpcRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
    asserts:
      - isNull:
          path: spec.hostnames

  # --- rules: explicit backendRefs ---

  - it: should render rules with explicit backendRefs
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].matches[0].method.type
          value: Exact
      - equal:
          path: spec.rules[0].matches[0].method.service
          value: com.example.UserService
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: my-release-user
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 50051
      - equal:
          path: spec.rules[0].backendRefs[0].group
          value: ""
      - equal:
          path: spec.rules[0].backendRefs[0].kind
          value: Service
      - equal:
          path: spec.rules[0].backendRefs[0].weight
          value: 1

  # --- rules: shorthand serviceName/servicePort ---

  - it: should use serviceName shorthand in backendRefs
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[1].backendRefs[0].name
          value: my-release-order
      - equal:
          path: spec.rules[1].backendRefs[0].port
          value: 50051
      - equal:
          path: spec.rules[1].backendRefs[0].group
          value: ""
      - equal:
          path: spec.rules[1].backendRefs[0].kind
          value: Service
      - equal:
          path: spec.rules[1].backendRefs[0].weight
          value: 1

  # --- matches: method.type default ---

  - it: should default matches[].method.type to Exact when unset (ADR 019)
    set:
      grpcRoute.enabled: true
      grpcRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoute.rules:
        - matches:
            - method:
                service: com.example.UserService
          serviceName: my-svc
    asserts:
      - equal:
          path: spec.rules[0].matches[0].method.type
          value: Exact
      - equal:
          path: spec.rules[0].matches[0].method.service
          value: com.example.UserService

  - it: should default serviceName to fullname when not specified
    set:
      grpcRoute.enabled: true
      grpcRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoute.rules:
        - {}
    asserts:
      - matchRegex:
          path: spec.rules[0].backendRefs[0].name
          pattern: ^test-release

  - it: should default servicePort to 50051 when not specified
    set:
      grpcRoute.enabled: true
      grpcRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoute.rules:
        - {}
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 50051

  # --- Multi-GRPCRoute map ---

  - it: should not render grpcRoutes entries when disabled
    set:
      grpcRoutes.user.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render multiple GRPCRoutes from grpcRoutes map
    set:
      grpcRoutes.user.enabled: true
      grpcRoutes.user.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoutes.user.rules[0].serviceName: my-release-user
      grpcRoutes.order.enabled: true
      grpcRoutes.order.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoutes.order.rules[0].serviceName: my-release-order
    asserts:
      - hasDocuments:
          count: 2

  - it: should name multi-route as fullname-key
    set:
      fullnameOverride: test-release
      grpcRoutes.user.enabled: true
      grpcRoutes.user.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoutes.user.rules[0].serviceName: my-svc
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release-user

  - it: should render hostnames in multi-route
    set:
      grpcRoutes.user.enabled: true
      grpcRoutes.user.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoutes.user.hostnames[0]: grpc.example.com
      grpcRoutes.user.rules[0].serviceName: my-svc
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: grpc.example.com

  # --- rules: name field ---

  - it: should render rule name in root rules
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: user-rule

  - it: should omit rule name when not set
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].name

  - it: should render rule name in per-workload deployment rules
    values:
      - fixtures/grpcroute-workload-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: user-rule
      - isNull:
          path: spec.rules[1].name

  - it: should render rule name in per-workload statefulSet rules
    values:
      - fixtures/grpcroute-statefulset-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: user-rule
      - isNull:
          path: spec.rules[1].name

  - it: should render rule name in plural-map rules
    values:
      - fixtures/grpcroute-plural-full.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.rules[0].name
          value: user-rule

  - it: should omit rule name when not set in plural-map rules
    values:
      - fixtures/grpcroute-plural-full.yaml
    documentIndex: 0
    asserts:
      - isNull:
          path: spec.rules[0].name

  # --- rules: sessionPersistence ---

  - it: should render sessionPersistence in root rules
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-user
      - equal:
          path: spec.rules[0].sessionPersistence.type
          value: Cookie
      - equal:
          path: spec.rules[0].sessionPersistence.absoluteTimeout
          value: 1h
      - equal:
          path: spec.rules[0].sessionPersistence.idleTimeout
          value: 10m
      - equal:
          path: spec.rules[0].sessionPersistence.cookieConfig.lifetimeType
          value: Permanent

  - it: should omit sessionPersistence when not set
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].sessionPersistence

  - it: should render sessionPersistence in per-workload deployment rules
    values:
      - fixtures/grpcroute-workload-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-user
      - equal:
          path: spec.rules[0].sessionPersistence.cookieConfig.lifetimeType
          value: Permanent
      - isNull:
          path: spec.rules[1].sessionPersistence

  - it: should render sessionPersistence in per-workload statefulSet rules
    values:
      - fixtures/grpcroute-statefulset-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-user
      - isNull:
          path: spec.rules[1].sessionPersistence

  - it: should render sessionPersistence in plural-map rules
    values:
      - fixtures/grpcroute-plural-full.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-user
      - equal:
          path: spec.rules[0].sessionPersistence.cookieConfig.lifetimeType
          value: Permanent

  - it: should omit sessionPersistence in plural-map rules when not set
    values:
      - fixtures/grpcroute-plural-full.yaml
    documentIndex: 0
    asserts:
      - isNull:
          path: spec.rules[0].sessionPersistence

  # --- Gateway API channel guards: rule.name (v1.4+ Standard or Experimental) ---

  - it: should render rule name when v1.4+ Standard CRDs present (BackendTLSPolicy v1)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1/BackendTLSPolicy
        # also needed because the full fixture uses sessionPersistence (Experimental-only):
        - gateway.networking.k8s.io/v1alpha2/TCPRoute
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: user-rule

  - it: should render rule name when Experimental CRDs present (TCPRoute v1alpha2)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1alpha2/TCPRoute
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: user-rule

  - it: should fail when v1 group present but neither v1.4 Standard nor Experimental marker (pre-v1.4 Standard cluster)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      grpcRoute.enabled: true
      grpcRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoute.rules:
        - name: my-rule
          serviceName: my-svc
    asserts:
      - failedTemplate:
          errorPattern: "rule.name requires Gateway API v1.4\\+ Standard"

  - it: should render rule name without capability check when gateway.networking.k8s.io/v1 absent (offline)
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: user-rule

  # --- Gateway API channel guards: rule.sessionPersistence (Experimental only) ---

  - it: should render sessionPersistence when Experimental CRDs present (TCPRoute v1alpha2)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1alpha2/TCPRoute
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-user

  - it: should fail when sessionPersistence is set but cluster has only Standard CRDs (BackendTLSPolicy v1, no Experimental)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1/BackendTLSPolicy
    set:
      grpcRoute.enabled: true
      grpcRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoute.rules:
        - sessionPersistence:
            sessionName: sticky
            type: Cookie
          serviceName: my-svc
    asserts:
      - failedTemplate:
          errorPattern: "rule.sessionPersistence requires Gateway API Experimental"

  - it: should render sessionPersistence without capability check when gateway.networking.k8s.io/v1 absent (offline)
    values:
      - fixtures/grpcroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-user

  # --- Schema strictness: rule schema rejects unknown keys ---

  - it: should reject unknown keys in grpcRoute rules
    set:
      grpcRoute.enabled: true
      grpcRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      grpcRoute.rules:
        - name: my-rule
          unknownKey: foo
          serviceName: my-svc
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'unknownKey' not allowed"
