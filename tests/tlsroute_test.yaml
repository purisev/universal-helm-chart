suite: test tlsroute
templates:
  - tlsroute.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  # --- Basic ---

  - it: should not render when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render TLSRoute when enabled
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: TLSRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1

  - it: should use release name for tlsroute name
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release

  - it: should have helm labels
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should render annotations when set
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - equal:
          path: metadata.annotations["some-annotation"]
          value: some-value

  # --- parentRefs ---

  - it: should render parentRefs when set
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: my-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-system
      - equal:
          path: spec.parentRefs[0].sectionName
          value: tls-passthrough

  - it: should fail fast when tlsRoute is enabled without parentRefs
    set:
      tlsRoute.enabled: true
      tlsRoute.hostnames:
        - tls.example.com
      tlsRoute.rules[0].serviceName: my-svc
    asserts:
      - failedTemplate:
          errorPattern: "tlsRoute is enabled .* but .Values.tlsRoute.parentRefs is empty"

  - it: should fail fast when tlsRoute is enabled without hostnames
    set:
      tlsRoute.enabled: true
      tlsRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      tlsRoute.rules[0].serviceName: my-svc
    asserts:
      - failedTemplate:
          errorPattern: "tlsRoute is enabled .* but .Values.tlsRoute.hostnames is empty"

  # --- hostnames ---

  - it: should render hostnames
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: "secure.example.com"

  # --- rules: explicit backendRefs ---

  - it: should render rules with explicit backendRefs
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: my-release-web
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8443

  # --- rules: shorthand serviceName/servicePort ---

  - it: should use serviceName shorthand in backendRefs
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[1].backendRefs[0].name
          value: my-release-api
      - equal:
          path: spec.rules[1].backendRefs[0].port
          value: 9443

  - it: should default serviceName to fullname when not specified
    set:
      tlsRoute.enabled: true
      tlsRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      tlsRoute.hostnames:
        - secure.example.com
      tlsRoute.rules:
        - {}
    asserts:
      - matchRegex:
          path: spec.rules[0].backendRefs[0].name
          pattern: ^test-release

  - it: should default servicePort to 443 when not specified
    set:
      tlsRoute.enabled: true
      tlsRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      tlsRoute.hostnames:
        - secure.example.com
      tlsRoute.rules:
        - {}
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 443

  # --- Multi-TLSRoute map ---

  - it: should not render tlsRoutes entries when disabled
    set:
      tlsRoutes.ext.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render multiple TLSRoutes from tlsRoutes map
    set:
      tlsRoutes.ext.enabled: true
      tlsRoutes.ext.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      tlsRoutes.ext.hostnames:
        - secure.example.com
      tlsRoutes.ext.rules[0].serviceName: my-release-web
      tlsRoutes.int.enabled: true
      tlsRoutes.int.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      tlsRoutes.int.hostnames:
        - internal.example.com
      tlsRoutes.int.rules[0].serviceName: my-release-api
    asserts:
      - hasDocuments:
          count: 2

  - it: should name multi-route as fullname-key
    set:
      fullnameOverride: test-release
      tlsRoutes.ext.enabled: true
      tlsRoutes.ext.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      tlsRoutes.ext.hostnames:
        - secure.example.com
      tlsRoutes.ext.rules[0].serviceName: my-svc
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release-ext

  - it: should render hostnames in multi-route
    set:
      tlsRoutes.ext.enabled: true
      tlsRoutes.ext.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      tlsRoutes.ext.hostnames:
        - secure.example.com
      tlsRoutes.ext.rules[0].serviceName: my-svc
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: secure.example.com

  # --- rules: name field ---

  - it: should render rule name in root rules
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: web-rule

  - it: should omit rule name when not set in root rules
    values:
      - fixtures/tlsroute-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].name

  - it: should render rule name in per-workload deployment rules
    values:
      - fixtures/tlsroute-workload-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: web-rule
      - isNull:
          path: spec.rules[1].name

  - it: should default backendRefs when only name is set in per-workload rules
    values:
      - fixtures/tlsroute-workload-full.yaml
    asserts:
      - matchRegex:
          path: spec.rules[0].backendRefs[0].name
          pattern: -web$
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8443

  - it: should render rule name in per-workload statefulSet rules
    values:
      - fixtures/tlsroute-statefulset-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: web-rule
      - isNull:
          path: spec.rules[1].name

  - it: should render rule name in plural-map rules
    values:
      - fixtures/tlsroute-plural-full.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.rules[0].name
          value: ext-rule

  - it: should omit rule name when not set in plural-map rules
    values:
      - fixtures/tlsroute-plural-full.yaml
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.rules[0].name

  # --- Schema strictness: rule schema rejects unknown keys ---

  - it: should reject unknown keys in tlsRoute rules
    set:
      tlsRoute.enabled: true
      tlsRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      tlsRoute.hostnames:
        - secure.example.com
      tlsRoute.rules:
        - name: web-rule
          unknownKey: foo
          serviceName: my-svc
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'unknownKey' not allowed"
