suite: test hpa
templates:
  - hpa.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not render when no deployments
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when hpa disabled
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: false
      deployments.web.hpa.maxReplicas: 5
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when both hpa and keda are enabled on the same workload
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: true
      deployments.web.hpa.maxReplicas: 5
      deployments.web.keda.enabled: true
      deployments.web.keda.maxReplicas: 5
    asserts:
      - failedTemplate:
          errorMessage: "deployments.web: hpa.enabled and keda.enabled are mutually exclusive — both manage spec.replicas. Pick one."

  - it: should render HPA when enabled
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: true
      deployments.web.hpa.maxReplicas: 5
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: apiVersion
          value: autoscaling/v2

  - it: should have correct name
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: true
      deployments.web.hpa.maxReplicas: 5
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: -web$

  - it: should default minReplicas to 1
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: true
      deployments.web.hpa.maxReplicas: 5
    asserts:
      - equal:
          path: spec.minReplicas
          value: 1

  - it: should set custom minReplicas and maxReplicas
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: true
      deployments.web.hpa.minReplicas: 2
      deployments.web.hpa.maxReplicas: 10
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 10

  - it: should reference correct deployment in scaleTargetRef
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: true
      deployments.web.hpa.maxReplicas: 5
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - matchRegex:
          path: spec.scaleTargetRef.name
          pattern: -web$

  - it: should have argocd sync-wave annotation
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: true
      deployments.web.hpa.maxReplicas: 5
    asserts:
      - isNotNull:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: should include metrics when set
    values:
      - fixtures/hpa-with-metrics.yaml
    asserts:
      - isNotNull:
          path: spec.metrics
      - equal:
          path: spec.metrics[0].type
          value: Resource

  - it: should render two HPAs for two deployments
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.alpha.enabled: true
      deployments.alpha.hpa.enabled: true
      deployments.alpha.hpa.maxReplicas: 5
      deployments.beta.enabled: true
      deployments.beta.hpa.enabled: true
      deployments.beta.hpa.maxReplicas: 5
    asserts:
      - hasDocuments:
          count: 2

  - it: should render HPA targeting StatefulSet kind
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.cache.enabled: true
      statefulSets.cache.hpa.enabled: true
      statefulSets.cache.hpa.maxReplicas: 5
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet
      - matchRegex:
          path: spec.scaleTargetRef.name
          pattern: -cache$
      - matchRegex:
          path: metadata.name
          pattern: -cache$

  - it: should fail when both hpa and keda are enabled on the same statefulSet
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.cache.enabled: true
      statefulSets.cache.hpa.enabled: true
      statefulSets.cache.hpa.maxReplicas: 5
      statefulSets.cache.keda.enabled: true
      statefulSets.cache.keda.maxReplicas: 5
    asserts:
      - failedTemplate:
          errorMessage: "statefulSets.cache: hpa.enabled and keda.enabled are mutually exclusive — both manage spec.replicas. Pick one."

  - it: should render HPAs for both a Deployment and a StatefulSet
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.hpa.enabled: true
      deployments.web.hpa.maxReplicas: 5
      statefulSets.cache.enabled: true
      statefulSets.cache.hpa.enabled: true
      statefulSets.cache.hpa.maxReplicas: 5
    asserts:
      - hasDocuments:
          count: 2
