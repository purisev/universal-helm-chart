suite: test job-db
templates:
  - job-db.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not render when dbJob disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Job when dbJob enabled
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - isKind:
          of: Job
      - equal:
          path: apiVersion
          value: batch/v1

  - it: should have correct name with -database suffix
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: -database$

  - it: should have ArgoCD Sync hook annotation
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync

  - it: should use databaseJobsSyncWave (lower than jobs)
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"

  - it: should use dbJob image for initContainers
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: ^flyway:9$

  - it: should set backoffLimit
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.backoffLimit: 2
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 2

  - it: should render task as initContainer
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: migrate

  - it: should include job-completed completion container
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: job-completed

  - it: should merge extra metadata annotations
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.metadataAnnotations.custom/note: db-note
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: metadata.annotations["custom/note"]
          value: db-note
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync

  - it: should set restartPolicy to Never
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  # --- R2: ttlSecondsAfterFinished ---

  - it: should render ttlSecondsAfterFinished when set
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.ttlSecondsAfterFinished: 1800
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 1800

  - it: should render default ttlSecondsAfterFinished 3600
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 3600

  # --- R3: activeDeadlineSeconds ---

  - it: should render activeDeadlineSeconds when set
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.activeDeadlineSeconds: 600
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600

  - it: should not render activeDeadlineSeconds when null
    set:
      dbJob.enabled: true
      dbJob.image.repository: flyway
      dbJob.image.tag: "9"
      dbJob.tasks.migrate.enabled: true
      dbJob.tasks.migrate.command: flyway migrate
    asserts:
      - isNull:
          path: spec.activeDeadlineSeconds
