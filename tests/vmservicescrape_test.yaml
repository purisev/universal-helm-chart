suite: test vmservicescrape
templates:
  - vmservicescrape.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  # --- Deployment ---

  - it: should render VMServiceScrape for Deployment when metrics enabled
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      deployments.web.metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: VMServiceScrape
      - matchRegex:
          path: metadata.name
          pattern: -web-metrics$

  - it: should not render VMServiceScrape when workload disabled
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: false
      deployments.web.service.enabled: true
      deployments.web.metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render VMServiceScrape when service disabled
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: false
      deployments.web.metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render VMServiceScrape when metrics disabled
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      deployments.web.metrics.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use default port, path, interval and scrapeTimeout
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      deployments.web.metrics.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: http
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 10s

  - it: should use custom port, path, interval and scrapeTimeout
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      deployments.web.metrics.enabled: true
      deployments.web.metrics.port: metrics
      deployments.web.metrics.path: /custom/metrics
      deployments.web.metrics.interval: 60s
      deployments.web.metrics.scrapeTimeout: 30s
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].path
          value: /custom/metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 60s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 30s

  - it: should set correct selector matchLabels for Deployment
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      deployments.web.metrics.enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: web
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: test-release-universal-helm-chart-web

  - it: should set argocd sync-wave annotation as deploymentSyncWave + 1
    set:
      image.repository: nginx
      image.tag: alpine
      syncWaves.deploymentSyncWave: "10"
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      deployments.web.metrics.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "11"

  - it: should render relabelConfigs when provided
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      deployments.web.metrics.enabled: true
      deployments.web.metrics.relabelConfigs[0].targetLabel: instance
    asserts:
      - isNotNull:
          path: spec.endpoints[0].relabelConfigs

  - it: should render basicAuth when provided
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      deployments.web.metrics.enabled: true
      deployments.web.metrics.basicAuth.password.name: metrics-secret
      deployments.web.metrics.basicAuth.password.key: password
      deployments.web.metrics.basicAuth.username.name: metrics-secret
      deployments.web.metrics.basicAuth.username.key: username
    asserts:
      - equal:
          path: spec.endpoints[0].basicAuth.password.name
          value: metrics-secret
      - equal:
          path: spec.endpoints[0].basicAuth.password.key
          value: password
      - equal:
          path: spec.endpoints[0].basicAuth.username.name
          value: metrics-secret
      - equal:
          path: spec.endpoints[0].basicAuth.username.key
          value: username

  - it: should render vm_scrape_params headers when provided
    set:
      image.repository: nginx
      image.tag: alpine
      deployments.web.enabled: true
      deployments.web.service.enabled: true
      deployments.web.service.port: 80
      deployments.web.service.targetPort: 80
      deployments.web.metrics.enabled: true
      deployments.web.metrics.headers[0]: "X-Custom-Header: value"
    asserts:
      - equal:
          path: spec.endpoints[0].vm_scrape_params.headers[0]
          value: "X-Custom-Header: value"

  # --- StatefulSet ---

  - it: should render VMServiceScrape for StatefulSet when metrics enabled
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: VMServiceScrape
      - matchRegex:
          path: metadata.name
          pattern: -redis-metrics$

  - it: should not render VMServiceScrape for StatefulSet when disabled
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: false
      statefulSets.redis.service.enabled: true
      statefulSets.redis.metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render VMServiceScrape for StatefulSet when service disabled
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.service.enabled: false
      statefulSets.redis.metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render VMServiceScrape for StatefulSet when metrics disabled
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.metrics.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should set correct selector matchLabels for StatefulSet
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.service.enabled: true
      statefulSets.redis.service.port: 6379
      statefulSets.redis.service.targetPort: 6379
      statefulSets.redis.metrics.enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: redis
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: test-release-universal-helm-chart-redis
