httpRoute:
  parentRefs:
    - name: my-gateway
      namespace: gateway-system
  hostnames:
    - app.example.com

deployments:
  api:
    service:
      port: 8080
    httpRoute:
      enabled: true
      priority: 5
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api
  web:
    service:
      port: 80
    httpRoute:
      enabled: true
      priority: 10
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
