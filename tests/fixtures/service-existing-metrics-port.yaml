image:
  repository: nginx
  tag: alpine
deployments:
  web:
    enabled: true
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: http
          port: 80
          targetPort: 8080
        - name: metrics
          port: 9999
          targetPort: 9999
    metrics:
      enabled: true
      exposeService:
        enabled: true
