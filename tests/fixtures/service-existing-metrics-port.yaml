image:
  repository: nginx
  tag: alpine
deployments:
  web:
    enabled: true
    service:
      enabled: true
      type: ClusterIP
      ports:
        http:
          port: 80
          targetPort: 8080
        metrics:
          port: 9999
          targetPort: 9999
    metrics:
      enabled: true
      exposeService:
        enabled: true
