grpcRoutes:
  user:
    enabled: true
    parentRefs:
      - name: my-gateway
        namespace: gateway-system
    hostnames:
      - user.example.com
    rules:
      - name: user-rule
        matches:
          - method:
              type: Exact
              service: com.example.UserService
        sessionPersistence:
          sessionName: sticky-user
          type: Cookie
          absoluteTimeout: 1h
          idleTimeout: 10m
          cookieConfig:
            lifetimeType: Permanent
        backendRefs:
          - name: my-release-user
            port: 50051
  order:
    enabled: true
    parentRefs:
      - name: my-gateway
        namespace: gateway-system
    hostnames:
      - order.example.com
    rules:
      - matches:
          - method:
              type: Exact
              service: com.example.OrderService
        serviceName: my-release-order
        servicePort: 50051
