image:
  repository: nginx
  tag: v1.0.0
deployments:
  web:
    enabled: true
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
