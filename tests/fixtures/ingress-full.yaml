ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: myapp.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: 8080
  tls:
    - hosts:
        - myapp.example.com
      secretName: myapp-tls
