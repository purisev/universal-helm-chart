grpcRoute:
  enabled: true
  annotations:
    some-annotation: some-value
  parentRefs:
    - name: my-gateway
      namespace: gateway-system
      sectionName: grpc
  hostnames:
    - "grpc.example.com"
  rules:
    - name: user-rule
      matches:
        - method:
            type: Exact
            service: com.example.UserService
      sessionPersistence:
        sessionName: sticky-user
        type: Cookie
        absoluteTimeout: 1h
        idleTimeout: 10m
        cookieConfig:
          lifetimeType: Permanent
      backendRefs:
        - name: my-release-user
          port: 50051
    - matches:
        - method:
            type: Exact
            service: com.example.OrderService
      serviceName: my-release-order
      servicePort: 50051
