imageUpdater:
  enabled: true
  namespace: argocd
  commonUpdateSettings:
    updateStrategy: semver
    forceUpdate: false
    ignoreTags:
      - latest
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: "my-app"
      images:
        - alias: app
          imageName: "myregistry/myapp:v1.0.0"
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+$"
