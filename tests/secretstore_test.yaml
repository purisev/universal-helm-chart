suite: test secretstore
templates:
  - secretstore.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  # --- Vault ---

  - it: should render SecretStore for Vault provider
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.vault-store.enabled: true
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.audiences[0]: vault
    asserts:
      - isKind:
          of: SecretStore
      - matchRegex:
          path: metadata.name
          pattern: -vault-store$
      - equal:
          path: spec.provider.vault.server
          value: https://vault.example.com
      - equal:
          path: spec.provider.vault.path
          value: secret
      - equal:
          path: spec.provider.vault.version
          value: v2
      - equal:
          path: spec.provider.vault.auth.jwt.path
          value: jwt
      - equal:
          path: spec.provider.vault.auth.jwt.role
          value: my-role
      - equal:
          path: spec.provider.vault.auth.jwt.kubernetesServiceAccountToken.serviceAccountRef.name
          value: my-sa
      - equal:
          path: spec.provider.vault.auth.jwt.kubernetesServiceAccountToken.audiences[0]
          value: vault
      - equal:
          path: spec.provider.vault.auth.jwt.kubernetesServiceAccountToken.expirationSeconds
          value: 600

  - it: should use explicit serviceAccountRef when set for Vault
    set:
      serviceAccount.name: default-sa
      integrations.eso.secretStores.vault-store.enabled: true
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.serviceAccountRef: custom-sa
    asserts:
      - equal:
          path: spec.provider.vault.auth.jwt.kubernetesServiceAccountToken.serviceAccountRef.name
          value: custom-sa

  - it: should use explicit serviceAccountNamespace when set for Vault
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.vault-store.enabled: true
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.serviceAccountNamespace: custom-ns
    asserts:
      - equal:
          path: spec.provider.vault.auth.jwt.kubernetesServiceAccountToken.serviceAccountRef.namespace
          value: custom-ns

  - it: should render ClusterSecretStore when kind is set
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.vault-store.enabled: true
      integrations.eso.secretStores.vault-store.kind: ClusterSecretStore
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
    asserts:
      - isKind:
          of: ClusterSecretStore

  - it: should not render SecretStore when disabled
    set:
      integrations.eso.secretStores.vault-store.enabled: false
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Vault with namespace when set
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.vault-store.enabled: true
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.namespace: my-ns
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
    asserts:
      - equal:
          path: spec.provider.vault.namespace
          value: my-ns

  # --- AWS ---

  - it: should render SecretStore for AWS SecretsManager
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.aws-store.enabled: true
      integrations.eso.secretStores.aws-store.provider.aws.service: SecretsManager
      integrations.eso.secretStores.aws-store.provider.aws.region: us-east-1
      integrations.eso.secretStores.aws-store.provider.aws.auth.jwt.audiences[0]: sts.amazonaws.com
    asserts:
      - isKind:
          of: SecretStore
      - matchRegex:
          path: metadata.name
          pattern: -aws-store$
      - equal:
          path: spec.provider.aws.service
          value: SecretsManager
      - equal:
          path: spec.provider.aws.region
          value: us-east-1
      - equal:
          path: spec.provider.aws.auth.jwt.serviceAccountRef.name
          value: my-sa
      - equal:
          path: spec.provider.aws.auth.jwt.audiences[0]
          value: sts.amazonaws.com

  - it: should render SecretStore for AWS ParameterStore
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.aws-store.enabled: true
      integrations.eso.secretStores.aws-store.provider.aws.service: ParameterStore
      integrations.eso.secretStores.aws-store.provider.aws.region: eu-west-1
      integrations.eso.secretStores.aws-store.provider.aws.auth.jwt.audiences[0]: sts.amazonaws.com
    asserts:
      - equal:
          path: spec.provider.aws.service
          value: ParameterStore
      - equal:
          path: spec.provider.aws.region
          value: eu-west-1

  # --- GCP ---

  - it: should render SecretStore for GCP Secret Manager
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.gcp-store.enabled: true
      integrations.eso.secretStores.gcp-store.provider.gcpsm.projectID: my-project
      integrations.eso.secretStores.gcp-store.provider.gcpsm.auth.workloadIdentity.clusterLocation: us-central1
      integrations.eso.secretStores.gcp-store.provider.gcpsm.auth.workloadIdentity.clusterName: my-cluster
    asserts:
      - isKind:
          of: SecretStore
      - matchRegex:
          path: metadata.name
          pattern: -gcp-store$
      - equal:
          path: spec.provider.gcpsm.projectID
          value: my-project
      - equal:
          path: spec.provider.gcpsm.auth.workloadIdentity.clusterLocation
          value: us-central1
      - equal:
          path: spec.provider.gcpsm.auth.workloadIdentity.clusterName
          value: my-cluster
      - equal:
          path: spec.provider.gcpsm.auth.workloadIdentity.clusterProjectID
          value: my-project
      - equal:
          path: spec.provider.gcpsm.auth.workloadIdentity.serviceAccountRef.name
          value: my-sa

  - it: should use explicit clusterProjectID when set for GCP
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.gcp-store.enabled: true
      integrations.eso.secretStores.gcp-store.provider.gcpsm.projectID: my-project
      integrations.eso.secretStores.gcp-store.provider.gcpsm.auth.workloadIdentity.clusterLocation: us-central1
      integrations.eso.secretStores.gcp-store.provider.gcpsm.auth.workloadIdentity.clusterName: my-cluster
      integrations.eso.secretStores.gcp-store.provider.gcpsm.auth.workloadIdentity.clusterProjectID: other-project
    asserts:
      - equal:
          path: spec.provider.gcpsm.auth.workloadIdentity.clusterProjectID
          value: other-project

  # --- API version detection ---

  - it: should use v1 when rendering offline with no capabilities known
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.vault-store.enabled: true
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1

  - it: should use v1beta1 when only external-secrets.io/v1beta1 is in capabilities
    capabilities:
      apiVersions:
        - external-secrets.io/v1beta1
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.vault-store.enabled: true
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1

  - it: should use v1 when external-secrets.io/v1 is in capabilities
    capabilities:
      apiVersions:
        - external-secrets.io/v1
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.vault-store.enabled: true
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1

  # --- Labels ---

  - it: should render workload labels with part-of
    set:
      serviceAccount.name: my-sa
      integrations.eso.secretStores.vault-store.enabled: true
      integrations.eso.secretStores.vault-store.provider.vault.server: https://vault.example.com
      integrations.eso.secretStores.vault-store.provider.vault.path: secret
      integrations.eso.secretStores.vault-store.provider.vault.auth.jwt.role: my-role
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: vault-store
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: test-release-universal-helm-chart
