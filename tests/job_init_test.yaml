suite: test job-init
templates:
  - job-init.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not render when initJob disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Job when initJob enabled
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - isKind:
          of: Job
      - equal:
          path: apiVersion
          value: batch/v1

  - it: should have correct name with -init suffix
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: -init$

  - it: should have ArgoCD Sync hook annotation
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync

  - it: should set backoffLimit
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.backoffLimit: 5
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 5

  - it: should default backoffLimit to 3
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 3

  - it: should render task as initContainer
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - isNotNull:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: migrate

  - it: should skip disabled tasks
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: false
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - isNull:
          path: spec.template.spec.initContainers[0]

  - it: should include job-completed completion container
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: job-completed

  - it: should use custom completionImage
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.completionImage: busybox:latest
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: busybox:latest

  - it: should set restartPolicy to Never
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  - it: should merge extra metadata annotations
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.metadataAnnotations.custom/note: hello
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: metadata.annotations["custom/note"]
          value: hello
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync

  # --- R2: ttlSecondsAfterFinished ---

  - it: should render ttlSecondsAfterFinished when set
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.ttlSecondsAfterFinished: 7200
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 7200

  - it: should render default ttlSecondsAfterFinished 3600
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 3600

  # --- R3: activeDeadlineSeconds ---

  - it: should render activeDeadlineSeconds when set
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.activeDeadlineSeconds: 900
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 900

  - it: should not render activeDeadlineSeconds when null
    set:
      image.repository: nginx
      image.tag: latest
      initJob.enabled: true
      initJob.tasks.migrate.enabled: true
      initJob.tasks.migrate.command: echo migrate
    asserts:
      - isNull:
          path: spec.activeDeadlineSeconds
