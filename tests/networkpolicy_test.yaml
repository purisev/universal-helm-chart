suite: test networkpolicy
templates:
  - networkpolicy.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not render when no workloads have networkPolicy enabled
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render NetworkPolicy for Deployment when enabled
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1
      - matchRegex:
          path: metadata.name
          pattern: -web$

  - it: should render NetworkPolicy for StatefulSet when enabled
    set:
      image.repository: redis
      image.tag: alpine
      statefulSets.redis.enabled: true
      statefulSets.redis.networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - matchRegex:
          path: metadata.name
          pattern: -redis$

  - it: should use default policyTypes Ingress when not set
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.policyTypes[0]
          value: Ingress

  - it: should render custom policyTypes
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.networkPolicy.enabled: true
      deployments.web.networkPolicy.policyTypes:
        - Ingress
        - Egress
    asserts:
      - equal:
          path: spec.policyTypes[0]
          value: Ingress
      - equal:
          path: spec.policyTypes[1]
          value: Egress

  - it: should render ingress rules when set
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.networkPolicy.enabled: true
      deployments.web.networkPolicy.ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: frontend
          ports:
            - port: 8080
    asserts:
      - isNotNull:
          path: spec.ingress

  - it: should render egress rules when set
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.networkPolicy.enabled: true
      deployments.web.networkPolicy.policyTypes:
        - Egress
      deployments.web.networkPolicy.egress:
        - to:
            - podSelector:
                matchLabels:
                  app: db
    asserts:
      - isNotNull:
          path: spec.egress

  - it: should set podSelector matching workload selector labels
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.networkPolicy.enabled: true
    asserts:
      - isNotNull:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
      - isNotNull:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]

  - it: should render NetworkPolicy for both Deployment and StatefulSet
    set:
      image.repository: nginx
      image.tag: v1.0.0
      deployments.web.enabled: true
      deployments.web.networkPolicy.enabled: true
      statefulSets.db.enabled: true
      statefulSets.db.networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: should admit the interceptor next to the declared ingress rules under keda.http
    values:
      - fixtures/keda-http.yaml
    set:
      deployments.web.networkPolicy.ingress:
        - from: [{podSelector: {matchLabels: {role: client}}}]
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from: [{podSelector: {matchLabels: {role: client}}}]
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: keda
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/component: interceptor
                      app.kubernetes.io/name: http-add-on

  - it: should admit the interceptor from httpAddon.namespace when no ingress rule is declared
    values:
      - fixtures/keda-http.yaml
    set:
      integrations.keda.httpAddon.namespace: autoscaling
      deployments.web.networkPolicy.enabled: true
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels
          value:
            kubernetes.io/metadata.name: autoscaling

  - it: should not add an ingress rule to an egress-only policy
    values:
      - fixtures/keda-http.yaml
    set:
      deployments.web.networkPolicy:
        policyTypes: [Egress]
        egress: [{to: [{podSelector: {}}]}]
    asserts:
      - notExists:
          path: spec.ingress

  - it: should admit the interceptor for a StatefulSet
    values:
      - fixtures/keda-http-statefulset.yaml
    set:
      statefulSets.cache.networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels
          value:
            app.kubernetes.io/component: interceptor
            app.kubernetes.io/name: http-add-on

  - it: should not admit the interceptor when keda.http is disabled
    values:
      - fixtures/keda-http.yaml
    set:
      deployments.web.keda.http.enabled: false
      deployments.web.networkPolicy.enabled: true
    asserts:
      - notExists:
          path: spec.ingress
