suite: test imageupdater
templates:
  - imageupdater.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not render when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ImageUpdater when enabled
    set:
      imageUpdater.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ImageUpdater
      - equal:
          path: apiVersion
          value: argocd-image-updater.argoproj.io/v1alpha1

  - it: should default name to chart fullname
    set:
      imageUpdater.enabled: true
      fullnameOverride: test-release
    asserts:
      - equal:
          path: metadata.name
          value: test-release

  - it: should use custom name when specified
    set:
      imageUpdater.enabled: true
      imageUpdater.name: my-custom-updater
    asserts:
      - equal:
          path: metadata.name
          value: my-custom-updater

  - it: should default namespace to release namespace
    set:
      imageUpdater.enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: test-ns

  - it: should use custom namespace when specified
    set:
      imageUpdater.enabled: true
      imageUpdater.namespace: argocd
    asserts:
      - equal:
          path: metadata.namespace
          value: argocd

  - it: should have helm labels
    set:
      imageUpdater.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should render annotations when set
    set:
      imageUpdater.enabled: true
      imageUpdater.annotations:
        my-annotation: my-value
    asserts:
      - equal:
          path: metadata.annotations["my-annotation"]
          value: my-value

  - it: should render commonUpdateSettings when set
    set:
      imageUpdater.enabled: true
      imageUpdater.commonUpdateSettings.updateStrategy: semver
      imageUpdater.commonUpdateSettings.forceUpdate: false
      imageUpdater.commonUpdateSettings.ignoreTags[0]: latest
    asserts:
      - equal:
          path: spec.commonUpdateSettings.updateStrategy
          value: semver
      - equal:
          path: spec.commonUpdateSettings.forceUpdate
          value: false
      - equal:
          path: spec.commonUpdateSettings.ignoreTags[0]
          value: latest

  - it: should omit commonUpdateSettings when empty
    set:
      imageUpdater.enabled: true
    asserts:
      - isNull:
          path: spec.commonUpdateSettings

  - it: should render writeBackConfig when set
    set:
      imageUpdater.enabled: true
      imageUpdater.writeBackConfig.method: argocd
    asserts:
      - equal:
          path: spec.writeBackConfig.method
          value: argocd

  - it: should render git writeBackConfig
    set:
      imageUpdater.enabled: true
      imageUpdater.writeBackConfig.method: git
      imageUpdater.writeBackConfig.gitConfig.repository: git@github.com:myorg/config.git
      imageUpdater.writeBackConfig.gitConfig.branch: main
      imageUpdater.writeBackConfig.gitConfig.writeBackTarget: "helmvalues:/values.yaml"
    asserts:
      - equal:
          path: spec.writeBackConfig.method
          value: git
      - equal:
          path: spec.writeBackConfig.gitConfig.branch
          value: main

  - it: should omit writeBackConfig when empty
    set:
      imageUpdater.enabled: true
    asserts:
      - isNull:
          path: spec.writeBackConfig

  - it: should render applicationRefs with namePattern and images
    values:
      - fixtures/imageupdater-semver.yaml
    asserts:
      - equal:
          path: spec.applicationRefs[0].namePattern
          value: "my-app"
      - equal:
          path: spec.applicationRefs[0].images[0].alias
          value: app
      - equal:
          path: spec.applicationRefs[0].images[0].imageName
          value: "myregistry/myapp:v1.0.0"

  - it: should render applicationRefs with image-level commonUpdateSettings
    values:
      - fixtures/imageupdater-semver.yaml
    asserts:
      - equal:
          path: spec.applicationRefs[0].images[0].commonUpdateSettings.updateStrategy
          value: semver

  - it: should render applicationRefs with labelSelectors and git writeback
    values:
      - fixtures/imageupdater-git.yaml
    asserts:
      - equal:
          path: spec.applicationRefs[0].labelSelectors.matchLabels.environment
          value: production
      - equal:
          path: spec.writeBackConfig.method
          value: git
      - equal:
          path: spec.writeBackConfig.gitConfig.branch
          value: main

  - it: should render applicationRefs with useAnnotations
    set:
      imageUpdater.enabled: true
      imageUpdater.applicationRefs:
        - namePattern: "*"
          useAnnotations: true
    asserts:
      - equal:
          path: spec.applicationRefs[0].useAnnotations
          value: true

  - it: should omit applicationRefs when empty list
    set:
      imageUpdater.enabled: true
      imageUpdater.applicationRefs: []
    asserts:
      - isNull:
          path: spec.applicationRefs
