suite: test cronjob
templates:
  - cronjob.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should render CronJob when enabled
    set:
      image.repository: myapp
      image.tag: "1.0"
      cronJobs.cleanup.enabled: true
      cronJobs.cleanup.schedule: "0 2 * * *"
    asserts:
      - isKind:
          of: CronJob
      - matchRegex:
          path: metadata.name
          pattern: -cleanup$
      - equal:
          path: spec.schedule
          value: "0 2 * * *"
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: myapp:1.0

  - it: should not render CronJob when disabled
    set:
      image.repository: myapp
      image.tag: "1.0"
      cronJobs.cleanup.enabled: false
      cronJobs.cleanup.schedule: "0 2 * * *"
    asserts:
      - hasDocuments:
          count: 0

  - it: should set concurrencyPolicy and historyLimits
    set:
      image.repository: myapp
      image.tag: "1.0"
      cronJobs.sync.enabled: true
      cronJobs.sync.schedule: "*/5 * * * *"
      cronJobs.sync.concurrencyPolicy: Forbid
      cronJobs.sync.successfulJobsHistoryLimit: 2
      cronJobs.sync.failedJobsHistoryLimit: 1
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 2
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 1

  - it: should use default backoffLimit of 3
    set:
      image.repository: myapp
      image.tag: "1.0"
      cronJobs.nightly.enabled: true
      cronJobs.nightly.schedule: "@daily"
    asserts:
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 3

  - it: should use restartPolicy Never by default
    set:
      image.repository: myapp
      image.tag: "1.0"
      cronJobs.nightly.enabled: true
      cronJobs.nightly.schedule: "@daily"
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never

  # --- L3: timeZone ---

  - it: should render timeZone when set
    set:
      image.repository: myapp
      image.tag: "1.0"
      cronJobs.nightly.enabled: true
      cronJobs.nightly.schedule: "@daily"
      cronJobs.nightly.timeZone: "Europe/Moscow"
    asserts:
      - equal:
          path: spec.timeZone
          value: "Europe/Moscow"

  - it: should not render timeZone when not set
    set:
      image.repository: myapp
      image.tag: "1.0"
      cronJobs.nightly.enabled: true
      cronJobs.nightly.schedule: "@daily"
    asserts:
      - isNull:
          path: spec.timeZone
