suite: test ingress
templates:
  - ingress.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  - it: should not render when ingress disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Ingress when enabled
    set:
      ingress.enabled: true
      ingress.defaultBackend.serviceName: fallback
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1

  - it: should use release name for ingress name
    set:
      ingress.enabled: true
      ingress.defaultBackend.serviceName: fallback
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release

  - it: should set ingressClassName when specified
    set:
      ingress.enabled: true
      ingress.ingressClassName: traefik
      ingress.defaultBackend.serviceName: fallback
    asserts:
      - equal:
          path: spec.ingressClassName
          value: traefik

  - it: should set ingressClassName to nginx when specified
    set:
      ingress.enabled: true
      ingress.ingressClassName: nginx
      ingress.defaultBackend.serviceName: fallback
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should set ingressClassName to alb when specified
    set:
      ingress.enabled: true
      ingress.ingressClassName: alb
      ingress.defaultBackend.serviceName: fallback
    asserts:
      - equal:
          path: spec.ingressClassName
          value: alb

  - it: should omit ingressClassName when not set
    set:
      ingress.enabled: true
      ingress.ingressClassName: ""
      ingress.defaultBackend.serviceName: fallback
    asserts:
      - isNull:
          path: spec.ingressClassName

  - it: should render hosts and paths
    values:
      - fixtures/ingress-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].host
          value: myapp.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix

  - it: should render TLS when set
    values:
      - fixtures/ingress-full.yaml
    asserts:
      - isNotNull:
          path: spec.tls
      - equal:
          path: spec.tls[0].secretName
          value: myapp-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: myapp.example.com

  - it: should render annotations when set
    values:
      - fixtures/ingress-full.yaml
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/rewrite-target"]
          value: /

  - it: should have helm labels
    set:
      ingress.enabled: true
      ingress.defaultBackend.serviceName: fallback
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should default path servicePort to 80
    values:
      - fixtures/ingress-default-port.yaml
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80

  - it: should not render tls section when not set
    set:
      ingress.enabled: true
      ingress.defaultBackend.serviceName: fallback
    asserts:
      - isNull:
          path: spec.tls

  - it: should render multiple hosts in sorted order from a map
    set:
      ingress.enabled: true
      ingress.hosts:
        zeta.example.com:
          paths:
            - path: /z
              pathType: Prefix
        alpha.example.com:
          paths:
            - path: /a
              pathType: Prefix
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 2
      - equal:
          path: spec.rules[0].host
          value: alpha.example.com
      - equal:
          path: spec.rules[1].host
          value: zeta.example.com

  - it: should render TLS from list with secretName
    values:
      - fixtures/ingress-tls-with-secret.yaml
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: app-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: app.example.com

  - it: should render TLS without secretName when omitted
    values:
      - fixtures/ingress-tls-no-secret.yaml
    asserts:
      - isNotNull:
          path: spec.tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: app.example.com
      - isNull:
          path: spec.tls[0].secretName

  - it: should fail when neither hosts nor defaultBackend is set
    set:
      ingress.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "neither hosts nor defaultBackend is set"

  - it: should render defaultBackend when hosts is empty
    set:
      ingress.enabled: true
      ingress.defaultBackend.serviceName: fallback-svc
    asserts:
      - isNotNull:
          path: spec.defaultBackend
      - equal:
          path: spec.defaultBackend.service.name
          value: fallback-svc
      - isNull:
          path: spec.rules

  - it: should render multi-ingress map entries with separate ingress resources
    set:
      ingresses:
        internal:
          enabled: true
          ingressClassName: nginx-internal
          hosts:
            internal.example.com:
              paths:
                - path: /
                  pathType: Prefix
        external:
          enabled: true
          ingressClassName: nginx
          hosts:
            external.example.com:
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - hasDocuments:
          count: 2
      - matchRegex:
          path: metadata.name
          pattern: -external$
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: -internal$
        documentIndex: 1

  - it: should preserve declared path order inside a host (not alphabetical)
    set:
      ingress.enabled: true
      ingress.hosts:
        app.example.com:
          paths:
            - path: /b
              pathType: Prefix
            - path: /a
              pathType: Prefix
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 2
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /b
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /a

  - it: should evaluate a templated host and tls host through tpl
    values:
      - fixtures/ingress-templated-host.yaml
    asserts:
      - equal:
          path: spec.rules[0].host
          value: test-ns.example.com
      - equal:
          path: spec.tls[0].hosts[0]
          value: test-ns.example.com
