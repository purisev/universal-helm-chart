  # --- Gateway API channel guards: rule.sessionPersistence (Experimental only) ---

  - it: should render sessionPersistence when Experimental CRDs present (TCPRoute v1alpha2)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1alpha2/TCPRoute
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-api

  - it: should fail when sessionPersistence is set but cluster has only Standard CRDs (BackendTLSPolicy v1, no Experimental)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1/BackendTLSPolicy
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoute.rules:
        - sessionPersistence:
            sessionName: sticky
            type: Cookie
          serviceName: my-svc
          servicePort: 80
    asserts:
      - failedTemplate:
          errorPattern: "rule.sessionPersistence requires Gateway API Experimental"

  - it: should render sessionPersistence without capability check when gateway.networking.k8s.io/v1 absent (offline)
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-api
