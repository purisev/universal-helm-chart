suite: test httproute
templates:
  - httproute.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  # --- Basic ---

  - it: should not render when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render HTTPRoute when enabled
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1

  - it: should use release name for httproute name
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release

  - it: should have helm labels
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should render annotations when set
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: metadata.annotations["some-annotation"]
          value: some-value

  # --- parentRefs ---

  - it: should render parentRefs when set
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: my-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-system
      - equal:
          path: spec.parentRefs[0].sectionName
          value: https

  - it: should fail fast when httpRoute is enabled without parentRefs
    set:
      httpRoute.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "httpRoute is enabled .* but .Values.httpRoute.parentRefs is empty"

  # --- hostnames ---

  - it: should render hostnames when set
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: "app.example.com"

  - it: should omit hostnames when not set
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
    asserts:
      - isNull:
          path: spec.hostnames

  # --- rules: backendRefs ---

  - it: should render rules with explicit backendRefs
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: PathPrefix
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /api
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: my-release-api
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080

  # --- rules: shorthand serviceName/servicePort ---

  - it: should use serviceName shorthand in backendRefs
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[1].backendRefs[0].name
          value: my-release-web
      - equal:
          path: spec.rules[1].backendRefs[0].port
          value: 80

  - it: should default serviceName to fullname when not specified
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoute.rules:
        - {}
    asserts:
      - matchRegex:
          path: spec.rules[0].backendRefs[0].name
          pattern: ^test-release

  - it: should default servicePort to 80 when not specified
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoute.rules:
        - {}
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80

  # --- rules: filters ---

  - it: should render filters when set
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoute.rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301
          serviceName: my-svc
          servicePort: 80
    asserts:
      - equal:
          path: spec.rules[0].filters[0].type
          value: RequestRedirect
      - equal:
          path: spec.rules[0].filters[0].requestRedirect.scheme
          value: https

  # --- Per-workload rules ---

  - it: should render singleton HTTPRoute when deployment has httpRoute enabled
    values:
      - fixtures/httproute-workload.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute

  - it: should inherit parentRefs and hostnames from root httpRoute
    values:
      - fixtures/httproute-workload.yaml
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: my-gateway
      - equal:
          path: spec.hostnames[0]
          value: app.example.com

  - it: should merge workload rules in priority order
    values:
      - fixtures/httproute-workload.yaml
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /api
      - equal:
          path: spec.rules[1].matches[0].path.value
          value: /

  - it: should auto-set serviceName from workload name
    values:
      - fixtures/httproute-workload.yaml
    asserts:
      - matchRegex:
          path: spec.rules[0].backendRefs[0].name
          pattern: -api$
      - matchRegex:
          path: spec.rules[1].backendRefs[0].name
          pattern: -web$

  - it: should auto-set servicePort from workload service.port
    values:
      - fixtures/httproute-workload.yaml
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080
      - equal:
          path: spec.rules[1].backendRefs[0].port
          value: 80

  - it: should sort workloads alphabetically when no priority set
    values:
      - fixtures/httproute-sort.yaml
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /alpha
      - equal:
          path: spec.rules[1].matches[0].path.value
          value: /zoo

  - it: should merge statefulSet httpRoute rules into singleton
    set:
      httpRoute.parentRefs[0].name: my-gateway
      statefulSets.db.service.port: 5432
      statefulSets.db.httpRoute.enabled: true
      statefulSets.db.httpRoute.rules[0].matches[0].path.type: PathPrefix
      statefulSets.db.httpRoute.rules[0].matches[0].path.value: /db
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 5432

  - it: should not render singleton when all workload httpRoutes disabled
    set:
      deployments.web.httpRoute.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # --- Multi-HTTPRoute map ---

  - it: should not render httpRoutes entries when disabled
    set:
      httpRoutes.api.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render multiple HTTPRoutes from httpRoutes map
    set:
      httpRoutes.api.enabled: true
      httpRoutes.api.parentRefs[0].name: my-gateway
      httpRoutes.api.parentRefs[0].namespace: gateway-system
      httpRoutes.api.hostnames[0]: api.example.com
      httpRoutes.api.rules[0].serviceName: my-release-api
      httpRoutes.api.rules[0].servicePort: 8080
      httpRoutes.web.enabled: true
      httpRoutes.web.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoutes.web.hostnames[0]: app.example.com
      httpRoutes.web.rules[0].serviceName: my-release-web
      httpRoutes.web.rules[0].servicePort: 80
    asserts:
      - hasDocuments:
          count: 2

  - it: should name multi-route as fullname-key
    set:
      fullnameOverride: test-release
      httpRoutes.api.enabled: true
      httpRoutes.api.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoutes.api.rules[0].serviceName: my-svc
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-release-api

  - it: should render parentRefs in multi-route
    set:
      httpRoutes:
        api:
          enabled: true
          parentRefs:
            - name: my-gateway
              namespace: gateway-system
          rules:
            - serviceName: my-svc
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: my-gateway

  - it: should render hostnames in multi-route
    set:
      httpRoutes.api.enabled: true
      httpRoutes.api.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoutes.api.hostnames[0]: api.example.com
      httpRoutes.api.rules[0].serviceName: my-svc
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: api.example.com

  # --- rules: name field ---

  - it: should render rule name when set in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule

  - it: should omit rule name when not set
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoute.rules:
        - serviceName: my-svc
          servicePort: 80
    asserts:
      - isNull:
          path: spec.rules[0].name

  - it: should render rule name in per-workload rules
    values:
      - fixtures/httproute-workload-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule

  - it: should omit rule name when not set in per-workload rules
    values:
      - fixtures/httproute-workload-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].name

  - it: should render rule name in plural-map rules
    values:
      - fixtures/httproute-plural-full.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule

  - it: should omit rule name when not set in plural-map rules
    values:
      - fixtures/httproute-plural-full.yaml
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.rules[0].name

  # --- rules: timeouts ---

  - it: should render timeouts.request in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].timeouts.request
          value: 30s

  - it: should render timeouts.backendRequest in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].timeouts.backendRequest
          value: 10s

  - it: should omit timeouts when not set
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoute.rules:
        - serviceName: my-svc
          servicePort: 80
    asserts:
      - isNull:
          path: spec.rules[0].timeouts

  - it: should render only request timeout when backendRequest not set
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoute.rules:
        - timeouts:
            request: 60s
          serviceName: my-svc
          servicePort: 80
    asserts:
      - equal:
          path: spec.rules[0].timeouts.request
          value: 60s
      - isNull:
          path: spec.rules[0].timeouts.backendRequest

  - it: should render timeouts in per-workload rules
    values:
      - fixtures/httproute-workload-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].timeouts.request
          value: 30s
      - equal:
          path: spec.rules[0].timeouts.backendRequest
          value: 10s

  - it: should omit timeouts in per-workload rules when not set
    values:
      - fixtures/httproute-workload-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].timeouts

  - it: should render timeouts in plural-map rules
    values:
      - fixtures/httproute-plural-full.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.rules[0].timeouts.request
          value: 30s
      - equal:
          path: spec.rules[0].timeouts.backendRequest
          value: 10s

  - it: should omit timeouts in plural-map rules when not set
    values:
      - fixtures/httproute-plural-full.yaml
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.rules[0].timeouts

  # --- rules: retry ---

  - it: should render retry.attempts in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3

  - it: should render retry.codes in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].retry.codes[0]
          value: 503
      - equal:
          path: spec.rules[0].retry.codes[1]
          value: 504

  - it: should render retry.backoff in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].retry.backoff
          value: 1s

  - it: should omit retry when not set
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoute.rules:
        - serviceName: my-svc
          servicePort: 80
    asserts:
      - isNull:
          path: spec.rules[0].retry

  - it: should render retry in per-workload rules
    values:
      - fixtures/httproute-workload-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3
      - equal:
          path: spec.rules[0].retry.codes[0]
          value: 503
      - equal:
          path: spec.rules[0].retry.codes[1]
          value: 504
      - equal:
          path: spec.rules[0].retry.backoff
          value: 1s

  - it: should omit retry in per-workload rules when not set
    values:
      - fixtures/httproute-workload-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].retry

  - it: should render retry in plural-map rules
    values:
      - fixtures/httproute-plural-full.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3
      - equal:
          path: spec.rules[0].retry.codes[0]
          value: 503
      - equal:
          path: spec.rules[0].retry.codes[1]
          value: 504
      - equal:
          path: spec.rules[0].retry.backoff
          value: 1s

  - it: should omit retry in plural-map rules when not set
    values:
      - fixtures/httproute-plural-full.yaml
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.rules[0].retry

  # --- rules: name + timeouts + retry combined ---

  - it: should render all three new fields together on a single rule
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule
      - equal:
          path: spec.rules[0].timeouts.request
          value: 30s
      - equal:
          path: spec.rules[0].timeouts.backendRequest
          value: 10s
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3
      - equal:
          path: spec.rules[0].retry.backoff
          value: 1s

  - it: should not affect rule without new fields when mixed rules are present
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].name
      - isNull:
          path: spec.rules[1].timeouts
      - isNull:
          path: spec.rules[1].retry

  - it: should render name+timeouts+retry combined in per-workload rules
    values:
      - fixtures/httproute-workload-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule
      - equal:
          path: spec.rules[0].timeouts.request
          value: 30s
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3
      - equal:
          path: spec.rules[0].retry.backoff
          value: 1s

  - it: should render name+timeouts+retry combined in plural-map rules
    values:
      - fixtures/httproute-plural-full.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule
      - equal:
          path: spec.rules[0].timeouts.request
          value: 30s
      - equal:
          path: spec.rules[0].timeouts.backendRequest
          value: 10s
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3
      - equal:
          path: spec.rules[0].retry.backoff
          value: 1s

  # --- statefulSets per-workload rules: name, timeouts, retry ---

  - it: should render rule name in statefulSet per-workload rules
    values:
      - fixtures/httproute-statefulset-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule

  - it: should omit rule name when not set in statefulSet per-workload rules
    values:
      - fixtures/httproute-statefulset-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].name

  - it: should render timeouts in statefulSet per-workload rules
    values:
      - fixtures/httproute-statefulset-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].timeouts.request
          value: 30s
      - equal:
          path: spec.rules[0].timeouts.backendRequest
          value: 10s

  - it: should omit timeouts in statefulSet per-workload rules when not set
    values:
      - fixtures/httproute-statefulset-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].timeouts

  - it: should render retry in statefulSet per-workload rules
    values:
      - fixtures/httproute-statefulset-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3
      - equal:
          path: spec.rules[0].retry.codes[0]
          value: 503
      - equal:
          path: spec.rules[0].retry.codes[1]
          value: 504
      - equal:
          path: spec.rules[0].retry.backoff
          value: 1s

  - it: should omit retry in statefulSet per-workload rules when not set
    values:
      - fixtures/httproute-statefulset-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].retry

  - it: should render name+timeouts+retry combined in statefulSet per-workload rules
    values:
      - fixtures/httproute-statefulset-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule
      - equal:
          path: spec.rules[0].timeouts.request
          value: 30s
      - equal:
          path: spec.rules[0].timeouts.backendRequest
          value: 10s
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3
      - equal:
          path: spec.rules[0].retry.backoff
          value: 1s

  # --- Gateway API channel guards: rule.name (v1.4+ Standard or Experimental) ---

  - it: should render rule name when v1.4+ Standard CRDs present (BackendTLSPolicy v1)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1/BackendTLSPolicy
        # also needed because the full fixture uses retry (Experimental-only):
        - gateway.networking.k8s.io/v1alpha2/TCPRoute
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule

  - it: should render rule name when Experimental CRDs present (TCPRoute v1alpha2)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1alpha2/TCPRoute
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule

  - it: should fail when v1 group present but neither v1.4 Standard nor Experimental marker (pre-v1.4 Standard cluster)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - failedTemplate:
          errorPattern: "rule.name requires Gateway API v1.4\\+ Standard"

  - it: should render rule name without capability check when gateway.networking.k8s.io/v1 absent (offline)
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].name
          value: api-rule

  # --- Gateway API channel guards: rule.retry (Experimental only) ---

  - it: should render retry when Experimental CRDs present (TCPRoute v1alpha2)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1alpha2/TCPRoute
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3

  - it: should fail when retry is set but cluster has only Standard CRDs (BackendTLSPolicy v1, no Experimental)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - gateway.networking.k8s.io/v1/BackendTLSPolicy
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - failedTemplate:
          errorPattern: "rule.retry requires Gateway API Experimental"

  - it: should render retry without capability check when gateway.networking.k8s.io/v1 absent (offline)
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].retry.attempts
          value: 3

  # --- rules: sessionPersistence ---

  - it: should render sessionPersistence.sessionName in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-api

  - it: should render sessionPersistence.type in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.type
          value: Cookie

  - it: should render sessionPersistence timeouts in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.absoluteTimeout
          value: 1h
      - equal:
          path: spec.rules[0].sessionPersistence.idleTimeout
          value: 10m

  - it: should render sessionPersistence.cookieConfig.lifetimeType in root rules
    values:
      - fixtures/httproute-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.cookieConfig.lifetimeType
          value: Permanent

  - it: should omit sessionPersistence when not set
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {name: my-gw, namespace: gateway-ns}
      httpRoute.rules:
        - serviceName: my-svc
          servicePort: 80
    asserts:
      - isNull:
          path: spec.rules[0].sessionPersistence

  - it: should render sessionPersistence in per-workload rules
    values:
      - fixtures/httproute-workload-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-api
      - equal:
          path: spec.rules[0].sessionPersistence.type
          value: Cookie
      - equal:
          path: spec.rules[0].sessionPersistence.cookieConfig.lifetimeType
          value: Permanent

  - it: should omit sessionPersistence in per-workload rules when not set
    values:
      - fixtures/httproute-workload-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].sessionPersistence

  - it: should render sessionPersistence in statefulSet per-workload rules
    values:
      - fixtures/httproute-statefulset-full.yaml
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-api
      - equal:
          path: spec.rules[0].sessionPersistence.cookieConfig.lifetimeType
          value: Permanent

  - it: should omit sessionPersistence in statefulSet per-workload rules when not set
    values:
      - fixtures/httproute-statefulset-full.yaml
    asserts:
      - isNull:
          path: spec.rules[1].sessionPersistence

  - it: should render sessionPersistence in plural-map rules
    values:
      - fixtures/httproute-plural-full.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: sticky-api
      - equal:
          path: spec.rules[0].sessionPersistence.cookieConfig.lifetimeType
          value: Permanent

  - it: should omit sessionPersistence in plural-map rules when not set
    values:
